# Развёртывание «План V3»: база и приложение.
#
# База поднимается ПУСТОЙ. Никаких данных в образе и в репозитории нет: реальные
# выгрузки содержат номера контрактов, объёмы и названия площадок. Справочники и
# планы заводятся через интерфейс, либо разово заливаются администратором
# (см. README, раздел «Перенос данных из файла»).

services:
  db:
    image: postgres:16-alpine
    container_name: plan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-plandb}
      POSTGRES_USER: ${PG_USER:-planuser}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?нужен PG_PASSWORD — задайте в .env}
    volumes:
      - plan_pgdata:/var/lib/postgresql/data
    # Наружу порт не выставляем: к базе ходит только приложение. Если нужен
    # доступ psql с хоста — раскомментируйте, но помните, что это открытая дверь.
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-planuser} -d ${PG_DB:-plandb}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: plan-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?нужен DJANGO_SECRET_KEY — задайте в .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      PG_DB: ${PG_DB:-plandb}
      PG_USER: ${PG_USER:-planuser}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_HOST: db
      PG_PORT: 5432
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "${PLAN_PORT:-8000}:8000"

volumes:
  plan_pgdata:
