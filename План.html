// ── Черновик незавершённого ввода форм «+ Добавить» (живёт до перезагрузки) ──
// Снимается перед перерисовкой вкладки (innerHTML затирает форму) и возвращается после.
const addFormDrafts = {};            // { fieldId: value | [values] }
let _suppressDraftCaptureOnce = false;

function captureAddFormDrafts() {
  if (_suppressDraftCaptureOnce) { _suppressDraftCaptureOnce = false; return; }
  document.querySelectorAll('.add-form:not([data-noautodraft]) input, .add-form:not([data-noautodraft]) select, .add-form:not([data-noautodraft]) textarea')
    .forEach(el => {
      if (!el.id || el.type === 'button' || el.type === 'submit' || el.type === 'file' || el.disabled) return;
      addFormDrafts[el.id] = el.multiple ? [...el.selectedOptions].map(o => o.value) : el.value;
    });
}

function restoreAddFormDrafts() {
  // Pass A: каскадные select — выставить значение и дёрнуть change (пересобрать зависимые поля).
  for (const id in addFormDrafts) {
    const el = document.getElementById(id);
    if (el && el.tagName === 'SELECT' && !el.multiple) {
      el.value = addFormDrafts[id];
      el.dispatchEvent(new Event('change'));
    }
  }
  // Pass B: выставить все значения (перекрывает дефолты, проставленные каскадом).
  for (const id in addFormDrafts) {
    const el = document.getElementById(id);
    if (!el) continue;
    if (el.multiple) { const set = new Set(addFormDrafts[id]); [...el.options].forEach(o => o.selected = set.has(o.value)); }
    else el.value = addFormDrafts[id];
  }
}

function clearAddFormDraft(ids) { ids.forEach(id => delete addFormDrafts[id]); }

function renderTab(tab) {
  captureAddFormDrafts();
  if (tab !== 'microplan') microWorkersDetailsOpenRowId = null;
  if (tab !== 'manualFrv') manualFrvSegOpenRowId = null;
  if      (tab==='home')           renderHome();
  else if (tab==='contracts')      renderContracts();
  else if (tab==='manualFrv')      renderManualFrv();
  else if (tab==='macroplan')      renderMacroplan();
  else if (tab==='customerOrders') renderCustomerOrders();
  else if (tab==='orders')         renderProductionOrders();
  else if (tab==='microplan')      renderMicroplan();
  else if (tab==='schedule')       renderSchedules();
  else if (tab==='analytics')      renderAnalytics();
  else if (tab==='gantt')          renderGantt();
  else if (tab==='refs')           renderRefs();
  restoreAddFormDrafts();
  srvInjectBanner(tab);
}

/** Полоса серверного режима поверх готовой вкладки.
 *
 *  Вставляется здесь, а не внутри каждого `render*`: те строят разметку через
 *  `innerHTML` целиком, и добавление полосы в каждый из девяти рендеров означало бы
 *  девять мест, где её однажды забудут. У справочников полоса своя (внутри вкладки,
 *  под подвкладками) — их пропускаем. */
function srvInjectBanner(tab) {
  srvApplyReadonly(tab);
  if (tab === 'refs' || !SRV_TAB_KINDS[tab]) return;
  const pane = document.getElementById('tab-' + tab);
  if (!pane || pane.querySelector('[data-srv-banner]')) return;
  const wrap = document.createElement('div');
  wrap.setAttribute('data-srv-banner', tab);
  wrap.innerHTML = srvBannerHtml(tab);
  pane.insertBefore(wrap, pane.firstChild);
}

/** Раздел, который правится с этой вкладки. Диаграмма и аналитика ничего не
 *  правят — они показывают чужие данные. */
const SRV_TAB_SECTION = {
  refs: 'refs', contracts: 'contracts', orders: 'contracts',
  macroplan: 'macroplan', schedule: 'schedule', manualFrv: 'schedule',
  microplan: 'microplan', analytics: null, gantt: null,
};

/** Погасить ввод на вкладке, которую человек не правит.
 *
 *  Настоящий запрет — на сервере; здесь мы лишь не даём заполнять форму, которая
 *  всё равно не сохранится. Фильтры (`.filter-row`) и полосу режима не трогаем:
 *  смотреть данные под разными срезами имеет право и тот, кто их не правит. */
function srvApplyReadonly(tab) {
  const pane = document.getElementById('tab-' + tab);
  if (!pane) return;
  const locked = SRV.on && !srvCanEdit(SRV_TAB_SECTION[tab]);
  pane.querySelectorAll('[data-srv-locked]').forEach(el => {
    el.disabled = false;
    el.removeAttribute('data-srv-locked');
  });
  if (!locked) return;
  pane.querySelectorAll('input, select, textarea, button').forEach(el => {
    if (el.closest('.filter-row') || el.closest('[data-srv-banner]')) return;
    if (el.disabled) return;
    el.disabled = true;
    el.setAttribute('data-srv-locked', '1');
    el.title = 'Раздел доступен только для просмотра';
  });
}

async function deleteCustomerOrder(id) {
  const linked = linksForCO(id);
  const msg = linked.length
    ? `Удалить заказ клиента? Привязки к ${linked.length} заказам на производство будут удалены (сами заказы на производство останутся).`
    : 'Удалить заказ клиента?';
  if (!await _confirm(msg)) return;
  S.orderLinks = (S.orderLinks || []).filter(l => l.customerOrderId !== +id);
  S.microplan = S.microplan.filter(m => m.contractId !== id);
  S.customerOrders = S.customerOrders.filter(c => c.id !== id);
  save();
  renderActive();
}

async function deleteContract(id) {
  if (!await _confirm('Удалить контракт? Все связанные заказы клиентов, производственные заказы и макроплан будут удалены.')) return;
  const coIds = S.customerOrders.filter(c => c.contractId === id).map(c => c.id);
  for (const coId of coIds) {
    const linkedPoIds = linksForCO(coId).map(l => l.productionOrderId);
    const ordersToDel = S.orders.filter(o => linkedPoIds.includes(o.id));
    for (const o of ordersToDel) {
      S.orderLinks = (S.orderLinks || []).filter(l => l.productionOrderId !== o.id);
      S.microplan = S.microplan.filter(m => !releaseOrderEq(m.releaseOrder, o.number) && !(m.launches||[]).some(le=>releaseOrderEq(le.order,o.number)));
      S.orders = S.orders.filter(x => x.id !== o.id);
    }
    S.orderLinks = (S.orderLinks || []).filter(l => l.customerOrderId !== coId);
    S.microplan = S.microplan.filter(m => m.contractId !== coId);
  }
  S.customerOrders = S.customerOrders.filter(c => c.contractId !== id);
  S.macroplan = S.macroplan.filter(r => r.contractId !== id);
  S.contracts = S.contracts.filter(c => c.id !== id);
  save();
  renderActive();
}

async function deleteProductionOrder(id) {
  const order = byId(S.orders, id);
  if (!order) return;
  if (!await _confirm(`Удалить производственный заказ "${order.number}"? Все строки макроплана, микроплана и привязки к заказам клиентов будут удалены.`)) return;
  S.orderLinks = (S.orderLinks || []).filter(l => l.productionOrderId !== +id);
  S.macroplan = S.macroplan.filter(r => r.orderNumber !== order.number);
  S.microplan = S.microplan.filter(m => !releaseOrderEq(m.releaseOrder, order.number) && !(m.launches||[]).some(le=>releaseOrderEq(le.order,order.number)));
  S.orders = S.orders.filter(o => o.id !== id);
  save();
  renderActive();
}

function moveProdOrder(id, dir) {
  const idx = S.orders.findIndex(o => o.id === id);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= S.orders.length) return;
  [S.orders[idx], S.orders[newIdx]] = [S.orders[newIdx], S.orders[idx]];
  save();
  renderProductionOrders();
}

         (S.macroplan && S.macroplan.length > 0) ||

function _downloadJson(data, filename) {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function _loadJsonFile(file, onParsed) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try { onParsed(JSON.parse(e.target.result)); }
    catch(err) { _alert('Ошибка чтения файла: ' + err.message); }
  };
  reader.readAsText(file, 'UTF-8');
}

/** Убрать служебные поля серверного режима (`srvId`, `srvVersion`) из выгрузки.
 *
 *  Они появляются на записях, загруженных с сервера, и к данным «Плана» отношения
 *  не имеют. В файле они не нужны, а при обратной загрузке уехали бы в `extra`
 *  записи и вернулись бы оттуда в следующем экспорте — файл перестал бы совпадать
 *  с исходником, и настоящие потери утонули бы в этом шуме (DATA_CONTRACT.md §4). */
function _stripSrvKeys(value) {
  if (Array.isArray(value)) return value.map(_stripSrvKeys);
  if (value && typeof value === 'object') {
    const out = {};
    for (const k in value) {
      if (k === 'srvId' || k === 'srvVersion') continue;
      out[k] = _stripSrvKeys(value[k]);
    }
    return out;
  }
  return value;
}

function _applyFullImport(imported) {
  S.bases = imported.bases || [];
  S.nomenclature = imported.nomenclature || [];
  S.ops = (imported.ops || []).map(function(op) {
    if (op.shiftDuration === undefined) op.shiftDuration = 480;
    if (op.type === undefined) op.type = 'БТК';
    return op;
  });
  if (!imported.customerOrders && imported.contracts && imported.contracts.length) {
    const old = imported.contracts;
    S.customerOrders = old.map(c => ({ ...c, contractId: c.id }));
    S.contracts = old.map(c => ({ id: c.id, number: c.number, articleGp: c.articleGp, name: c.name, quantity: c.quantity, deliveryDate: c.deliveryDate }));
  } else {
    S.contracts = imported.contracts || [];
    S.customerOrders = imported.customerOrders || [];
  }
  S.orders = imported.orders || [];
  S.macroplan = imported.macroplan || [];
  S.microplan = imported.microplan || [];
  migrateMicroplanArticleItems(); migrateMicroplanWorkers(); migrateNomenclatureBundleRows(); migrateMacroplanProcessQty();
  S.schedules = imported.schedules || [];
  S.scheduleMonthOverrides = imported.scheduleMonthOverrides || [];
  S.calOverrides = imported.calOverrides || [];
  migrateSchedulesGraphPreset(); migrateScheduleWorkers();
  S.holidays = imported.holidays || [];
  S.manualFrv = Array.isArray(imported.manualFrv) ? imported.manualFrv : [];
  for (const mr of S.manualFrv) { if (!Array.isArray(mr.frvSegments)) mr.frvSegments = []; }
  S.manualFrvExtraMonths = Array.isArray(imported.manualFrvExtraMonths) ? imported.manualFrvExtraMonths : [];
  S.manualFrvPivotExtraRows = Array.isArray(imported.manualFrvPivotExtraRows) ? imported.manualFrvPivotExtraRows : [];
  S.deliveryMatrix = Array.isArray(imported.deliveryMatrix) ? imported.deliveryMatrix : [];
  S.planBaseline = Array.isArray(imported.planBaseline) ? imported.planBaseline : [];
  // Связи ЗК↔ПЗ берём ИЗ ФАЙЛА. Раньше это поле здесь не выставлялось вообще: при загрузке
  // чужого файла в открытую вкладку связи от предыдущего набора данных оставались и
  // указывали на несуществующие заказы (id из другого набора). `null` для старых файлов
  // без поля — тогда `migrateOrderLinks()` ниже восстановит связи из `order.contractId`.
  S.orderLinks = Array.isArray(imported.orderLinks) ? imported.orderLinks : null;
  // Эффективность макроплана: восстановить из старых файлов нечем, поэтому пустой массив —
  // важно, чтобы не остались значения от предыдущего набора данных (вернётся дефолт 100%).
  S.macroEff = Array.isArray(imported.macroEff) ? imported.macroEff : [];
  S.tcRcOverrides = (imported.tcRcOverrides && typeof imported.tcRcOverrides === 'object' && !Array.isArray(imported.tcRcOverrides)) ? imported.tcRcOverrides : {};
  S.tcShOverrides = (imported.tcShOverrides && typeof imported.tcShOverrides === 'object' && !Array.isArray(imported.tcShOverrides)) ? imported.tcShOverrides : {};
  migrateNomenclatureAssortment(); migrateContractsQty(); migrateContractsDeadlines(); migrateNomenclatureBPBTK();
  migrateMicroplanOrder2(); migrateMicroplanStage(); migrateOpsProcesses(); migrateOpsBasesToBases(); migrateOrderDeliveries();
  migrateNomenclatureToRoute(); migrateNomenclatureRouteOverrides(); migrateOrderLinks(); migrateOrderStageOps(); migrateMacroplanVolumeType();
  migrateMicroplanArticleByStage();
  recalcAllMicroPlans();
  recalcNextId();
  save();
  renderActive();
  _alert('Данные успешно загружены.');
}

function importAllData(file, silent) {
  if (!file) return;
  // Загрузка файла ЗАМЕЩАЕТ данные целиком. В серверном режиме это разошлось бы с
  // базой: синхронизация увидела бы чужой набор записей и попыталась привести
  // сервер к нему — то есть залила бы файл одного пользователя всем остальным.
  if (SRV.on) {
    _alert('Идёт серверный режим — загрузка файла заменила бы данные только у вас ' +
           'и разошлась бы с базой.\n\n' +
           (SRV.user && SRV.user.is_superuser
             ? 'Чтобы залить выгрузку в базу, нажмите «Залить файл» в зелёной полосе: ' +
               'там есть режим слияния, при котором ничего не пропадёт.'
             : 'Выключите серверный режим, чтобы работать с файлом локально, либо ' +
               'попросите администратора залить выгрузку на сервер.'));
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      _applyFileData(imported);
    } catch (err) {
      _alert('Ошибка загрузки: ' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function toggleContractExpand(id) {
  if (contractsExpanded.has(+id)) contractsExpanded.delete(+id);
  else contractsExpanded.add(+id);
  renderContracts();
}

function contractDeadlineCheck(contractId, deadlineDate, deadlineQty) {
  if (!deadlineDate) return null;
  const dlMonth = deadlineDate.slice(0, 7);
  const rows = (S.macroplan || []).filter(r => r.contractId === +contractId);
  if (!rows.length) return 'no-plan';
  const STAGE_ORDER = ['РЦ', 'АЦ', 'ШЦ', 'У'];
  const stages = [...new Set(rows.map(r => stageOfMacroRow(r)))];
  const lastStage = [...STAGE_ORDER].reverse().find(s => stages.includes(s));
  if (!lastStage) return 'no-plan';
  const planned = rows
    .filter(r => stageOfMacroRow(r) === lastStage && (r.month || '') <= dlMonth)
    .reduce((s, r) => s + (+r.qtySew || 0), 0);
  if (planned === 0) return 'no-plan';
  if (planned >= +deadlineQty) return 'ok';
  return 'partial';
}

function addContractDeadline(contractId) {
  const c = byId(S.contracts, +contractId);
  if (!c) return;
  const date = (document.getElementById('ct-dl-date-' + contractId) || {}).value || '';
  const qty = Math.max(0, +((document.getElementById('ct-dl-qty-' + contractId) || {}).value) || 0);
  if (!date) { _alert('Укажите дату срока поставки.'); return; }
  if (!Array.isArray(c.deadlines)) c.deadlines = [];
  c.deadlines.push({ id: nid(), date, quantity: qty });
  save();
  renderContracts();
}

function updContractDeadline(contractId, deadlineId, field, val) {
  const c = byId(S.contracts, +contractId);
  if (!c || !Array.isArray(c.deadlines)) return;
  const d = c.deadlines.find(x => x.id === +deadlineId);
  if (!d) return;
  if (field === 'date') d.date = String(val || '');
  else if (field === 'quantity') d.quantity = Math.max(0, +val || 0);
  save();
  renderContracts();
}

function removeContractDeadline(contractId, deadlineId) {
  const c = byId(S.contracts, +contractId);
  if (!c || !Array.isArray(c.deadlines)) return;
  c.deadlines = c.deadlines.filter(x => x.id !== +deadlineId);
  save();
  renderContracts();
}

function addContractArticleItem(contractId) {
  const c = byId(S.contracts, +contractId);
  if (!c) return;
  const ai = ((document.getElementById('ct-ai-input-' + contractId) || {}).value || '').trim();
  if (!ai) { _alert('Укажите артикул ГП.'); return; }
  if (!Array.isArray(c.articleItems)) c.articleItems = [];
  if (c.articleItems.find(x => x.articleItem === ai)) { _alert('Этот артикул уже добавлен.'); return; }
  c.articleItems.push({ id: nid(), articleItem: ai });
  save();
  renderContracts();
}

function updContractItemDeadline(contractId, itemId, deadlineId) {

function removeContractItem(contractId, itemId) {

function updContractFieldTab(id, field, val) {
  const c = byId(S.contracts, id);
  if (!c) return;
  if (field === 'quantity') c.quantity = Math.max(0, +val || 0);
  else if (field === 'deliveryDate') c.deliveryDate = val;
  else if (field === 'number') c.number = String(val || '').trim();
  else if (field === 'articleGp') c.articleGp = String(val || '').trim();
  else if (field === 'name') c.name = String(val || '').trim();
  save();
  renderActive();
}

function updContractSchedEntry(id, idx, field, val) {
  const c = byId(S.contracts, id);
  if (!c || !Array.isArray(c.deliverySchedule) || !c.deliverySchedule[idx]) return;
  if (field === 'month') c.deliverySchedule[idx].month = String(val || '');
  else if (field === 'quantity') c.deliverySchedule[idx].quantity = Math.max(0, +val || 0);
  save();
  renderActive();
}

function addContractSchedEntry(id) {
  const c = byId(S.contracts, id);
  if (!c) return;
  if (!Array.isArray(c.deliverySchedule)) c.deliverySchedule = [];
  c.deliverySchedule.push({ month: '', quantity: 0 });
  save();
  renderActive();
}

function removeContractSchedEntry(id, idx) {
  const c = byId(S.contracts, id);
  if (!c || !Array.isArray(c.deliverySchedule)) return;
  c.deliverySchedule.splice(idx, 1);
  save();
  renderActive();
}

function addContractNextMonth(id) {
  const c = byId(S.contracts, id);
  if (!c) return;
  if (!Array.isArray(c.deliverySchedule)) c.deliverySchedule = [];
  const months = c.deliverySchedule.map(s => s.month).filter(Boolean).sort();
  let next;
  if (months.length) {
    const last = months[months.length - 1];
    const [y, m] = last.split('-').map(Number);
    next = `${m === 12 ? y + 1 : y}-${String(m === 12 ? 1 : m + 1).padStart(2, '0')}`;
  } else {
    next = new Date().toISOString().slice(0, 7);
  }
  if (c.deliverySchedule.find(s => s.month === next)) {
    _alert(`Месяц ${mlabel(next)} уже добавлен.`);
    return;
  }
  c.deliverySchedule.push({ month: next, quantity: null });
  save();
  renderActive();
  setTimeout(() => {
    const inp = document.querySelector(`#tab-contracts input[data-cid="${id}"][data-month="${next}"]`);
    if (inp) { inp.focus(); inp.select(); }
  }, 0);
}

function addContractSpecificMonth(id, month) {
  const c = byId(S.contracts, id);
  if (!c || !month) return;
  if (!Array.isArray(c.deliverySchedule)) c.deliverySchedule = [];
  if (c.deliverySchedule.find(s => s.month === month)) return;
  c.deliverySchedule.push({ month, quantity: null });
  save();
  renderActive();
  setTimeout(() => {
    const inp = document.querySelector(`#tab-contracts input[data-cid="${id}"][data-month="${month}"]`);
    if (inp) { inp.focus(); inp.select(); }
  }, 0);
}

function allNomArticleItemsFiltered(op, contractId, workshop) {
  // contractId — id КОНКРЕТНОГО контракта (а не номер): иначе при одинаковых номерах
  // у разных контрактов в список попадали артикулы чужих изделий.
  let contractArticleGps = null;
  if (contractId) {
    const c = byId(S.contracts, contractId);
    if (c) {
      contractArticleGps = new Set();
      if (c.articleGp) contractArticleGps.add(c.articleGp);
      for (const item of (c.articleItems || [])) {
        if (item.articleItem) contractArticleGps.add(item.articleItem);
      }
    }
  }
  // Determine which stage to show based on op+workshop (via S.ops processType)
  let stageFilter = null;
  if (op && workshop) {
    const opRec = S.ops.find(o => o.name === op && o.workshop === workshop);
    if (opRec && opRec.processType) stageFilter = opRec.processType;
  }
  const items = new Set();
  for (const n of S.nomenclature) {
    if (op && nomRowOps(n).length && !nomRowOps(n).includes(op)) continue;
    if (workshop) {
      const wss = nomRowWorkshops(n);
      if (wss.length && !wss.includes(workshop)) continue;
    }
    if (contractArticleGps && !contractArticleGps.has(n.articleGp)) continue;
    for (const item of routeForOp(n, op)) {
      if (!item.articleItem) continue;
      if (stageFilter && item.stage !== stageFilter) continue;
      items.add(item.articleItem);
    }
  }
  return [...items];
}

function renderContracts() {
  const el = document.getElementById('tab-contracts');
  if (!el) return;
  const _focus = _ctxFocusSave(el);
  const rows = S.contracts || [];
  const gpDatalist = uniqueGps().map(g => `<option value="${esc(g)}">`).join('');
  const STAGE_ORDER = ['РЦ', 'АЦ', 'ШЦ', 'У'];

  const dlStatusHtml = status => {
    if (!status) return '<span style="color:#94a3b8;font-size:11px">—</span>';
    if (status === 'no-plan') return '<span style="color:#b45309;font-size:11px;font-weight:600">⚠ не запланировано</span>';
    if (status === 'ok') return '<span style="color:#16a34a;font-size:12px;font-weight:600">✓ Успеваем</span>';
    if (status === 'partial') return '<span style="color:#ea580c;font-size:11px;font-weight:600">⚠ частично</span>';
    return '<span style="color:#dc2626;font-size:12px;font-weight:600">✗ Не успеваем</span>';
  };


  const fNum = contractsFilters.number.trim().toLowerCase();
  const fGp  = contractsFilters.articleGp.trim().toLowerCase();
  const visibleRows = rows.filter(c => {
    if (fNum && !c.number.toLowerCase().includes(fNum)) return false;
    if (fGp  && !c.articleGp.toLowerCase().includes(fGp)) return false;
    return true;
  });

  let body = '';
  if (!visibleRows.length) {
    body = `<tr><td colspan="6" class="empty">${rows.length ? 'Нет контрактов по фильтру' : 'Пока нет записей — добавьте контракт формой выше.'}</td></tr>`;
  } else {
    for (const c of visibleRows) {
      const isExpanded = contractsExpanded.has(c.id);
      const totalQty = contractTotalQty(c);
      const deadlines = Array.isArray(c.deadlines) ? c.deadlines : [];
      const articleItems = Array.isArray(c.articleItems) ? c.articleItems : [];

      // Main row (clickable)
      body += `<tr class="ct-main-row" onclick="toggleContractExpand(${c.id})">
        <td style="width:22px;text-align:center;color:#64748b;font-size:11px;user-select:none">${isExpanded ? '▼' : '▶'}</td>
        <td><b>${esc(c.number)}</b></td>
        <td style="font-family:monospace;font-size:12px;color:#475569">${esc(c.articleGp)}</td>
        <td>${esc(c.name)}</td>
        <td style="text-align:right;white-space:nowrap;color:#1e293b">${totalQty > 0 ? totalQty.toLocaleString('ru') + ' шт' : '<span style="color:#94a3b8">—</span>'}</td>
        <td onclick="event.stopPropagation()" style="text-align:center"><button type="button" class="btn btn-danger btn-sm" onclick="deleteContract(${c.id})">✕</button></td>
      </tr>`;

      if (!isExpanded) continue;

      // ── Редактирование полей контракта ───────────────────────────
      body += `<tr class="ct-sub-row" style="background:#f0f9ff">
        <td></td>
        <td colspan="5" style="padding:5px 14px">
          <label style="font-size:11px;margin-right:10px">Номер:&nbsp;<input type="text" value="${esc(c.number)}" style="font-size:12px;width:120px;border:1px solid #cbd5e1;border-radius:3px;padding:2px 5px" onblur="updContractFieldTab(${c.id},'number',this.value)"></label>
          <label style="font-size:11px;margin-right:10px">Артикул ГП:&nbsp;<input type="text" value="${esc(c.articleGp)}" list="ct-gp-dl" style="font-size:12px;width:120px;border:1px solid #cbd5e1;border-radius:3px;padding:2px 5px" onblur="updContractFieldTab(${c.id},'articleGp',this.value)"></label>
          <label style="font-size:11px">Наименование:&nbsp;<input type="text" value="${esc(c.name)}" style="font-size:12px;width:200px;border:1px solid #cbd5e1;border-radius:3px;padding:2px 5px" onblur="updContractFieldTab(${c.id},'name',this.value)"></label>
        </td>
      </tr>`;

      // ── Сроки поставки ──────────────────────────────────────────
      body += `<tr class="ct-sub-head"><td></td><td colspan="5">СРОКИ ПОСТАВКИ</td></tr>`;

      // Отслеживание: используем артикулы из секции "Артикулы ГП" контракта,
      // т.к. основной articleGp может не быть в номенклатуре.
      // Отслеживаем ВСЕ переделы маршрута (РЦ / АЦ / ШЦ / У), а не только последний.
      const _cMacroRows = (S.macroplan || []).filter(r => r.contractId === +c.id);
      const _gpArticles = (c.articleItems || []).map(x => x.articleItem).filter(Boolean);
      const _trackNoms = _gpArticles.length
        ? _gpArticles.map(gp => S.nomenclature.find(n => n.articleGp === gp)).filter(Boolean)
        : [S.nomenclature.find(n => n.articleGp === c.articleGp)].filter(Boolean);
      // Набор артикулов ГП контракта — целые изделия (для подсчёта комплектов по переделу)
      const _cGpSet = new Set(_trackNoms.map(n => n.articleGp).concat(c.articleGp).filter(Boolean));
      // Артикулы, сгруппированные по переделам: { 'РЦ': Set, 'АЦ': Set, ... }
      // Берём stage из самой строки маршрута (ri.stage), а не через
      // stageOfArticleItem — иначе артикул, встречающийся и в ШЦ, и в У,
      // попал бы только в первый найденный передел (обычно ШЦ).
      const _cStageItems = {};
      for (const nom of _trackNoms) {
        const route = allRoutesOf(nom);
        for (const ri of route) {
          const ai = ri.articleItem;
          if (!ai) continue;
          const st = ri.stage;
          if (!st) continue;
          if (!_cStageItems[st]) _cStageItems[st] = new Set();
          _cStageItems[st].add(ai);
        }
      }
      // Переделы маршрута в нужном порядке (только те, что есть в маршруте)
      const _cTrackStages = STAGE_ORDER.filter(s => _cStageItems[s] && _cStageItems[s].size);

      const sortedDls = [...deadlines].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

      if (!deadlines.length) {
        body += `<tr class="ct-sub-row"><td></td><td colspan="5" style="color:#94a3b8;font-size:11px;padding:3px 14px">Сроков не добавлено.</td></tr>`;
      } else {
        // Сводная таблица: строка = срок поставки; столбцы = итого + (запл./ост.) по каждому переделу.
        // Без жёсткого контроля сроков: план считается нарастающим итогом по месяц срока
        // ВКЛЮЧИТЕЛЬНО — план более раннего месяца зачитывается более позднему сроку.
        const stageThs = _cTrackStages.length
          ? _cTrackStages.map(st =>
              `<th colspan="2" style="text-align:center;border-left:1px solid #e2e8f0">${st}</th>`).join('')
          : `<th style="text-align:center;color:#94a3b8;font-weight:400">нет переделов в номенклатуре</th>`;
        const stageSubThs = _cTrackStages.map(() =>
          `<th style="text-align:right;font-size:10px;color:#94a3b8;font-weight:600;border-left:1px solid #e2e8f0">Запл.</th>` +
          `<th style="text-align:right;font-size:10px;color:#94a3b8;font-weight:600">Осталось</th>`).join('');

        let dlRows = '';
        for (const dl of sortedDls) {
          const dlMonth = dl.date ? dl.date.slice(0, 7) : '';
          const dlQty = +dl.quantity || 0;
          // Требуемое к этому сроку = сумма всех сроков по этот месяц включительно.
          const cumDlQty = dlMonth
            ? sortedDls
                .filter(d => (d.date ? d.date.slice(0, 7) : '') <= dlMonth)
                .reduce((s, d) => s + (+d.quantity || 0), 0)
            : dlQty;

          let stageCells = '';
          if (dlMonth && _cTrackStages.length) {
            stageCells = _cTrackStages.map(st => {
              const items = _cStageItems[st];
              const stRows = _cMacroRows.filter(r => {
                if (!items.has(r.articleItem)) return false;
                if ((r.month || '') > dlMonth) return false;
                // Если артикул встречается на нескольких переделах, различаем
                // строки макроплана по переделу их ОП/цеха (processType).
                return stageOfMacroRow(r) === st;
              });
              // Комплекты на переделе: целые изделия суммируются, узлы (/1,/2,/3) — min.
              const planned = stageKitQtyForRows(stRows, _cGpSet);
              const remaining = cumDlQty - planned;
              const remColor = remaining > 0 ? '#ef4444' : remaining < 0 ? '#f59e0b' : '#16a34a';
              return `<td style="text-align:right;border-left:1px solid #e2e8f0;font-size:11px">${planned.toLocaleString('ru')}</td>` +
                     `<td style="text-align:right;font-size:11px;font-weight:700;color:${remColor}">${remaining.toLocaleString('ru')}</td>`;
            }).join('');
          } else {
            stageCells = `<td colspan="${Math.max(1, _cTrackStages.length * 2)}" style="text-align:center;color:#94a3b8;font-size:11px">${dlMonth ? '—' : 'нет даты'}</td>`;
          }

          dlRows += `<tr>
            <td style="white-space:nowrap"><input type="date" value="${esc(dl.date)}" style="font-size:12px;width:130px" onblur="updContractDeadline(${c.id},${dl.id},'date',this.value)"></td>
            <td style="text-align:right;white-space:nowrap"><input type="number" min="0" value="${dl.quantity || ''}" placeholder="кол-во" style="font-size:12px;width:64px;text-align:right" onblur="updContractDeadline(${c.id},${dl.id},'quantity',+this.value)"></td>
            ${stageCells}
            <td style="text-align:center;white-space:nowrap"><button type="button" class="btn btn-danger btn-sm" style="font-size:10px;padding:1px 6px" onclick="removeContractDeadline(${c.id},${dl.id})">✕</button></td>
          </tr>`;
        }

        body += `<tr class="ct-sub-row">
          <td></td>
          <td colspan="5" style="padding:4px 14px 8px">
            <div class="table-wrap" style="margin:0;max-height:none">
              <table>
                <thead>
                  <tr>
                    <th rowspan="2" style="vertical-align:bottom">Срок поставки</th>
                    <th rowspan="2" style="text-align:right;vertical-align:bottom">Итого, шт</th>
                    ${stageThs}
                    <th rowspan="2" style="width:36px"></th>
                  </tr>
                  <tr>${stageSubThs}</tr>
                </thead>
                <tbody>${dlRows}</tbody>
              </table>
            </div>
          </td>
        </tr>`;
      }
      body += `<tr class="ct-sub-add"><td></td><td colspan="5" style="padding:3px 14px">
        <input type="date" id="ct-dl-date-${c.id}" style="font-size:12px;width:130px">&ensp;<input type="number" min="0" placeholder="кол-во" id="ct-dl-qty-${c.id}" style="font-size:12px;width:70px">&ensp;<button type="button" class="btn btn-sm" onclick="addContractDeadline(${c.id})">+ Срок поставки</button>
      </td></tr>`;

      // ── Артикулы ГП ─────────────────────────────────────────────
      body += `<tr class="ct-sub-head"><td></td><td colspan="5">АРТИКУЛЫ ГП</td></tr>`;

      // Форма добавления — ВЫШЕ таблицы
      const aiDlId = `ct-ai-dl-${c.id}`;
      const aiDl = uniqueGps().map(gp => `<option value="${esc(gp)}">${esc(nameOf(gp) || '')}</option>`).join('');
      body += `<tr class="ct-sub-add"><td></td><td colspan="5" style="padding:4px 14px">
        <datalist id="${aiDlId}">${aiDl}</datalist>
        <input type="text" list="${aiDlId}" id="ct-ai-input-${c.id}" placeholder="артикул ГП из номенклатуры" style="font-size:12px;width:190px">&ensp;<button type="button" class="btn btn-sm" onclick="addContractArticleItem(${c.id})">+ Артикул ГП</button>
      </td></tr>`;

      if (!articleItems.length) {
        body += `<tr class="ct-sub-row"><td></td><td colspan="5" style="font-size:11px;color:#94a3b8;padding:3px 14px">Артикулы ГП не добавлены.</td></tr>`;
      } else {
        // Собираем все месяцы по всем артикулам этого контракта из макроплана
        const allMacroForC = (S.macroplan || []).filter(r => r.contractId === +c.id);
        const allMonths = [...new Set(allMacroForC.map(r => r.month).filter(Boolean))].sort();

        const line = (label, val) => `<div style="font-size:11px;display:flex;gap:4px"><span style="color:#94a3b8;white-space:nowrap">${label}:</span><span>${val}</span></div>`;
        const monthThs = allMonths.map(m =>
          `<th class="mf-st-month" style="text-align:center;width:160px;min-width:160px">${mlabel(m)}</th>`
        ).join('');

        let tableRows = '';
        for (const item of articleItems) {
          const nom = S.nomenclature.find(n => n.articleGp === item.articleItem);
          const route = nom ? allRoutesOf(nom) : [];

          const stageItemsMap = {};
          for (const ri of route) {
            if (!ri.articleItem || !ri.stage) continue;
            if (!stageItemsMap[ri.stage]) stageItemsMap[ri.stage] = [];
            // Дедуп: базовый и переопределённый маршруты могут содержать один и тот же
            // артикул на переделе (напр. У: 01.000001 в обоих) — не дублируем колонку.
            if (!stageItemsMap[ri.stage].includes(ri.articleItem)) stageItemsMap[ri.stage].push(ri.articleItem);
          }
          const allAis = route.map(i => i.articleItem).filter(Boolean);
          if (!allAis.length) { stageItemsMap['ШЦ'] = [item.articleItem]; allAis.push(item.articleItem); }
          const usedStages = STAGE_ORDER.filter(s => stageItemsMap[s]);

          const data = {};
          for (const r of allMacroForC.filter(r => allAis.includes(r.articleItem))) {
            const m = r.month || ''; const s = stageOfMacroRow(r);
            if (!m) continue;
            if (!data[m]) data[m] = {};
            if (!data[m][s]) data[m][s] = {};
            data[m][s][r.articleItem] = (data[m][s][r.articleItem] || 0) + (+r.qtySew || 0);
          }

          const monthCells = allMonths.map(m => {
            const hasData = usedStages.some(s => {
              const aiMap = (data[m] && data[m][s]) || {};
              return Object.values(aiMap).reduce((a, b) => a + b, 0) > 0;
            });
            if (!hasData && !allMacroForC.some(r => r.month === m && allAis.includes(r.articleItem))) {
              return `<td class="mf-st-month" style="color:#94a3b8;text-align:center">—</td>`;
            }
            const stageLines = usedStages.map(s => {
              const items = stageItemsMap[s];
              const aiMap = (data[m] && data[m][s]) || {};
              const vals = items.map(ai => aiMap[ai] || 0);
              const total = vals.reduce((a, b) => a + b, 0);
              const display = vals.length > 1
                ? vals.map(q => q.toLocaleString('ru')).join(' / ')
                : total.toLocaleString('ru');
              const valHtml = total > 0
                ? `<b>${display}</b>`
                : `<span style="color:#94a3b8">${display}</span>`;
              return line(s, valHtml);
            }).join('');
            return `<td class="mf-st-month" style="vertical-align:top;padding:4px 8px">${stageLines}</td>`;
          }).join('');

          const nameStr = nameOf(item.articleItem) || '';
          tableRows += `<tr>
            <td class="mf-st-op" style="vertical-align:middle">
              <div style="font-size:11px;font-weight:700;font-family:monospace">${esc(item.articleItem)}</div>
              ${nameStr ? `<div style="font-size:11px;color:#64748b;margin-top:1px">${esc(nameStr)}</div>` : ''}
            </td>
            ${monthCells}
            <td style="padding:4px 6px;text-align:center;white-space:nowrap;vertical-align:middle">
              <button type="button" class="btn btn-danger btn-sm" style="font-size:10px;padding:1px 6px" onclick="removeContractItem(${c.id},${item.id})">✕</button>
            </td>
          </tr>`;
        }

        body += `<tr class="ct-sub-row">
          <td></td>
          <td colspan="5" style="padding:4px 14px 8px">
            <div class="table-wrap mac-load-scroll" style="margin:0;max-height:none">
              <table><thead><tr>
                <th class="mf-st-op">Артикул / Наименование</th>
                ${monthThs}
                <th style="width:36px"></th>
              </tr></thead><tbody>${tableRows}</tbody></table>
            </div>
          </td>
        </tr>`;
      }

      body += `<tr><td colspan="6" style="height:6px;border-bottom:2px solid #e2e8f0"></td></tr>`;
    }
  }

  el.innerHTML = `
    <div class="sec-title">Контракты</div>
    <datalist id="ct-gp-dl">${gpDatalist}</datalist>
    <div class="ctx-bar">
      <label>Номер контракта<input class="w140" placeholder="поиск" value="${esc(contractsFilters.number)}" oninput="contractsFilters.number=this.value;renderContracts()"></label>
      <label>Артикул ГП<input class="w120" placeholder="поиск" value="${esc(contractsFilters.articleGp)}" oninput="contractsFilters.articleGp=this.value;renderContracts()"></label>
      <button class="ctx-bar-btn" onclick="contractsFilters={number:'',articleGp:''};renderContracts()">Сбросить</button>
    </div>
    <div class="add-form" style="flex-wrap:wrap;align-items:flex-end;gap:8px;margin-top:10px">
      <label>Номер контракта<input class="w160" id="ct-num" placeholder="К-2026/01"></label>
      <label>Артикул ГП<input class="w140" id="ct-gp" list="ct-gp-dl" placeholder="из номенклатуры" onblur="ctGpSuggestName()"></label>
      <label>Наименование<input class="w200" id="ct-name" placeholder="подставится из номенклатуры"></label>
      <button type="button" class="btn btn-primary" onclick="addContractFromTab()">+ Добавить</button>
    </div>
    <div class="table-wrap" style="margin-top:10px"><table><thead>
      <tr>
        <th style="width:22px"></th>
        <th>Номер контракта</th>
        <th>Артикул ГП</th>

        <th style="text-align:right">Итого кол-во</th>
        <th style="width:40px"></th>
      </tr>
    </thead><tbody>${body}</tbody></table></div>`;
  _ctxFocusRestore(el, _focus);
}

function mfrvWorkshopsForOp(opName) {
  return [...new Set(S.ops.filter(o => o.name === opName).map(o => o.workshop))].sort((a, b) => String(a).localeCompare(String(b), 'ru'));
}

function mfrvOpChange() {
  const op = document.getElementById('mfrv-op') ? document.getElementById('mfrv-op').value : '';
  const ws = document.getElementById('mfrv-ws');
  if (!ws) return;
  const list = op ? mfrvWorkshopsForOp(op) : [];
  ws.innerHTML = '<option value="">— выбрать —</option>' + list.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join('');
}

/** Месяцы для сводной ФРВ: из записей + дополнительные пустые столбцы. */
function mfrvPivotMonthsMerged() {
  const fromData = [...new Set((S.manualFrv || []).map(x => x.month).filter(Boolean))];
  const extra = Array.isArray(S.manualFrvExtraMonths) ? S.manualFrvExtraMonths : [];
  return [...new Set([...fromData, ...extra])].sort();
}

/** Строки сводной: все пары из справочника ops, плюс из manualFrv, плюс из «+ Строка». */
function mfrvPivotRowPairs() {
  const pairs = new Map();
  for (const o of S.ops || []) {
    if (!o || !o.name) continue;
    const k = `${o.name}\u0000${o.workshop || ''}`;
    pairs.set(k, { op: o.name, workshop: o.workshop || '' });
  }
  for (const r of S.manualFrv || []) {
    if (!r || !r.op) continue;
    const k = `${r.op}\u0000${r.workshop || ''}`;
    if (!pairs.has(k)) pairs.set(k, { op: r.op, workshop: r.workshop || '' });
  }
  for (const ex of S.manualFrvPivotExtraRows || []) {
    if (!ex || !ex.op) continue;
    const k = `${ex.op}\u0000${ex.workshop || ''}`;
    if (!pairs.has(k)) pairs.set(k, { op: ex.op, workshop: ex.workshop || '' });
  }
  return [...pairs.values()].sort((a, b) =>
    a.op.localeCompare(b.op, 'ru') || String(a.workshop).localeCompare(String(b.workshop), 'ru'));
}

/** Прокрутка сводной по горизонтали к последним месяцам (вправо). */
function mfrvPivotScrollToEnd() {
  const sc = document.getElementById('mfrv-pivot-scroll');
  if (!sc) return;
  const go = () => {
    sc.scrollLeft = Math.max(0, sc.scrollWidth - sc.clientWidth);
  };
  go();
  setTimeout(go, 50);
}

/** Прокрутка таблиц макроплана (основная и «Загрузка по ОП») к последним месяцам. */
function macroPlanScrollToEnd() {
  const go = (id) => {
    const sc = document.getElementById(id);
    if (!sc) return;
    sc.scrollLeft = Math.max(0, sc.scrollWidth - sc.clientWidth);
  };
  go('macro-plan-scroll');
  go('macro-load-scroll');
  setTimeout(() => {
    go('macro-plan-scroll');
    go('macro-load-scroll');
  }, 50);
}

function mfrvPivotAddRowPair() {
  const opEl = document.getElementById('mfrv-pivot-add-op');
  const wsEl = document.getElementById('mfrv-pivot-add-ws');
  const op = opEl ? opEl.value : '';
  const workshop = wsEl ? wsEl.value : '';
  if (!op || workshop === '') {
    _alert('Выберите ОП и цех.');
    return;
  }
  if (!S.ops.some(o => o.name === op && String(o.workshop || '') === String(workshop))) {
    _alert('Такой пары ОП и цех нет в справочнике. Добавьте её во вкладке «Справочники».');
    return;
  }
  const k = `${op}\u0000${workshop}`;
  const existing = mfrvPivotRowPairs();
  if (existing.some(p => `${p.op}\u0000${p.workshop || ''}` === k)) {
    _alert('Эта строка уже есть в таблице.');
    return;
  }
  if (!Array.isArray(S.manualFrvPivotExtraRows)) S.manualFrvPivotExtraRows = [];
  S.manualFrvPivotExtraRows.push({ op, workshop });
  save();
  renderManualFrv();
}

/** Следующий календарный месяц после последнего столбца (кнопка + в шапке). */
function mfrvPivotAddNextMonth() {
  if (!Array.isArray(S.manualFrvExtraMonths)) S.manualFrvExtraMonths = [];
  const merged = mfrvPivotMonthsMerged();
  let nextYm;
  if (!merged.length) {
    const d = new Date();
    nextYm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  } else {
    const last = merged[merged.length - 1];
    const [y, mo] = last.split('-').map(Number);
    const d = new Date(y, mo - 1, 1);
    d.setMonth(d.getMonth() + 1);
    nextYm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }
  if (merged.includes(nextYm)) {
    _alert('Этот месяц уже в таблице.');
    return;
  }
  S.manualFrvExtraMonths.push(nextYm);
  save();
  renderManualFrv();
}

/**
 * Сохранение ячейки сводной (ОП+цех+месяц): создание записи из пустой ячейки или правка.
 * el — элемент с data-op, data-ws, data-month (обёртка .mfrv-pivot-cell).
 */
/** Только эффективность в сводной (не трогаем варианты, если блок свёрнут). */
function mfrvPivotCellEffBlur(el) {
  const wrap = el && el.closest ? el.closest('.mfrv-pivot-cell') : null;
  if (!wrap || !wrap.dataset) return;
  const op = wrap.dataset.op || '';
  const workshop = wrap.dataset.ws != null ? wrap.dataset.ws : '';
  const month = wrap.dataset.month || '';
  if (!op || !month) return;
  const ev = el ? parseFloat(el.value) : NaN;
  const effUse = Number.isFinite(ev) ? Math.max(0, Math.min(300, ev)) : 100;
  const r = (S.manualFrv || []).find(
    x => x.op === op && String(x.workshop || '') === String(workshop) && x.month === month
  );
  if (!r) return;
  r.effPct = effUse;
  save();
  renderActive();
}

/** Читает варианты из развёрнутой ячейки сводной. */
function mfrvPivotReadSegmentsFromWrap(wrap) {
  const out = [];
  if (!wrap) return out;
  wrap.querySelectorAll('tr[data-mfrv-p-seg]').forEach(tr => {
    const sid = +tr.dataset.mfrvPSeg || 0;
    const ins = tr.querySelectorAll('input');
    const name = ins[0] ? String(ins[0].value ?? '').trim() : '';
    const people = ins[1] ? +ins[1].value : 0;
    const shiftMin = ins[2] ? +ins[2].value : 0;
    const workDays = ins[3] ? +ins[3].value : 0;
    if (people > 0 && shiftMin > 0 && workDays > 0) {
      out.push({ id: sid || nid(), name, people, shiftMin, workDays });
    }
  });
  return out;
}

/** Сохранение вариантов из сводной (кнопка «Применить» в раскрытии). */
function mfrvPivotSegmentsApply(btn) {
  const wrap = btn && btn.closest ? btn.closest('.mfrv-pivot-cell') : null;
  if (!wrap || !wrap.dataset) return;
  const op = wrap.dataset.op || '';
  const workshop = wrap.dataset.ws != null ? wrap.dataset.ws : '';
  const month = wrap.dataset.month || '';
  if (!op || !month) return;
  const effInp = wrap.querySelector('.mfrv-pivot-eff');
  const ev = effInp ? parseFloat(effInp.value) : NaN;
  const effUse = Number.isFinite(ev) ? Math.max(0, Math.min(300, ev)) : 100;
  const segs = mfrvPivotReadSegmentsFromWrap(wrap);
  const nom = segs.reduce((s, g) => s + Math.max(0, +g.people || 0) * Math.max(0, +g.shiftMin || 0) * Math.max(0, +g.workDays || 0), 0);
  if (nom <= 0) {
    _alert('Укажите хотя бы один вариант: люди > 0, смена (мин) > 0, рабочих дней > 0.');
    return;
  }
  if (!S.ops.some(o => o.name === op && String(o.workshop || '') === String(workshop))) {
    _alert('Пара ОП и цех должны быть в справочнике (вкладка «Справочники»).');
    return;
  }
  const r = (S.manualFrv || []).find(
    x => x.op === op && String(x.workshop || '') === String(workshop) && x.month === month
  );
  if (r) {
    r.frvSegments = segs;
    r.frvMin = 0;
    r.effPct = effUse;
  } else {
    S.manualFrv.push({ id: nid(), op, workshop, month, frvMin: 0, effPct: effUse, frvSegments: segs });
  }
  save();
  renderActive();
}

/** Стабильный id оболочки панели вариантов в ячейке сводной (пустая ячейка — до «Применить»). */
function mfrvPivotWrapDomId(op, workshop, ym, r) {
  if (r && r.id != null) return 'mfrv-s-wrap-' + r.id;
  const s = String(op || '') + '\x1e' + String(workshop != null ? workshop : '') + '\x1e' + String(ym || '');
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return 'mfrv-pc-' + (h >>> 0).toString(36);
}

function addManualFrv() {
  const op = (document.getElementById('mfrv-op') && document.getElementById('mfrv-op').value) || '';
  const workshop = (document.getElementById('mfrv-ws') && document.getElementById('mfrv-ws').value) || '';
  const month = mpVal('mfrv-month');
  const effRaw = document.getElementById('mfrv-eff') && document.getElementById('mfrv-eff').value;
  const effPct = parseFloat(effRaw);
  const segs = mfrvCollectAddFormSegments();
  const nom = segs.reduce((s, g) => s + (+g.people || 0) * (+g.shiftMin || 0) * (+g.workDays || 0), 0);
  if (!op || !workshop || !month) {
    _alert('Заполните: ОП, цех, месяц.');
    return;
  }
  if (!S.ops.some(o => o.name === op && o.workshop === workshop)) {
    _alert('Выберите пару ОП / цех из справочника.');
    return;
  }
  if (nom <= 0) {
    _alert('Добавьте хотя бы один вариант: люди, смена (минуты), рабочих дней в месяце — все значения > 0. Несколько строк — разные режимы (например разная длина смены).');
    return;
  }
  const effUse = Number.isFinite(effPct) ? Math.max(0, Math.min(300, effPct)) : 100;
  if (S.manualFrv.some(x => x.op === op && (x.workshop || '') === workshop && x.month === month)) {
    _alert('Для этой пары ОП+цех+месяц запись уже есть. Измените строку в таблице.');
    return;
  }
  const newRec = { id: nid(), op, workshop, month, frvMin: 0, effPct: effUse, frvSegments: segs };
  S.manualFrv.push(newRec);
  clearAddFormDraft(['mfrv-op','mfrv-ws','mfrv-month','mfrv-eff']); _suppressDraftCaptureOnce = true;
  save();
  renderActive();
}

function addManualFrvSegmentRow(recordId) {

function delManualFrvSegment(recordId, segId) {
  const r = byId(S.manualFrv, recordId);
  if (!r || !Array.isArray(r.frvSegments)) return;
  manualFrvSegOpenRowId = recordId;
  r.frvSegments = r.frvSegments.filter(s => +s.id !== +segId);
  save();
  renderActive();
}

function updManualFrvSeg(recordId, segId, field, rawVal) {
  const r = byId(S.manualFrv, recordId);
  if (!r || !Array.isArray(r.frvSegments)) return;
  const seg = r.frvSegments.find(s => +s.id === +segId);
  if (!seg) return;
  manualFrvSegOpenRowId = recordId;
  if (field === 'name') seg.name = String(rawVal ?? '').trim();
  else if (field === 'people') seg.people = Math.max(0, parseFloat(rawVal) || 0);
  else if (field === 'shiftMin') {
    const v = +rawVal;
    seg.shiftMin = Number.isFinite(v) && v > 0 ? v : 0;
  } else if (field === 'workDays') seg.workDays = Math.max(0, parseFloat(rawVal) || 0);
  else if (field === 'effPct') seg.effPct = Math.max(0, parseFloat(rawVal) || 0);
  else if (field === 'absence') seg.absence = !!rawVal;
  save();
  renderActive();
}

function updManualFrv(id, field, val) {
  const r = byId(S.manualFrv, id);
  if (!r) return;
  if (field === 'effPct') {
    const v = +val;
    if (!Number.isFinite(v) || v < 0 || v > 300) return;
    r.effPct = v;
  } else if (field === 'frvMin') {
    const v = +val;
    if (!Number.isFinite(v) || v < 0) return;
    r.frvMin = v;
    if (v > 0) r.frvSegments = [];
  }
  save();
  renderActive();
}

/** Эффективное (доступное) время записи ФРВ = Σ по вариантам (номинал × абсентеизм варианта).
 *  Абсентеизм учитывается ПОВАРИАНТНО: у варианта без галочки множитель 1, иначе 0.95. */
function manualFrvEffectiveForRecord(r) {
  if (!r) return 0;
  const segs = Array.isArray(r.frvSegments) ? r.frvSegments : [];
  let t = 0, hasValid = false;
  for (const seg of segs) {
    const p = Math.max(0, +seg.people || 0);
    const sh = Math.max(0, +seg.shiftMin || 0);
    const d = Math.max(0, +seg.workDays || 0);
    if (p > 0 && sh > 0 && d > 0) { t += p * sh * d * segAbsFactor(seg); hasValid = true; }
  }
  // Нет вариантов — устаревшее поле frvMin (абсентеизм по умолчанию учитываем).
  if (!hasValid) return (+r.frvMin || 0) * 0.95;
  return t;
}

/** Краткая строка в таблице ФРВ: номинал и число вариантов. */
function manualFrvSegSummaryText(r) {
  if (!r) return '';
  const sum = manualFrvNominalForRecord(r);
  const segs = Array.isArray(r.frvSegments) ? r.frvSegments : [];
  let valid = 0;
  for (const seg of segs) {
    const p = Math.max(0, +seg.people || 0);
    const sh = Math.max(0, +seg.shiftMin || 0);
    const d = Math.max(0, +seg.workDays || 0);
    if (p > 0 && sh > 0 && d > 0) valid++;
  }
  const leg = (!valid && (+r.frvMin || 0) > 0) ? ' · устар. сумма' : '';
  const varLabel = valid ? `${valid} вар.` : (segs.length ? `${segs.length} чернов.` : '— вар.');
  return `Σ ${Math.round(sum).toLocaleString('ru')} чел-мин · ${varLabel}${leg}`;
}

/** Позиционирует панель вариантов ФРВ (fixed) так, чтобы она всегда помещалась в окно:
 *  вниз от триггера, а если внизу не хватает места — вверх. */
// Перетаскивание всплывающих панелей (варианты ФРВ / состав) за ручку.
let _panelDragBound = false, _dragPanel = null, _dragDX = 0, _dragDY = 0, _dragKey = null;
let _panelPos = {};   // запомненные перетащенные позиции по id обёртки панели
function _panelKeyOf(panel) {
  const wrap = panel.closest('.mfrv-s-wrap, .micro-w-wrap');
  return wrap ? wrap.id : null;
}
function initPanelDrag() {
  if (_panelDragBound) return;
  _panelDragBound = true;
  document.addEventListener('mousedown', e => {
    if (!e.target || !e.target.closest) return;
    const panel = e.target.closest('.mfrv-s-panel, .micro-w-panel');
    if (!panel) return;
    // Тащим за любой край/неинтерактивную область панели; контролы не трогаем.
    if (e.target.closest('input, button, select, textarea, a, label')) return;
    _dragPanel = panel;
    _dragKey = _panelKeyOf(panel);
    const r = panel.getBoundingClientRect();
    _dragDX = e.clientX - r.left;
    _dragDY = e.clientY - r.top;
    panel.style.bottom = 'auto';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!_dragPanel) return;
    let left = e.clientX - _dragDX, top = e.clientY - _dragDY;
    left = Math.max(0, Math.min(left, window.innerWidth - 60));
    top = Math.max(0, Math.min(top, window.innerHeight - 30));
    _dragPanel.style.left = left + 'px';
    _dragPanel.style.top = top + 'px';
    if (_dragKey) _panelPos[_dragKey] = { left, top };   // запоминаем положение
  });
  document.addEventListener('mouseup', () => { _dragPanel = null; });
}

function _positionMfrvPanel(wrap) {
  initPanelDrag();
  requestAnimationFrame(() => {
    const panel = wrap.querySelector('.mfrv-s-panel');
    if (!panel) return;
    const m = 8;
    const vh = window.innerHeight, vw = window.innerWidth;
    // Если панель перетаскивали — оставляем на сохранённом месте.
    const saved = _panelPos[wrap.id];
    if (saved) {
      panel.style.bottom = 'auto';
      panel.style.maxHeight = (vh - 2 * m) + 'px';
      panel.style.left = saved.left + 'px';
      panel.style.top = saved.top + 'px';
      return;
    }
    const trigger = wrap.querySelector('.mfrv-s-trigger') || wrap;
    const rect = trigger.getBoundingClientRect();
    // Панель не выше окна; верх (шапка) всегда в видимой области.
    panel.style.bottom = 'auto';
    panel.style.maxHeight = (vh - 2 * m) + 'px';
    const pw = panel.offsetWidth || 680;
    let left = Math.min(rect.left, vw - pw - m);
    if (left < m) left = m;
    panel.style.left = left + 'px';
    // Высота контента (с учётом ограничения), подбираем top чтобы влезть снизу, но не выше края.
    const h = Math.min(panel.scrollHeight, vh - 2 * m);
    let top = rect.bottom + 4;
    if (top + h > vh - m) top = vh - m - h;
    if (top < m) top = m;
    panel.style.top = top + 'px';
  });
}

      html += `<tr><td colspan="${colSpanAll}" class="empty" style="text-align:center;padding:16px">Нет строк: задайте ОП и цеха в «Справочники» или внесите данные во «Таблица».</td></tr>`;
    } else if (!months.length) {
      html += `<tr><td colspan="3" class="empty" style="text-align:center;padding:12px 16px">Нажмите «+» справа в шапке — появится столбец месяца. В ячейке: эффективность и кнопка «▼ Варианты»; внутри — таблица и «Применить варианты».</td></tr>`;
      for (const { op, workshop } of rowPairs) {
        html += `<tr><td class="ro mfrv-p-op">${esc(op)}</td><td class="ro mfrv-p-ws">${esc(workshop)}</td><td></td></tr>`;
      }
    } else {
      for (const { op, workshop } of rowPairs) {
        html += `<tr>
          <td class="ro mfrv-p-op" style="vertical-align:top">${esc(op)}</td>
          <td class="ro mfrv-p-ws" style="vertical-align:top">${esc(workshop)}</td>
          ${months.map(m => `<td class="mfrv-p-month" style="font-size:11px">${manualFrvPivotCellHtml(op, workshop, m)}</td>`).join('')}
          <td class="mfrv-p-add"></td>
        </tr>`;
      }
    }
    html += '</tbody></table></div>';
  }
  el.innerHTML = html;
  bindMfrvSegPanelOutsideOnce();
  if (manualFrvView === 'table') {
    mfrvOpChange();
    mpGrid('mfrv-month');
    const reopenSeg = manualFrvSegOpenRowId;
    manualFrvSegOpenRowId = null;
    requestAnimationFrame(() => {
      if (reopenSeg != null) {
        const w = document.getElementById('mfrv-s-wrap-' + reopenSeg);
        if (w) { w.classList.add('mfrv-s-open'); _positionMfrvPanel(w); }
      }
    });
  } else if (manualFrvView === 'pivot') {
    mfrvPivotAddOpChangeUi();
    requestAnimationFrame(() => requestAnimationFrame(() => mfrvPivotScrollToEnd()));
  }
}

function renderProductionOrders() {
  const el = document.getElementById('tab-orders');
  const _focus = _ctxFocusSave(el);
  const gpOpts = uniqueGps().map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');

  // Множественный выбор ОП на передел: один передел может делаться на нескольких ОП
  // (напр. брюки шьют и в Тереке, и в Хазнидоне).
  const opSelect = (stage, val, oId) => {
    const opts = [...new Set((S.ops || []).filter(o => o.processType === stage).map(o => o.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
    if (!opts.length) return `<span style="color:#94a3b8;font-size:11px">—</span>`;
    const sel = new Set(Array.isArray(val) ? val.filter(Boolean) : (val ? [val] : []));
    const summary = sel.size ? [...sel].join(', ') : '— ОП —';
    const sumShort = summary.length > 22 ? summary.slice(0, 20) + '…' : summary;
    const cbs = opts.map(op => `<label style="display:grid;grid-template-columns:16px 1fr;align-items:center;column-gap:6px;margin-bottom:4px;white-space:nowrap;cursor:pointer">
      <input type="checkbox" value="${esc(op)}" ${sel.has(op) ? 'checked' : ''} style="width:13px;height:13px;margin:0;accent-color:#2563eb" onchange="updProdOrderStageOp(${oId},'${stage}',this.value,this.checked)">
      <span style="font-size:11px;color:#1e293b">${esc(op)}</span>
    </label>`).join('');
    return `<details style="position:relative" onclick="event.stopPropagation()">
      <summary id="ord-op-sum-${oId}-${stage}" title="${esc(summary)}" style="list-style:none;cursor:pointer;font-size:11px;padding:2px 5px;border:1px solid #e2e8f0;border-radius:5px;background:#f8fafc;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${sel.size ? '#1e293b' : '#94a3b8'}">${esc(sumShort)}</summary>
      <div style="position:absolute;top:calc(100% + 3px);left:0;z-index:40;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.12);padding:7px;max-height:200px;overflow:auto;min-width:140px">${cbs}</div>
    </details>`;
  };

  // Collect unique contracts linked to orders via macroplan
  const linkedContractNums = [...new Set(S.orders.flatMap(o => contractNumsForOrder(o.number)))].sort((a,b)=>a.localeCompare(b,'ru'));

  // Apply filters
  const fNum = ordersFilters.number.trim().toLowerCase();
  const fCon = ordersFilters.contractNum;
  const fDate = ordersFilters.deliveryDate;
  const fArt  = ordersFilters.article.trim().toLowerCase();
  const fFrom = ordersFilters.deliveryFrom || '';
  const fTo   = ordersFilters.deliveryTo || '';
  const fOp   = ordersFilters.op || '';
  const filtered = S.orders.filter(o => {
    if (fNum && !o.number.toLowerCase().includes(fNum)) return false;
    if (fCon && !contractNumsForOrder(o.number).includes(fCon)) return false;
    if (fArt && !o.articleGp.toLowerCase().includes(fArt)) return false;
    // Срок ГК (= сроки поставки по базам) — диапазон с/по: проходит, если ЛЮБАЯ дата попадает в диапазон.
    const _dates = orderDeliveryDates(o);
    if (fDate && !_dates.includes(fDate)) return false;
    if (fFrom && !_dates.some(d => d >= fFrom)) return false;
    if (fTo && !_dates.some(d => d && d <= fTo)) return false;
    // Площадка = ОП: заказ участвует на ОП хотя бы на одном переделе.
    if (fOp) {
      const allOps = [...(o.opRc||[]), ...(o.opAc||[]), ...(o.opSh||[]), ...(o.opU||[])];
      if (!allOps.includes(fOp)) return false;
    }
    return true;
  });

  // При активном фильтре по срокам ГК итого = Σ кол-в только видимых баз; иначе — Σ кол-в заказов.
  const _dateF = ordersDateFilterActive();
  const totalQtyOrders = filtered.reduce((s, o) => _dateF
    ? s + orderVisibleDeliveries(o).reduce((a, d) => a + (+d.quantity || 0), 0)
    : s + (+o.quantity || 0), 0);
  // value = ID контракта (не номер!): два контракта с ОДИНАКОВЫМ номером, но разными изделиями

function ofGpChange() {}

/** Список артикулов ГП контракта: из «Артикулы ГП» (articleItems) + legacy articleGp. */
function contractArticleGps(c) {
  const gps = [];
  if (c) {
    (c.articleItems || []).forEach(it => { if (it.articleItem && !gps.includes(it.articleItem)) gps.push(it.articleItem); });
    if (c.articleGp && !gps.includes(c.articleGp)) gps.push(c.articleGp);
  }
  return gps;
}

function ofContractChange() {
  const contractId = (document.getElementById('of-contract') || {}).value || '';
  const c = S.contracts.find(x => String(x.id) === String(contractId));
  // Сужаем «Артикул ГП» до артикулов выбранного контракта (один — автоподстановка,
  // несколько — выбор). Без контракта — полный список номенклатуры.
  const gpEl = document.getElementById('of-gp');
  if (gpEl) {
    const gps = c ? contractArticleGps(c) : [];
    const list = gps.length ? gps : uniqueGps();
    gpEl.innerHTML = '<option value="">— выбрать —</option>' +
      list.map(g => `<option value="${esc(g)}">${esc(g)}${nameOf(g) ? ' — ' + esc(nameOf(g)) : ''}</option>`).join('');
    if (gps.length === 1) gpEl.value = gps[0];
    else if (c && c.articleGp && gps.includes(c.articleGp)) gpEl.value = c.articleGp;
  }
  // Populate delivery date options from contract deadlines
  const deliveryEl = document.getElementById('of-delivery');
  if (!deliveryEl) return;
  const deadlines = (c && Array.isArray(c.deadlines) ? c.deadlines : []).filter(dl => dl.date);
  const mainDate = c && c.deliveryDate ? c.deliveryDate : '';
  deliveryEl.innerHTML = '<option value="">— срок —</option>';
  const shown = new Set();
  deadlines.forEach(dl => {
    shown.add(dl.date);
    const label = fmtDate(dl.date) + (dl.quantity ? ' (' + dl.quantity.toLocaleString('ru') + ' шт.)' : '');
    deliveryEl.innerHTML += `<option value="${esc(dl.date)}">${esc(label)}</option>`;
  });
  if (mainDate && !shown.has(mainDate)) {
    deliveryEl.innerHTML += `<option value="${esc(mainDate)}">${esc(fmtDate(mainDate))}</option>`;
  }
  // Auto-select last deadline
  const lastDate = deadlines.length ? deadlines[deadlines.length - 1].date : mainDate;
  if (lastDate) deliveryEl.value = lastDate;
}
function addProductionOrder() {
  const number      = document.getElementById('of-num').value.trim();
  const articleGp   = document.getElementById('of-gp').value;
  const contractId  = (document.getElementById('of-contract') || {}).value || '';
  const quantity    = Math.max(0, +(document.getElementById('of-qty')?.value) || 0);
  if (!number || !articleGp) {
    _alert('Заполните: номер заказа и артикул ГП');
    return;
  }
  if (S.orders.some(o => o.number === number)) {
    _alert('Заказ на производство с таким номером уже существует.');
    return;
  }
  // Pull deliveryDate from the delivery select, fallback to contract's last deadline
  const c = S.contracts.find(x => String(x.id) === String(contractId));
  const contractNum = c ? c.number : '';
  const deadlines = c && Array.isArray(c.deadlines) ? c.deadlines : [];
  const selectedDate = (document.getElementById('of-delivery') || {}).value || '';
  const deliveryDate = selectedDate || (deadlines.length ? (deadlines[deadlines.length - 1].date || '') : (c && c.deliveryDate ? c.deliveryDate : ''));
  const deliveries = deliveryDate ? [{ id: nid(), base: '', date: deliveryDate, quantity }] : [];
  // Храним и contractId (точная привязка к нужному контракту при совпадающих номерах), и contractNum (совместимость).
  S.orders.push({ id: nid(), number, articleGp, name: nameOf(articleGp)||'', quantity, deliveryDate, deliveries, contractId: c ? c.id : null, contractNum, opRc: [], opAc: [], opSh: [], opU: [] });
  if (!S.orderLinks) S.orderLinks = [];
  clearAddFormDraft(['of-num', 'of-contract', 'of-gp', 'of-delivery', 'of-qty']); _suppressDraftCaptureOnce = true;
  save(); renderActive();
}
function updProdOrder(id, f, v) {
  const o = byId(S.orders, id);
  if (!o) return;
  o[f] = v;
  save();
  renderActive();
}

/** Список дат поставки заказа (по базам), с фолбэком на старое поле deliveryDate. */
function orderDeliveryDates(o) {
  const ds = Array.isArray(o.deliveries) ? o.deliveries.map(d => d.date || '').filter(Boolean) : [];
  if (ds.length) return ds;
  return o.deliveryDate ? [o.deliveryDate] : [];
}

/** Активен ли фильтр по срокам ГК. */
function ordersDateFilterActive() {
  return !!(ordersFilters.deliveryFrom || ordersFilters.deliveryTo || ordersFilters.deliveryDate);
}

/** Доставки (базы) заказа, видимые с учётом фильтра по срокам ГК.
 *  Если фильтр не активен — все; иначе только базы, чья дата попадает в диапазон. */
function orderVisibleDeliveries(o) {
  const ds = Array.isArray(o.deliveries) ? o.deliveries : [];
  const fFrom = ordersFilters.deliveryFrom || '';
  const fTo   = ordersFilters.deliveryTo || '';
  const fDate = ordersFilters.deliveryDate || '';
  if (!fFrom && !fTo && !fDate) return ds;
  return ds.filter(d => {
    const dt = d.date || '';
    if (fDate && dt !== fDate) return false;
    if (fFrom && !(dt && dt >= fFrom)) return false;
    if (fTo && !(dt && dt <= fTo)) return false;
    return true;
  });
}

/** Ячейка «Базы / сроки»: строки {база, срок, кол-во} + добавление. */
function _buildOrderDeliveriesCell(o) {
  // С учётом фильтра по срокам ГК: базы вне диапазона не показываются.
  const deliveries = orderVisibleDeliveries(o);
  const hiddenCnt = (Array.isArray(o.deliveries) ? o.deliveries.length : 0) - deliveries.length;
  const bases = (S.bases || []).slice().sort((a, b) => String(a.name).localeCompare(String(b.name), 'ru'));
  const baseOptions = (sel) => `<option value="">— база —</option>` +
    bases.map(b => `<option value="${esc(b.name)}" ${b.name === sel ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
  const rows = deliveries.map(d => `<div style="display:flex;align-items:center;gap:4px;margin-bottom:3px" onclick="event.stopPropagation()">
      <select style="font-size:11px;width:110px" onchange="updOrderDelivery(${o.id},${d.id},'base',this.value)">${baseOptions(d.base || '')}</select>
      <input type="date" value="${esc(d.date || '')}" style="font-size:11px;width:120px" onchange="updOrderDelivery(${o.id},${d.id},'date',this.value)">
      <input type="number" min="0" value="${d.quantity || ''}" placeholder="кол-во" style="font-size:11px;width:64px" onblur="updOrderDelivery(${o.id},${d.id},'quantity',+this.value)" onkeydown="if(event.key==='Enter')this.blur()">
      <button class="btn btn-danger btn-sm" style="padding:0 5px;font-size:10px" onclick="removeOrderDelivery(${o.id},${d.id})">✕</button>
    </div>`).join('');
  // Подсказка о несовпадении сумм считается по ВСЕМ базам заказа (свойство заказа, не зависит от фильтра).
  const allDeliveries = Array.isArray(o.deliveries) ? o.deliveries : [];
  const sumQty = allDeliveries.reduce((s, d) => s + (+d.quantity || 0), 0);
  const mismatch = allDeliveries.length && sumQty !== (+o.quantity || 0)
    ? `<div style="font-size:10px;color:#dc2626;white-space:nowrap">Σ баз ${sumQty.toLocaleString('ru')} ≠ кол-во ${(+o.quantity||0).toLocaleString('ru')}</div>`
    : '';
  const hiddenNote = hiddenCnt > 0
    ? `<div style="font-size:10px;color:#94a3b8;white-space:nowrap">скрыто фильтром: ${hiddenCnt}</div>`
    : '';
  const emptyMsg = ordersDateFilterActive() ? 'Нет баз в диапазоне' : 'Нет баз';
  return `<div style="min-width:320px">${rows || `<div style="font-size:11px;color:#94a3b8;margin-bottom:3px">${emptyMsg}</div>`}${mismatch}${hiddenNote}
    <button class="btn btn-outline btn-sm" style="font-size:11px;margin-top:2px" onclick="event.stopPropagation();addOrderDelivery(${o.id})">+ база</button></div>`;
}

function addOrderDelivery(orderId) {
  const o = byId(S.orders, orderId);
  if (!o) return;
  if (!Array.isArray(o.deliveries)) o.deliveries = [];
  o.deliveries.push({ id: nid(), base: '', date: '', quantity: 0 });
  save();
  renderProductionOrders();
}

function updOrderDelivery(orderId, delId, field, val) {
  const o = byId(S.orders, orderId);
  if (!o || !Array.isArray(o.deliveries)) return;
  const d = o.deliveries.find(x => x.id === delId);
  if (!d) return;
  d[field] = (field === 'quantity') ? Math.max(0, +val || 0) : val;
  save();
  renderProductionOrders();
}

function removeOrderDelivery(orderId, delId) {
  const o = byId(S.orders, orderId);
  if (!o || !Array.isArray(o.deliveries)) return;
  o.deliveries = o.deliveries.filter(x => x.id !== delId);
  save();
  renderProductionOrders();
}

/** Включить/выключить ОП для передела заказа (множественный выбор). Без полной
 *  перерисовки — чтобы выпадающий список не закрывался при отметке нескольких ОП. */
function updProdOrderStageOp(orderId, stage, op, checked) {
  const o = byId(S.orders, orderId);
  if (!o) return;
  const field = ORDER_OP_FIELD_BY_STAGE[stage];
  if (!field) return;
  let arr = Array.isArray(o[field]) ? o[field].slice() : (o[field] ? [o[field]] : []);
  if (checked) { if (!arr.includes(op)) arr.push(op); }
  else arr = arr.filter(x => x !== op);
  o[field] = arr;
  save();
  const sumEl = document.getElementById(`ord-op-sum-${orderId}-${stage}`);
  if (sumEl) {
    const txt = arr.length ? arr.join(', ') : '— ОП —';
    sumEl.title = txt;
    sumEl.textContent = txt.length > 22 ? txt.slice(0, 20) + '…' : txt;
    sumEl.style.color = arr.length ? '#1e293b' : '#94a3b8';
  }
}

async function deleteMacroGroup(contractId, articleItem, op, workshop, volumeType) {
  const vt = volumeType || 'main';
  if (!await _confirm('Удалить все строки макроплана для этой группы?')) return;
  S.macroplan = S.macroplan.filter(
    r => !(r.contractId === contractId && r.articleItem === articleItem && r.op === op && (r.workshop || '') === (workshop || '') && (r.volumeType||'main') === vt)
  );
  save();
  renderMacroplan();
}

function checkboxFilterHtml(listId, items, selectedArr, applyFn, labelFn) {

  const checkboxes = items.map(v => `<label style="display:grid;grid-template-columns:16px 1fr;align-items:center;column-gap:8px;margin-bottom:5px;cursor:pointer">
    <input type="checkbox" value="${esc(String(v))}" ${(!sel.size || sel.has(String(v))) ? 'checked' : ''} style="width:14px;height:14px;margin:0;accent-color:#2563eb">
    <span style="font-size:12px;color:#1e293b">${esc(labelFn ? labelFn(v) : String(v))}</span>
