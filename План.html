async function clearAll() {
  if (!await _confirm('Очистить все данные? Восстановить их будет невозможно, если вы не сделали экспорт.')) return;
  initEmptyState();
  localStorage.removeItem(LS);
  save();
  renderActive();
  _alert('Все данные удалены.');
}

// ================================================================
// Диаграмма ПО ЗАКАЗУ НА ПРОИЗВОДСТВО
// ================================================================
let ganttOrderNum = '';

function openGanttByOrderNumber(num) {
  if (!num) return;
  ganttOrderNum = num;
  switchTab(null, 'gantt');
}

function openGanttForOrder(orderId, event) {
  if (!event.ctrlKey) return;
  event.preventDefault();
  const order = byId(S.orders, orderId);
  if (!order) return;
  openGanttByOrderNumber(order.number);
}

function renderGantt() {
  const el = document.getElementById('tab-gantt');
  const STAGE_COLORS = { РЦ: '#3b82f6', АЦ: '#8b5cf6', ШЦ: '#10b981', У: '#f59e0b' };
  const SLABEL       = { РЦ: 'Раскрой', АЦ: 'Автоматизация', ШЦ: 'Пошив', У: 'Упаковка' };
  const MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const DAYS_SHORT   = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

  if (!ganttOrderNum) {
    el.innerHTML = `<div style="padding:60px;text-align:center;color:#94a3b8">
      <div style="font-size:48px;margin-bottom:16px">📊</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:8px">Диаграмма</div>
      <div style="font-size:13px">Нажмите <b>Ctrl+клик</b> на заказ на производство (в таблице или в микроплане) — откроется диаграмма.</div>
    </div>`;
    return;
  }

  const order = S.orders.find(o => releaseOrderEq(o.number, ganttOrderNum));
  if (!order) {
    el.innerHTML = `<p style="padding:40px;color:#94a3b8;text-align:center">Заказ не найден.</p>`;
    return;
  }

  const rows = S.microplan.filter(m =>
    releaseOrderEq(m.releaseOrder, order.number) ||
    (m.subOrders||[]).some(s => releaseOrderEq(s.releaseOrder, order.number))
  );
  const sortedDates = [...new Set(rows.map(r => r.date))].sort();

  if (!sortedDates.length) {
    el.innerHTML = `<div style="padding:40px;text-align:center;color:#94a3b8">Нет строк микроплана по заказу <b>${esc(order.number)}</b></div>`;
    return;
  }

  // Заполненный диапазон дат (без пропусков), локальная дата без смещения UTC
  function localIso(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  const dateRange = [];
  const dCur = new Date(sortedDates[0] + 'T00:00:00');
  const dEnd = new Date(sortedDates[sortedDates.length - 1] + 'T00:00:00');
  while (dCur <= dEnd) { dateRange.push(localIso(dCur)); dCur.setDate(dCur.getDate()+1); }

  const usedStages = STAGES.filter(s => rows.some(r => r.stage === s));
  const orderQty = +order.quantity || 0;

  // Список бригад (stage+op+ws+articleItem), сохраняя порядок стадий
  // Если в цехе ГП разбивается на изделия (куртка, брюки, рубашка) — отдельная полоса на каждое
  const brigades = [];
  for (const s of usedStages) {
    const seen = new Set();
    for (const r of rows) {
      if (r.stage !== s) continue;
      // Основные articleItems строки
      const ais = microRowArticleItems(r);
      const aiList = ais.length > 0 ? ais : [''];
      for (const ai of aiList) {
        const k = `${r.op}||${r.workshop}||${ai}`;
        if (!seen.has(k)) { seen.add(k); brigades.push({ stage:s, op:r.op||'', ws:r.workshop||'', articleItem:ai }); }
      }
      // articleItems из subOrders (Рубашка, второй заказ и т.д.)
      for (const sub of (r.subOrders || [])) {
        if (!releaseOrderEq(sub.releaseOrder, order.number)) continue;
        for (const ai of (sub.articleItems || [])) {
          if (!ai) continue;
          const k = `${r.op}||${r.workshop}||${ai}`;
          if (!seen.has(k)) { seen.add(k); brigades.push({ stage:s, op:r.op||'', ws:r.workshop||'', articleItem:ai }); }
        }
      }
    }
  }

  // Определяем, какие stage+op+ws имеют несколько articleItem (нужно показать разбивку)
  const brigMulti = {};
  for (const b of brigades) {
    const gk = `${b.stage}||${b.op}||${b.ws}`;
    if (!brigMulti[gk]) brigMulti[gk] = [];
    brigMulti[gk].push(b.articleItem);
  }

  // Данные по бригаде: bdata[stage||op||ws||ai][date] = {plan, fact}
  const bdata = {};
  for (const b of brigades) {
    const bk = `${b.stage}||${b.op}||${b.ws}||${b.articleItem}`;
    bdata[bk] = {};
    for (const d of dateRange) {
      const dr = rows.filter(r => r.stage===b.stage && r.op===b.op && r.workshop===b.ws && r.date===d);
      let plan = 0, fact = 0;
      const gk = `${b.stage}||${b.op}||${b.ws}`;
      const hasMulti = brigMulti[gk] && brigMulti[gk].length > 1;

      for (const r of dr) {
        const rAis = microRowArticleItems(r);

        // --- Основной заказ строки ---
        if (releaseOrderEq(r.releaseOrder, order.number)) {
          if (hasMulti && b.articleItem) {
            if (rAis.length > 1 && rAis.includes(b.articleItem)) {
              const tcThis = timeCostOf(b.articleItem, r.op) || 1;
              const tcTotal = rAis.reduce((s, ai) => s + (timeCostOf(ai, r.op) || 1), 0);
              const ratio = tcThis / tcTotal;
              plan += Math.round((+r.planRelease || 0) * ratio);
              fact += Math.round((+r.factRelease || 0) * ratio);
            } else if (rAis.length <= 1 && (rAis[0] || '') === b.articleItem) {
              plan += +r.planRelease || 0;
              fact += +r.factRelease || 0;
            }
          } else {
            plan += +r.planRelease || 0;
            fact += +r.factRelease || 0;
          }
        }

        // --- SubOrders (доп. заказы в строке, каждый со своим articleItem) ---
        for (const sub of (r.subOrders || [])) {
          if (!releaseOrderEq(sub.releaseOrder, order.number)) continue;
          const subAis = sub.articleItems || [];
          if (hasMulti && b.articleItem) {
            if (subAis.includes(b.articleItem)) {
              plan += +sub.planRelease || 0;
              fact += +sub.factRelease || 0;
            }
          } else {
            plan += +sub.planRelease || 0;
            fact += +sub.factRelease || 0;
          }
        }
      }
      bdata[bk][d] = { plan, fact };
    }
  }

  // Дедуп полос: разные артикулы с одинаковым отображаемым названием на одном
  // переделе/ОП/цехе — это фактически один передел (напр. дубль РЦ «Крой»).
  // Схлопываем их в одну полосу, суммируя план/факт, чтобы не было «двух переделов».
  {
    const labelOf = (b) => b.articleItem
      ? (routeNameOf(b.articleItem) || b.articleItem)
      : (nameOf(order.articleGp) || order.articleGp || '');
    const repByMerge = new Map();
    const toRemove = new Set();
    for (const b of brigades) {
      const mk = `${b.stage}||${b.op}||${b.ws}||${labelOf(b)}`;
      if (!repByMerge.has(mk)) { repByMerge.set(mk, b); continue; }
      const rep = repByMerge.get(mk);
      const bk = `${b.stage}||${b.op}||${b.ws}||${b.articleItem}`;
      const repBk = `${rep.stage}||${rep.op}||${rep.ws}||${rep.articleItem}`;
      for (const d of dateRange) {
        const src = bdata[bk]?.[d] || {};
        if (!bdata[repBk][d]) bdata[repBk][d] = { plan: 0, fact: 0 };
        bdata[repBk][d].plan += src.plan || 0;
        bdata[repBk][d].fact += src.fact || 0;
      }
      toRemove.add(b);
    }
    if (toRemove.size) {
      for (let i = brigades.length - 1; i >= 0; i--) if (toRemove.has(brigades[i])) brigades.splice(i, 1);
    }
  }

  // Агрегат по стадии (для итогового подсчёта)
  function stageSum(s, f) {
    return dateRange.reduce((sum,d) => sum + brigades.filter(b=>b.stage===s).reduce((ss,b)=>ss+(bdata[`${s}||${b.op}||${b.ws}||${b.articleItem}`][d]?.[f]||0),0), 0);
  }

  const today = localIso(new Date());

  // Группировка по месяцам для заголовка
  const monthGroups = [];
  let curMg = null;
  for (const d of dateRange) {
    const mk = d.slice(0,7);
    if (!curMg || curMg.key !== mk) { curMg = { key: mk, count: 0 }; monthGroups.push(curMg); }
    curMg.count++;
  }

  const CELL_W = 36;

  // Шапка: месяцы
  const monthHeader = monthGroups.map(g => {
    const [y, m] = g.key.split('-');
    return `<th colspan="${g.count}" style="padding:5px 8px;text-align:left;font-size:11px;font-weight:700;color:#e2e8f0;background:#1e293b;border-right:1px solid #334155;white-space:nowrap">${MONTHS_SHORT[+m-1].toUpperCase()} ${y}</th>`;
  }).join('');

  const LEFT_W = 280;
  const CELL_H = 34;

  // Шапка: день недели
  const dowHeader = dateRange.map(d => {
    const dt = new Date(d+'T00:00:00'), dow = dt.getDay();
    const we = dow===0||dow===6, tod = d===today;
    const bg = tod ? '#92400e' : we ? '#1e293b' : '#334155';
    return `<th style="width:${CELL_W}px;min-width:${CELL_W}px;padding:2px 0;text-align:center;font-size:9px;font-weight:400;color:${we?'#94a3b8':'#64748b'};background:${bg};border-right:1px solid #475569">${DAYS_SHORT[dow]}</th>`;
  }).join('');

  // Шапка: число
  const dayHeader = dateRange.map(d => {
    const dt = new Date(d+'T00:00:00'), dow = dt.getDay();
    const we = dow===0||dow===6, tod = d===today;
    const bg = tod ? '#92400e' : we ? '#1e293b' : '#334155';
    return `<th style="width:${CELL_W}px;min-width:${CELL_W}px;padding:2px 0;text-align:center;font-size:11px;font-weight:${tod?700:400};color:${tod?'#fbbf24':we?'#64748b':'#94a3b8'};background:${bg};border-right:1px solid #475569">${dt.getDate()}</th>`;
  }).join('');

  // Ячейки бригады — полоска только где есть данные (не сплошная лента)
  function brigadeCells(b) {
    const bk    = `${b.stage}||${b.op}||${b.ws}||${b.articleItem}`;
    const color = STAGE_COLORS[b.stage] || '#64748b';

    return dateRange.map(d => {
      const { plan=0, fact=0 } = bdata[bk][d] || {};
      const dt = new Date(d+'T00:00:00'), dow = dt.getDay();
      const we = dow===0||dow===6, tod = d===today;
      const cellBg = tod ? '#fffbeb' : we ? '#f0f2f5' : '#fff';
      const els = [];

      if (plan > 0)
        els.push(`<div title="План: ${plan} шт" style="position:absolute;top:5px;left:2px;right:2px;height:5px;background:${color}50;border-radius:2px"></div>`);
      if (fact > 0)
        els.push(`<div title="Факт: ${fact} шт" style="position:absolute;top:13px;left:2px;right:2px;height:13px;background:${color};border-radius:2px"></div>`);
      if (tod)
        els.push(`<div style="position:absolute;inset:0;left:calc(50% - 1px);width:2px;background:#d97706;opacity:.7;pointer-events:none"></div>`);

      return `<td style="width:${CELL_W}px;min-width:${CELL_W}px;height:${CELL_H}px;background:${cellBg};border-right:1px solid ${we?'#dde1e7':'#edf0f4'};padding:0;position:relative">${els.join('')}</td>`;
    }).join('');
  }

  // Строки: тонкий разделитель стадии + строки по бригадам
  const stageRows = usedStages.flatMap((s, si) => {
    const color = STAGE_COLORS[s] || '#64748b';
    const stageBrigades = brigades.filter(b => b.stage === s);

    // 4px разделитель между стадиями (не перед первой)
    const sepCells = dateRange.map(d => {
      const dt = new Date(d+'T00:00:00'), we = dt.getDay()===0||dt.getDay()===6;
      return `<td style="width:${CELL_W}px;min-width:${CELL_W}px;height:4px;background:${we?'#e8ecf1':'#f1f5f9'};border-right:1px solid #e2e8f0;padding:0"></td>`;
    }).join('');
    const sep = si === 0 ? '' : `<tr><td style="position:sticky;left:0;z-index:2;height:4px;background:${color}33;border-right:3px solid ${color}66;min-width:${LEFT_W}px;max-width:${LEFT_W}px"></td>${sepCells}</tr>`;

    // Строки бригад со значком стадии
    const bRows = stageBrigades.map((b, bi) => {
      const isLast = bi === stageBrigades.length - 1;
      const bk = `${b.stage}||${b.op}||${b.ws}||${b.articleItem}`;
      const factDs = dateRange.filter(d => (bdata[bk][d]?.fact||0) > 0);
      const factTotal = factDs.reduce((ss,d) => ss+(bdata[bk][d]?.fact||0), 0);
      const planTotal = dateRange.reduce((ss,d) => ss+(bdata[bk][d]?.plan||0), 0);
      const brigPct = planTotal > 0 ? Math.round(factTotal/planTotal*100) : 0;
      const pctColor = brigPct>=100?'#10b981':brigPct>=60?color:'#ef4444';
      // Название изделия из маршрута — показываем для всех полос
      const gk = `${b.stage}||${b.op}||${b.ws}`;
      const hasMultiAi = brigMulti[gk] && brigMulti[gk].length > 1;
      const aiLabel = b.articleItem
        ? (routeNameOf(b.articleItem) || b.articleItem)
        : (nameOf(order.articleGp) || order.articleGp || '');
      return `<tr style="border-bottom:${isLast?'1px solid '+color+'55':'1px solid #edf0f4'}">
        <td style="position:sticky;left:0;z-index:2;background:#fff;border-left:3px solid ${color};border-right:2px solid #e2e8f0;padding:5px 10px;min-width:${LEFT_W}px;max-width:${LEFT_W}px;vertical-align:middle">
          <div style="display:flex;align-items:center;gap:6px;line-height:1.3">
            <span style="display:inline-block;background:${color};color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;flex-shrink:0">${s}</span>
            <span style="font-size:12px;font-weight:700;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.op)}</span>
            ${aiLabel?`<span style="font-size:11px;font-weight:600;color:${color};white-space:nowrap">· ${esc(aiLabel)}</span>`:''}
            ${brigPct>0?`<span style="margin-left:auto;font-size:11px;font-weight:700;color:${pctColor};flex-shrink:0">${brigPct}%</span>`:''}
          </div>
          <div style="font-size:10px;color:#64748b;margin-top:2px;padding-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.ws)}</div>
        </td>${brigadeCells(b)}</tr>`;
    }).join('');
    return [sep, bRows];
  }).join('');

  const overallFact = factByOrderGp(order.number, order.articleGp);
  const overallPct  = order.quantity > 0 ? Math.round(overallFact/order.quantity*100) : 0;
  const co = byId(S.customerOrders, order.contractId);
  const contract = co ? byId(S.contracts, co.contractId) : null;
  const pColor = overallPct>=100?'#10b981':overallPct>=60?'#f59e0b':'#ef4444';

  el.innerHTML = `
    <div style="display:flex;align-items:flex-start;gap:20px;padding:0 0 14px;border-bottom:2px solid #e2e8f0;margin-bottom:16px;flex-wrap:wrap">
      <div>
        <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Заказ на производство</div>
        <div style="font-size:22px;font-weight:800;color:#1e293b;line-height:1">${esc(order.number)}</div>
        <div style="font-size:13px;color:#64748b;margin-top:4px">
          Артикул ГП: <b style="color:#1e293b">${esc(order.articleGp)}</b>
          ${contract ? ` &nbsp;·&nbsp; Контракт: <b>${esc(contract.number)}</b>` : ''}
          ${co ? ` &nbsp;·&nbsp; Заказ клиента: <b>${esc(co.number)}</b>` : ''}
          ${co?.deliveryDate ? ` &nbsp;·&nbsp; Срок: <b>${fmtDate(co.deliveryDate)}</b>` : ''}
        </div>
      </div>
      <div style="margin-left:auto;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 20px;text-align:center;min-width:180px">
        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Выполнение заказа</div>
        <div style="font-size:26px;font-weight:800;color:${pColor};line-height:1">${overallPct}%</div>
        <div style="font-size:12px;color:#64748b;margin:4px 0">${overallFact.toLocaleString('ru')} / ${(+order.quantity||0).toLocaleString('ru')} шт</div>
        <div style="background:#e2e8f0;border-radius:4px;height:6px;overflow:hidden">
          <div style="background:${pColor};height:100%;width:${Math.min(100,overallPct)}%;border-radius:4px"></div>
        </div>
      </div>
    </div>

    <div style="border:1px solid #e2e8f0;border-radius:10px;overflow:auto;max-height:calc(100vh - 300px)">
      <table style="border-collapse:collapse;table-layout:fixed;width:${LEFT_W + dateRange.length * CELL_W}px">
        <thead style="position:sticky;top:0;z-index:3">
          <tr>
            <th style="position:sticky;left:0;z-index:4;background:#1e293b;width:${LEFT_W}px;padding:8px 14px;text-align:left;font-size:11px;color:#94a3b8;border-right:3px solid #334155;letter-spacing:.05em">ПЕРЕДЕЛ</th>
            ${monthHeader}
          </tr>
          <tr>
            <th style="position:sticky;left:0;z-index:4;background:#334155;width:${LEFT_W}px;border-right:3px solid #475569"></th>
            ${dowHeader}
          </tr>
          <tr>
            <th style="position:sticky;left:0;z-index:4;background:#334155;width:${LEFT_W}px;border-right:3px solid #475569;padding:4px 14px;text-align:left;font-size:10px;color:#64748b;font-weight:400"><span style="opacity:.55">▬</span> план &nbsp; <span>▬</span> факт</th>
            ${dayHeader}
          </tr>
        </thead>
        <tbody>${stageRows}</tbody>
      </table>
    </div>
    <div style="margin-top:10px;display:flex;gap:20px;font-size:11px;color:#94a3b8;flex-wrap:wrap">
      <span>Период: <b style="color:#475569">${sortedDates[0]}</b> — <b style="color:#475569">${sortedDates[sortedDates.length-1]}</b> · ${dateRange.length} кал. дн.</span>
      ${dateRange.includes(today)?`<span><b style="color:#f59e0b">■</b> сегодня (${today})</span>`:''}
      <span>Тонкая полоска = план &nbsp;·&nbsp; Широкая полоса = факт</span>
    </div>`;
}

// ================================================================
// MODULE POPULATION
// Наполняем пространства имён модулей. Все функции остаются глобальными
// (для совместимости с inline onclick-атрибутами HTML).
// Модули используются как именованные неймспейсы и для IIFE-подобной инкапсуляции.
// ================================================================
// ================================================================
// MODULE: Серверный режим (фаза 4 миграции)
// ================================================================
/**
 * Клиент серверной версии. Пока переведена ОДНА вкладка — номенклатура.
 *
 * Режим выключен по умолчанию и включается галочкой. Пока он выключен, всё
 * работает ровно как раньше: данные в localStorage, ни одного запроса наружу.
 * Так перевод идёт вкладка за вкладкой, не ломая остальные.
 *
 * Страница отдаётся тем же сервером, что и API, поэтому запросы одноадресные —
 * куки сессии ходят сами, CORS не нужен.
 */
const SRV = {
  KEY: 'plan-server-mode',
  get on() { try { return localStorage.getItem(this.KEY) === '1'; } catch (e) { return false; } },
  set on(v) { try { localStorage.setItem(this.KEY, v ? '1' : '0'); } catch (e) {} },
  user: null,

  /** CSRF-токен Django из куки — нужен для любого небезопасного метода. */
  csrf() {
    const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  },

  async req(method, url, body) {
    const opt = {
      method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
    };
    if (method !== 'GET') opt.headers['X-CSRFToken'] = this.csrf();
    if (body !== undefined) opt.body = JSON.stringify(body);
    const resp = await fetch('/api/' + url, opt);
    if (resp.status === 204) return null;
    let data = null;
    try { data = await resp.json(); } catch (e) {}
    if (!resp.ok) {
      const err = new Error((data && (data.detail || JSON.stringify(data))) || resp.statusText);
      err.status = resp.status;
      err.data = data;
      throw err;
    }
    return data;
  },
  get(u) { return this.req('GET', u); },
  post(u, b) { return this.req('POST', u, b); },
  patch(u, b) { return this.req('PATCH', u, b); },
  del(u) { return this.req('DELETE', u); },

  /** Собрать все страницы списка: серверная выдача постраничная. */
  async all(url) {
    let out = [], next = url;
    while (next) {
      const page = await this.get(next);
      if (!page || !Array.isArray(page.results)) return Array.isArray(page) ? page : out;
      out = out.concat(page.results);
      next = page.next ? page.next.replace(/^.*\/api\//, '') : null;
    }
    return out;
  },

  async whoami() {
    try { this.user = await this.get('me'); } catch (e) { this.user = null; }
    return this.user;
  },

  /** Разделы и их адреса — приходят с сервера вместе с ролями.
   *
   *  Своей копии деления «раздел → сущности» здесь нет намеренно: она бы
   *  разошлась с серверной, и интерфейс начал бы разрешать то, что сервер
   *  запрещает (или наоборот прятать доступное). Пока каталог не загружен,
   *  раздел неизвестен — правку не запрещаем, последнее слово всё равно за
   *  сервером, а глушить интерфейс из-за неотвеченного запроса нельзя.
   */
  sections: null,
  roles: null,
  async loadRoles() {
    try {
      const body = await this.get('roles');
      this.roles = body.roles || [];
      this.sections = body.sections || [];
    } catch (e) { this.roles = null; this.sections = null; }
    return this.sections;
  },
};

/** Раздел по адресу сущности: 'macroplan/' → 'macroplan'. */
function srvSectionOfUrl(url) {
  if (!SRV.sections) return null;
  const prefix = String(url || '').replace(/\/.*$/, '');
  const found = SRV.sections.find(s => (s.paths || []).includes(prefix));
  return found ? found.key : null;
}

/** Раздел переведённой сущности. */
function srvSectionOfKind(kind) {
  const e = SRV_ENTITIES[kind];
  return e ? srvSectionOfUrl(e.url) : null;
}

/** Может ли текущий пользователь править раздел.
 *
 *  Вне серверного режима правит кто угодно — это локальный файл. Настоящая
 *  проверка живёт на сервере; здесь она нужна, чтобы человек не заполнял экран,
 *  который всё равно не сохранится. */
function srvCanEdit(section) {
  if (!SRV.on) return true;
  // Кто мы — неизвестно (`me` не ответил). Запрещать нельзя: один неудачный
  // запрос парализовал бы работу до перезагрузки страницы. Отказ придёт с
  // сервера, а он о правах знает точно.
  if (!SRV.user) return true;
  if (SRV.user.all_sections) return true;
  if (!section) return true;                    // раздел неизвестен — решает сервер
  return (SRV.user.sections_edit || []).includes(section);
}

/** Человеческое название раздела для сообщений. */
function srvSectionTitle(section) {
  const s = (SRV.sections || []).find(x => x.key === section);
  return s ? s.title : section;
}

/** Барьер перед отправкой: правку без права не отсылаем и экран откатываем.
 *
 *  Откат обязателен: без него запись осталась бы на экране, но не в базе, и
 *  человек ушёл бы с уверенностью, что план сохранён. */
async function srvGuardEdit(kind) {
  const section = srvSectionOfKind(kind);
  if (srvCanEdit(section)) return true;
  _alert('Нет прав на изменение раздела «' + srvSectionTitle(section) + '».\n' +
         'Обратитесь к администратору, если правка нужна по работе.');
  await srvLoad(kind);
  renderActive();
  return false;
}

      release_order: b.releaseOrder || '', article_items: b.articleItems || [],
      plan_release: +b.planRelease || 0, snap_at: b.snapAt || '',
    }),
  },
  holidays: {
    url: 'holidays/', coll: 'holidays', label: 'праздник', sync: true,
    toLocal: r => ({ id: srvLocalId(r), srvId: r.id, srvVersion: r.version,
                     date: r.date || '', name: r.name || '' }),
    toSrv: h => ({ src_id: h.id, date: srvDate(h.date), name: h.name || '' }),
  },
  orderLinks: {
    url: 'order-links/', coll: 'orderLinks', label: 'связь ЗК↔ПЗ', sync: true,
    toLocal: r => ({ id: srvLocalId(r), srvId: r.id, srvVersion: r.version,
                     customerOrderId: r.customer_order_src_id,
                     productionOrderId: r.production_order_src_id, qty: +r.qty || 0 }),
    toSrv: l => ({ src_id: l.id, customer_order_src_id: l.customerOrderId,
                   production_order_src_id: l.productionOrderId, qty: +l.qty || 0 }),
  },
};

/** Локальный id записи: у переведённых сущностей он совпадает с `src_id` на сервере. */
function srvLocalId(r) { return r.src_id != null ? r.src_id : r.id; }

/** Дата для DRF: пустая строка не дата, поле должно уехать как null. */
function srvDate(v) { return v ? String(v).slice(0, 10) : null; }

/** Число, допускающее отсутствие (норма-переопределение, явка, состав дня). */
function srvNumOrNull(v) {
  if (v === '' || v == null) return null;
  const n = +v;
  return Number.isFinite(n) ? n : null;
}

/** Убрать ключи со значением undefined: иначе они попадут в слепок как «поле есть». */
function srvDropUndef(o) {
  for (const k in o) if (o[k] === undefined) delete o[k];
  return o;
}

// ── «Поля не было» ≠ «поле равно значению по умолчанию» ─────────────────────
//
// Сервер отдаёт колонки всегда: у пустой смены работника там лежит default 480.
// Но в «Плане» пустая смена означает «как у ОП» (`workersAvailableMinSum` →
// `shiftDurationOf`), а у цеха упаковки это 720 — подставив 480, мы молча срезали
// бы треть мощности. То же с эффективностью варианта ФРВ («как у записи») и со
// сменой в помесячной правке графика («как у бригады», `getScheduleView`).
//
// Поэтому сервер присылает список отсутствовавших полей (`absent_fields`), мы их
// выбрасываем, а отправляя запись обратно — заново сообщаем, каких полей нет.

/** Выбросить поля, которых в исходной записи не было. */
function srvApplyAbsent(local, absentList, allowed) {
  for (const k of (absentList || [])) if (allowed.indexOf(k) >= 0) delete local[k];
  return local;
}

/** Какие из полей отсутствуют сейчас — для отправки на сервер. */
function srvAbsentOf(local, allowed) {
  return allowed.filter(k => local[k] === undefined);
}

const SRV_ABSENT_MONTH_OVR = ['name', 'shiftTime', 'effPct'];

/** Поля вложенных записей. `id` служебный, остальные отслеживаются на отсутствие. */
const SRV_CHILD = {
  schedWorker: ['id', 'name', 'staffCount', 'shiftTime', 'effPct', 'absence'],
  microWorker: ['id', 'name', 'staffCount', 'attendance', 'shiftTime', 'effPct', 'absence'],
  frvSegment:  ['id', 'name', 'people', 'shiftMin', 'workDays', 'effPct', 'absence'],
  subOrder:    ['id', 'releaseOrder', 'launchOrder', 'articleItems', 'planRelease',
                'planReleaseMain', 'planReleaseExtra', 'factRelease', 'factLaunch',
                'planReleaseIsManual', 'learningEff'],
  launch:      ['id', 'order', 'articleItem', 'qty'],
  delivery:    ['id', 'base', 'date', 'quantity'],
  routeItem:   ['stage', 'articleItem', 'name', 'timeCost'],
};

/** Вложенная запись сервера → запись приложения: вернуть несмоделированные поля
 *  и выбросить те, которых в исходной записи не было. */
function srvChildIn(local, raw, own) {
  const ex = raw.extra_fields;
  if (ex) for (const k in ex) local[k] = ex[k];
  return srvApplyAbsent(local, raw.absent_fields, own);
}

/** Вложенная запись приложения → тело запроса: добавить признак отсутствия и
 *  остаток полей, которые сервер хранит в `extra`. */
function srvChildOut(body, local, own) {
  body.absent_fields = own.filter(k => k !== 'id' && local[k] === undefined);
  const ex = {};
  let has = false;
  for (const k in local) if (own.indexOf(k) < 0) { ex[k] = local[k]; has = true; }
  if (has) body.extra_fields = ex;
  return body;
}

/** Загрузить сущность с сервера в S. Возвращает true при успехе. */
async function srvLoad(kind) {
  if (kind === 'timeCosts') return srvLoadTimeCosts();
  const e = SRV_ENTITIES[kind];
  try {
    const rows = await SRV.all(e.url + '?limit=200');
    S[e.coll] = rows.map(r => srvToLocal(e, r));
    srvRemember(kind);
    return true;
  } catch (err) {
    // Слепок НЕ обновляем: иначе следующая синхронизация сочла бы недогруженный
    // список полным и удалила бы на сервере всё, что не доехало.
    srvForget(kind);
    _alert('Не удалось загрузить данные с сервера:\n' + srvErrText(err) +
           '\n\nВкладка показывает последние загруженные данные.');
    return false;
  }
}

/** Создать запись на сервере. Список перечитываем целиком: сервер мог что-то
 *  нормализовать, и гадать об этом не нужно. */
async function srvCreate(kind, obj) {
  const e = SRV_ENTITIES[kind];
  if (!(await srvGuardEdit(kind))) return;
  try {
    await SRV.post(e.url, e.toSrv(obj));
  } catch (err) {
    _alert('Не удалось создать ' + e.label + ':\n' + srvErrText(err));
    return;
  }
  await srvLoad(kind);
  renderActive();
}

/** Сохранить правку.
 *
 *  Версия отправляется вместе с данными: если запись успел изменить кто-то
 *  другой, сервер ответит 409, и мы перечитываем список, а не затираем чужую
 *  правку молча. */
async function srvUpdate(kind, obj) {
  const e = SRV_ENTITIES[kind];
  if (!obj.srvId) { _alert('Запись ещё не сохранена на сервере.'); return; }
  if (!(await srvGuardEdit(kind))) return;
  try {
    const body = e.toSrv(obj);
    body.version = obj.srvVersion;
    const saved = await SRV.patch(e.url + obj.srvId + '/', body);
    obj.srvVersion = saved.version;
  } catch (err) {
    _alert('Не удалось сохранить:\n' + srvErrText(err));
    await srvLoad(kind);
  }
  renderActive();
}

/** Удалить запись на сервере. */
async function srvDelete(kind, localId) {
  const e = SRV_ENTITIES[kind];
  const obj = byId(S[e.coll], localId);
  if (!obj || !obj.srvId) { _alert('Запись не найдена на сервере.'); return; }
  if (!(await srvGuardEdit(kind))) return;
  try {
    await SRV.del(e.url + obj.srvId + '/');
  } catch (err) {
    _alert('Не удалось удалить:\n' + srvErrText(err));
  }
  await srvLoad(kind);
  renderActive();
}

// ─────────────── Синхронизация вкладок планирования по разнице ───────────────
//
// Справочники переведены точечным перехватом: `addOp`/`updOp`/`delOp` и им подобные
// сами ходят на сервер. Для остальных вкладок так нельзя — там больше полусотни
// мелких обработчиков полей (`updMacroCell`, `updMacroCellEff`, `updMacroRowMonth`,
// `updMicroWorkerField`, …), и перехватить каждый значит гарантированно забыть часть.
// Забытый обработчик молча правит только локальную копию: на экране всё верно, а на
// сервере остаётся старое значение — расхождение обнаружится через недели.
//
// Поэтому точка одна: `save()`. Обработчики работают как раньше — правят `S` и
// сохраняются, — а синхронизация сравнивает коллекцию со СЛЕПКОМ того, что сервер
// видел последним, и отправляет только разницу.
//
// Свойство безопасности: пока слепка нет (загрузка не удалась или режим только что
// включён), синхронизация по этой коллекции не работает вовсе — см. `srvForget`.

// ── Поля, не разложенные по колонкам ────────────────────────────────────────
//
// В базе они лежат в `extra` и при выгрузке возвращаются в запись как есть.
// Сервер отдаёт их отдельным ключом `extra_fields`, и мы возвращаем их в объект,
// а при отправке собираем обратно. Без этого сохранение записи стирало бы всё,
// чего не знает `toLocal`: в правках дня так живёт СОСТАВ РАБОТНИКОВ на конкретный
// день (мощность этого дня), в номенклатуре — старые поля норм.
//
// Набор «своих» полей выводится из самого `toLocal`, а не задаётся списком:
// список пришлось бы править параллельно с каждым переводом формата, а
// параллельные описания одного и того же расходятся — так уже потерялись
// `orderLinks` и `macroEff` (DATA_CONTRACT.md §4).

const _srvOwnKeysCache = new Map();

/** Ключи, которые сущность ведёт сама. */
function srvOwnKeys(e) {
  if (!_srvOwnKeysCache.has(e)) {
    const probe = e.toLocal({});
    _srvOwnKeysCache.set(e, new Set(Object.keys(probe).concat(['srvId', 'srvVersion'])));
  }
  return _srvOwnKeysCache.get(e);
}

/** Ключи, отслеживаемые на отсутствие: свои, кроме служебных. */
function srvTrackedKeys(e) {
  return [...srvOwnKeys(e)].filter(k => k !== 'srvId' && k !== 'srvVersion' && k !== 'id');
}

/** Запись сервера → запись приложения: вернуть несмоделированные поля и выбросить
 *  те, которых в исходной записи не было (см. `srvApplyAbsent`). */
function srvToLocal(e, r) {
  const o = e.toLocal(r);
  const ex = r.extra_fields;
  if (ex) for (const k in ex) o[k] = ex[k];
  const tracked = srvTrackedKeys(e);
  // `null_fields` — ключ был, но со значением null. Это не то же, что отсутствие:
  // выгрузка обязана вернуть именно null, а не значение по умолчанию.
  for (const k of (r.null_fields || [])) if (tracked.indexOf(k) >= 0) o[k] = null;
  return srvApplyAbsent(o, r.absent_fields, tracked);
}

/** Запись приложения → тело запроса, вместе с несмоделированными полями. */
function srvToSrv(e, o) {
  const body = e.toSrv(o);
  const own = srvOwnKeys(e);
  const ex = {};
  let has = false;
  for (const k in o) if (!own.has(k)) { ex[k] = o[k]; has = true; }
  if (has) body.extra_fields = ex;
  const tracked = srvTrackedKeys(e);
  body.absent_fields = tracked.filter(k => o[k] === undefined);
  body.null_fields = tracked.filter(k => o[k] === null);
  return body;
}

/** Слепки серверного состояния: { коллекция: { ключ: {body, srvId} } }. */
SRV.mirror = {};

/** Ключ записи в слепке. По умолчанию — локальный id; у бесключевых сущностей свой. */
function srvKeyOf(e, obj) { return String(e.key ? e.key(obj) : obj.id); }

/** Запомнить текущее состояние коллекции как «сервер это видел». */
function srvRemember(kind) {
  const e = SRV_ENTITIES[kind];
  if (!e || !e.sync) return;
  const snap = {};
  for (const o of (S[e.coll] || [])) {
    snap[srvKeyOf(e, o)] = { body: JSON.stringify(srvToSrv(e, o)), srvId: o.srvId };
  }
  SRV.mirror[e.coll] = snap;
}

/** Забыть слепок: синхронизация этой коллекции выключается до успешной загрузки. */
function srvForget(kind) {
  const e = SRV_ENTITIES[kind];
  if (e) delete SRV.mirror[e.coll];
}

/** Список сущностей, участвующих в синхронизации. */
function srvSyncKinds() {
  return Object.keys(SRV_ENTITIES).filter(k => SRV_ENTITIES[k].sync);
}

/** Разница коллекции со слепком: что создать, что обновить, что удалить. */
function srvDiff(kind) {
  const e = SRV_ENTITIES[kind];
  const prev = SRV.mirror[e.coll];
  if (!prev) return null;                       // слепка нет — сравнивать не с чем
  const create = [], update = [], remove = [];
  const seen = new Set();
  for (const o of (S[e.coll] || [])) {
    const k = srvKeyOf(e, o);
    seen.add(k);
    const body = JSON.stringify(srvToSrv(e, o));
    const was = prev[k];
    if (!was || !was.srvId) create.push({ key: k, obj: o, body });
    else if (was.body !== body) update.push({ key: k, obj: o, body, srvId: was.srvId });
  }
  for (const k in prev) {
    if (!seen.has(k) && prev[k].srvId) remove.push({ key: k, srvId: prev[k].srvId });
  }
  return { create, update, remove };
}

let _srvSyncBusy = false, _srvSyncAgain = false;

/** Отправить накопленную разницу. Вызывается из `save()`, поэтому не бросает. */
async function srvSync() {
  if (!SRV.on) return;
  if (_srvSyncBusy) { _srvSyncAgain = true; return; }   // правки идут пачками
  _srvSyncBusy = true;
  try {
    await _srvSyncOnce();
  } catch (err) {
    console.error('srvSync:', err);
  } finally {
    _srvSyncBusy = false;
    if (_srvSyncAgain) { _srvSyncAgain = false; srvSync(); }
  }
}

async function _srvSyncOnce() {
  const errors = [];
  const denied = [];
  let sent = 0;
  for (const kind of srvSyncKinds()) {
    const e = SRV_ENTITIES[kind];
    const d = srvDiff(kind);
    if (!d) continue;
    if (!d.create.length && !d.update.length && !d.remove.length) continue;

    // Раздел не свой — не отправляем. Слепок при этом НЕ обновляем: иначе правка
    // считалась бы учтённой, и следующая синхронизация её уже не увидела бы.
    // Экран откатываем ниже, одним перечитыванием на все запрещённые виды.
    if (!srvCanEdit(srvSectionOfKind(kind))) { denied.push(kind); continue; }

    // Массовое удаление почти всегда означает не «пользователь всё стёр», а сбой:
    // недогруженный список, промах миграции, чужой импорт поверх. Спрашиваем.
    if (!(await srvConfirmMassDelete(e, d.remove.length))) { srvRemember(kind); continue; }

    await srvRunLimited(d.create.map(it => async () => {
      try {
        const saved = await SRV.post(e.url, JSON.parse(it.body));
        it.obj.srvId = saved.id; it.obj.srvVersion = saved.version; sent++;
      } catch (err) { errors.push(`${e.label}: ${srvErrText(err)}`); }
    }));
    await srvRunLimited(d.update.map(it => async () => {
      try {
        const body = JSON.parse(it.body);
        body.version = it.obj.srvVersion;
        const saved = await SRV.patch(e.url + it.srvId + '/', body);
        it.obj.srvVersion = saved.version; sent++;
      } catch (err) { errors.push(`${e.label}: ${srvErrText(err)}`); }
    }));
    await srvRunLimited(d.remove.map(it => async () => {
      try { await SRV.del(e.url + it.srvId + '/'); sent++; }
      catch (err) { errors.push(`${e.label}: ${srvErrText(err)}`); }
    }));

    srvRemember(kind);
  }
  if (srvCanEdit(srvSectionOfUrl('time-costs/'))) sent += await srvSyncTimeCosts(errors);
  if (denied.length) {
    const titles = [...new Set(denied.map(k => srvSectionTitle(srvSectionOfKind(k))))];
    for (const kind of denied) await srvLoad(kind);
    renderActive();
    _alert('Нет прав на изменение: ' + titles.join(', ') + '.\n' +
           'Правка не сохранена, на экране снова данные сервера.');
  }
  if (errors.length) {
    // Одно сообщение на пачку: при пересчёте месяца строк сотни, и по алерту на
    // каждую страницу было бы не закрыть.
    const head = errors.slice(0, 5).join('\n');
    _alert('Часть изменений не сохранилась на сервере:\n' + head +
           (errors.length > 5 ? `\n… и ещё ${errors.length - 5}` : '') +
           '\n\nНажмите «Обновить с сервера», чтобы увидеть актуальные данные.');
  }
  return sent;
}

/** Запуск с ограничением одновременных запросов: сотни PATCH подряд — это минуты. */
async function srvRunLimited(tasks, limit) {
  const cap = limit || 6;
  let i = 0;
  const workers = Array.from({ length: Math.min(cap, tasks.length) }, async () => {
    while (i < tasks.length) await tasks[i++]();
  });
  await Promise.all(workers);
}

// ── Нормы по заказу (S.tcRcOverrides / S.tcShOverrides) ─────────────────────
//
// В приложении это два словаря `{номер_заказа: норма}`, на сервере — одна таблица
// с переделом. Своей записи-объекта у нормы нет, поэтому общий механизм разницы
// (он ходит по массивам с id) сюда не годится, и синхронизация у неё отдельная.
// Норма РЦ индивидуальна по заказу сознательно — «спрямлять» её на все заказы
// артикула нельзя (CLAUDE.md §4.3).

const SRV_TC_STAGES = [['РЦ', 'tcRcOverrides'], ['ШЦ', 'tcShOverrides']];

/** Оба словаря как плоская карта `заказ|передел → норма`. */
function srvTcFlat() {
  const out = {};
  for (const [stage, coll] of SRV_TC_STAGES) {
    const d = S[coll] || {};
    for (const k in d) {
      const v = +d[k];
      if (Number.isFinite(v)) out[k + '|' + stage] = v;
    }
  }
  return out;
}

async function srvLoadTimeCosts() {
  try {
    const rows = await SRV.all('time-costs/?limit=200');
    const byStage = { 'РЦ': {}, 'ШЦ': {} };
    SRV.tcIds = {};
    for (const r of rows) {
      if (!byStage[r.stage]) continue;
      byStage[r.stage][r.order_number] = +r.time_cost || 0;
      SRV.tcIds[r.order_number + '|' + r.stage] = r.id;
    }
    S.tcRcOverrides = byStage['РЦ'];
    S.tcShOverrides = byStage['ШЦ'];
    SRV.mirror.__tc = srvTcFlat();
    return true;
  } catch (err) {
    delete SRV.mirror.__tc;
    _alert('Не удалось загрузить нормы по заказам:\n' + srvErrText(err));
    return false;
  }
}

/** Разницу норм отправляем отдельно от остальных сущностей. */
async function srvSyncTimeCosts(errors) {
  const prev = SRV.mirror.__tc;
  if (!prev) return 0;
  const cur = srvTcFlat();
  SRV.tcIds = SRV.tcIds || {};
  const tasks = [];
  let sent = 0;

  for (const k in cur) {
    if (prev[k] === cur[k]) continue;
    const [order, stage] = k.split('|');
    const srvId = SRV.tcIds[k];
    tasks.push(async () => {
      try {
        if (srvId) await SRV.patch('time-costs/' + srvId + '/', { time_cost: cur[k] });
        else {
          const saved = await SRV.post('time-costs/',
            { order_number: order, stage, time_cost: cur[k] });
          SRV.tcIds[k] = saved.id;
        }
        sent++;
      } catch (err) { errors.push(`норма ${order} (${stage}): ${srvErrText(err)}`); }
    });
  }
  for (const k in prev) {
    if (k in cur) continue;
    const srvId = SRV.tcIds[k];
    if (!srvId) continue;
    tasks.push(async () => {
      try { await SRV.del('time-costs/' + srvId + '/'); delete SRV.tcIds[k]; sent++; }
      catch (err) { errors.push(`норма ${k}: ${srvErrText(err)}`); }
    });
  }

  if (tasks.length) await srvRunLimited(tasks);
  SRV.mirror.__tc = srvTcFlat();
  return sent;
}

/** Подтверждение массового удаления. Порог — и доля, и абсолютное число. */
async function srvConfirmMassDelete(e, count) {
  if (!count) return true;
  const total = Object.keys(SRV.mirror[e.coll] || {}).length || 1;
  if (count <= 5 || count / total < 0.2) return true;
  return await _confirm(`Синхронизация собирается удалить на сервере ${count} записей ` +
                        `из ${total} («${e.label}»).\n\nЕсли вы этого не делали — откажитесь ` +
                        `и обновите данные с сервера.\n\nУдалить?`);
}

/** Карточка номенклатуры: формат сервера → формат приложения. */
function srvNomToLocal(r) {
  return {
    id: r.src_id != null ? r.src_id : r.id,
    srvId: r.id,                 // первичный ключ на сервере — для правок
    srvVersion: r.version,       // версия для оптимистичной блокировки
    articleGp: r.article_gp || '',
    articleItem: r.article_item || r.article_gp || '',
    name: r.name || '',
    model: r.model_code || '',
    assortmentGroup: r.assortment_group || '',
    normType: r.norm_type || 'БТК',
    acFlag: !!r.ac_flag,
    nomOps: r.nom_ops || [],
    nomWorkshops: r.nom_workshops || [],
    route: (r.route || []).map(i => srvRouteIn(i)),
    // Маршруты на уровень ОП: разные площадки шьют одно изделие по-разному
    // (CLAUDE.md §4.1). Пустой список означает «переопределений нет» — тогда
    // действует базовый маршрут, и это свойство безопасности терять нельзя.
    routeOverrides: (r.route_overrides || []).map(o => ({
      op: o.op_name || '',
      route: (o.items || []).map(i => srvRouteIn(i)),
    })),
  };
}

/** Строка маршрута: формат сервера → формат приложения. */
function srvRouteIn(i) {
  return srvChildIn({
    stage: i.stage, articleItem: i.article_item || '',
    name: i.name || '', timeCost: +i.time_cost || 0,
  }, i, SRV_CHILD.routeItem);
}

/** Строка маршрута: формат приложения → тело запроса. */
function srvRouteOut(i) {
  return srvChildOut({
    stage: i.stage || '', article_item: i.articleItem || '',
    name: i.name || '', time_cost: +i.timeCost || 0,
  }, i, SRV_CHILD.routeItem);
}

/** Формат приложения → тело запроса. Отправляем только то, что сервер принимает. */
function localNomToSrv(n) {
  return {
    article_gp: n.articleGp || '',
    article_item: n.articleItem || '',
    name: n.name || '',
    model_code: n.model || '',
    assortment_group: n.assortmentGroup || '',
    norm_type: n.normType || 'БТК',
    ac_flag: !!n.acFlag,
    nom_ops: n.nomOps || [],
    nom_workshops: n.nomWorkshops || [],
    route: (n.route || []).map(srvRouteOut),
    route_overrides: (n.routeOverrides || []).map(o => ({
      op_name: o.op || '',
      items: (o.route || []).map(srvRouteOut),
    })),
  };
}

/** Загрузить номенклатуру с сервера. Обёртка над общей `srvLoad`. */
function srvLoadNomenclature() { return srvLoad('nomenclature'); }

/** Разбор ошибки сервера в понятный пользователю текст. */
function srvErrText(e) {
  if (e.status === 409) {
    return 'Карточку изменил другой пользователь. Данные обновлены — повторите правку.';
  }
  if (e.status === 403) return 'Нет прав на это изменение.';
  if (e.status === 401) return 'Сессия истекла. Войдите заново.';
  if (e.data && typeof e.data === 'object') {
    const parts = [];
    for (const k in e.data) parts.push(`${k}: ${[].concat(e.data[k]).join(', ')}`);
    if (parts.length) return parts.join('\n');
  }
  return e.message || 'Неизвестная ошибка';
}

/** Порядок загрузки: справочники раньше планов — ссылки в планах идут на ОП по
 *  имени и на контракты/бригады по id, и рисовать план без них бессмысленно. */
const SRV_LOAD_ORDER = ['ops', 'bases', 'deliveryMatrix', 'nomenclature', 'holidays',
                        'contracts', 'orders', 'orderLinks',
                        'schedules', 'scheduleMonthOverrides', 'calOverrides', 'manualFrv',
                        'macroplan', 'macroEff', 'microplan', 'planBaseline', 'timeCosts'];

/**
 * Форма входа. Своя, а не встроенная страница Django: сессия нужна той же
 * вкладке, в которой человек работает, и уводить его на чужой экран, чтобы он
 * вернулся и снова щёлкнул переключатель, — лишний шаг на ровном месте.
 *
 * Возвращает описание пользователя или null, если вход не выполнен.
 */
function srvLoginDialog() {
  return new Promise(function(resolve) {
    const overlay = document.createElement('div');
    overlay.className = 'dlg-overlay';
    const box = document.createElement('div');
    box.className = 'dlg-box';
    box.innerHTML =
      '<div class="dlg-msg"><b>Вход на сервер</b><br>' +
      '<span style="font-size:12px;color:#64748b">Логин и пароль выдаёт администратор</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin:10px 0">' +
        '<input id="_srvUser" placeholder="Логин" autocomplete="username" ' +
               'style="padding:8px;border:1px solid #cbd5e1;border-radius:6px">' +
        '<input id="_srvPass" type="password" placeholder="Пароль" ' +
               'autocomplete="current-password" ' +
               'style="padding:8px;border:1px solid #cbd5e1;border-radius:6px">' +
        '<div id="_srvErr" style="color:#dc2626;font-size:12px;min-height:16px"></div>' +
      '</div>' +
      '<div class="dlg-btns">' +
        '<button class="btn btn-outline" id="_srvCancel">Отмена</button>' +
        '<button class="btn btn-primary" id="_srvOk">Войти</button>' +
      '</div>';
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const close = (val) => { overlay.parentNode && document.body.removeChild(overlay); resolve(val); };
    const err = box.querySelector('#_srvErr');
    const submit = async () => {
      err.textContent = '';
      try {
        const me = await SRV.post('login', {
          username: box.querySelector('#_srvUser').value,
          password: box.querySelector('#_srvPass').value,
        });
        SRV.user = me;
        close(me);
      } catch (e) {
        err.textContent = srvErrText(e);
      }
    };
    box.querySelector('#_srvOk').onclick = submit;
    box.querySelector('#_srvCancel').onclick = () => close(null);
    box.querySelectorAll('input').forEach(el => {
      el.onkeydown = (ev) => { if (ev.key === 'Enter') submit(); };
    });
    box.querySelector('#_srvUser').focus();
  });
}

/** Выйти с сервера и вернуться к локальной работе. */
async function srvLogout() {
  try { await SRV.post('logout', {}); } catch (e) {}
  SRV.user = null;
  await toggleServerMode(false);
}

/** Переключатель режима. Включение сразу тянет данные с сервера — все вкладки,
 *  потому что держать часть данных на сервере, а часть локально нельзя: расчёт
 *  ходит по всем коллекциям сразу и на смеси даст неверный план. */
async function toggleServerMode(on) {
  // Включение ЗАМЕЩАЕТ то, что на экране, данными базы. Если человек только что
  // загрузил файл локально, его данные исчезнут — и выглядит это как поломка,
  // хотя файл просто никогда не был в базе. Предупреждаем до, а не объясняем после.
  if (on && !SRV.on) {
    const local = srvLocalRecordCount();
    if (local > 0 && !await _confirm(
        `Сейчас на экране данные из этого браузера (${local} записей).\n\n` +
        'Включение серверного режима покажет то, что лежит в базе, — локальные ' +
        'данные с экрана уйдут.\n\nЕсли их нужно перенести в базу: выключите ' +
        'режим, выгрузите файл («Файл» → «Экспорт»), включите режим и залейте ' +
        'файл кнопкой «Залить файл» (она у администратора).\n\nВключить?')) {
      renderActive();
      return;
    }
  }

  SRV.on = on;
  if (on) {
    let me = await SRV.whoami();
    if (!me) me = await srvLoginDialog();
    if (!me) {
      SRV.on = false;
      _alert('Вход не выполнен — режим остался выключенным.');
      renderActive();
      return;
    }
    await SRV.loadRoles();
    for (const kind of SRV_LOAD_ORDER) await srvLoad(kind);
    // Счётчик id живёт в localStorage и с сервера не приходит. Без пересчёта новая
    // запись получила бы id=1 и столкнулась бы с существующими — а на них завязаны
    // ссылки (contractId, scheduleId) во всех планах.
    recalcNextId();
  } else {
    // Выключили — забываем слепки: иначе после возврата в режим первая же правка
    // сравнилась бы с состоянием месячной давности и наделала лишних запросов.
    SRV.mirror = {};
  }
  renderActive();
}

// ================================================================
// Инициализация
// ================================================================
loadLS();
applyUiTheme(getUiTheme());
if (!_idbLoadPending) renderActive();

// Серверный режим был включён — подтянуть данные сразу. Иначе после перезагрузки
// страницы человек работал бы с локальным снимком: на экране старое, а слепка нет,
// поэтому правки на сервер не уходят — расхождение молчаливое.
if (SRV.on) {
  (async () => {
    if (!(await SRV.whoami())) {
      _alert('Серверный режим включён, но войти на сервер не удалось.\n\n' +
             'Данные показаны из локальной копии и НЕ синхронизируются. ' +
             'Войдите и обновите страницу.');
      return;
    }
    await SRV.loadRoles();
    for (const kind of SRV_LOAD_ORDER) await srvLoad(kind);
    recalcNextId();
    renderActive();
  })().catch(e => console.warn('серверный режим:', e));
}

// Пробуем восстановить FSA-хэндл из IDB и, если данных нет, загрузить из файла
if (_fsaSupported()) {
  _fshLoad().then(function(handle) {
    if (!handle) return;
    // Проверяем разрешение (queryPermission не требует жеста пользователя)
    return handle.queryPermission({ mode: 'readwrite' }).then(function(perm) {
      if (perm !== 'granted') return; // нет разрешения — ждём следующего импорта
      _fsh = handle;
      if (_hasData()) return; // localStorage/IDB уже загрузили данные
      // Данных нет — тихо загружаем из файла
      return handle.getFile().then(function(f) { importAllData(f, true); });
    });
  }).catch(function(e) { console.warn('FSA restore:', e); });
}
