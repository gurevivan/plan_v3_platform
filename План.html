/** Итоги последней отрисовки аналитики — для сверки с расчётом сервера. */
let _analyticsTotals = null;

function renderAnalytics() {
  const el = document.getElementById('tab-analytics');
  const curMonth = analyticsMonth || new Date().toISOString().slice(0, 7);
  const opF = analyticsOp || '';
  const conF = analyticsContract || '';
  const stF = analyticsStage || '';
  const artF = analyticsArticle || '';
  const asgF = analyticsAssortment || '';
  const briF = analyticsBrigade || '';
  const unit = analyticsUnit === 'min' ? 'min' : 'qty';
  const unitLabel = unit === 'min' ? 'мин' : 'шт';

  const allAssortments = [...new Set((S.nomenclature || []).map(n => n.assortmentGroup).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'ru'));
  const allOps = [...new Set(S.ops.map(o => o.name))].sort((a, b) => a.localeCompare(b, 'ru'));
  const allContracts = [...new Set((S.contracts || []).map(c => c.number).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'ru'));
  // Передел бригады (графика) — по processType её ОП/цеха.
  const _schedStage = (s) => {
    const opRec = (S.ops || []).find(o => o.name === s.op && o.workshop === s.workshop);
    return opRec ? (opRec.processType || '') : '';
  };
  // Бригады, по которым реально есть строки микроплана (пустые не показываем).
  const _usedSchedIds = new Set(S.microplan.map(m => m.scheduleId).filter(v => v != null).map(String));
  // Бригады (графики) для фильтра — только для выбранного ОП и передела и только непустые.
  const allBrigades = (S.schedules || [])
    .filter(s => (!opF || s.op === opF) && (!stF || _schedStage(s) === stF) && _usedSchedIds.has(String(s.id)))
    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ru'));
  // ОП выбранной бригады — для согласованной фильтрации макроплана.
  const briOp = briF ? ((S.schedules || []).find(s => String(s.id) === String(briF))?.op || '') : '';
  // Артикулы изделий, встречающиеся в микроплане за выбранный месяц.
  // Список артикулов для фильтра: микроплан + макроплан за ВЕСЬ год (а не только
  // текущий месяц), иначе на пустом месяце список оказывался пуст, и в годовой
  // таблице фильтр был бесполезен.
  const _filterYear = curMonth.slice(0, 4);
  const _microAis = S.microplan
    .filter(m => m.date && m.date.startsWith(_filterYear))
    .flatMap(m => microRowArticleItems(m));
  const _macroAis = S.macroplan
    .filter(r => (r.month || '').startsWith(_filterYear))
    .map(r => r.articleItem || '');
  const allArticles = [...new Set([..._microAis, ..._macroAis].filter(Boolean).map(articleGpForMacroArticleItem))]
    .sort((a, b) => a.localeCompare(b, 'ru'));
  // Выбранный артикул мог отсутствовать в году — всё равно оставляем в списке.
  if (artF && !allArticles.includes(artF)) allArticles.push(artF);
  const STAGES_A = ['РЦ', 'АЦ', 'ШЦ', 'У'];

  // Множество id контрактов, попадающих под фильтр контракта.
  const conIdSet = conF
    ? new Set((S.contracts || []).filter(c => c.number === conF).map(c => +c.id))
    : null;
  // Номера производственных заказов, относящихся к выбранному контракту.
  const conOrderNums = conF
    ? new Set((S.orders || [])
        .filter(o => contractNumsForOrder(o.number).includes(conF))
        .map(o => o.number))
    : null;

  // Единое определение передела строки (микро/макро): приоритет — processType ОП,
  // запасной вариант — собственное поле stage строки. Так фильтр «Передел»
  // одинаково отбирает и микроплан, и макроплан.
  function stageOfRow(r) {
    return stageOfMacroRow(r);
  }

  /** Ассортиментная группа строки (по ГП её артикула). */
  function assortmentOfRow(r) {
    const ai = (microRowArticleItems(r)[0]) || r.articleItem || '';
    const gp = articleGpForMacroArticleItem(ai);
    const nom = S.nomenclature.find(n => n.articleGp === gp);
    return nom ? (nom.assortmentGroup || '') : '';
  }

  /** Подходит ли строка микроплана под фильтры ОП / контракт / передел / артикул / ассорт.группу. */
  function rowMatches(m) {
    if (opF && m.op !== opF) return false;
    if (briF && String(m.scheduleId) !== String(briF)) return false;
    if (stF && stageOfRow(m) !== stF) return false;
    if (artF && !microRowArticleItems(m).some(ai => articleGpForMacroArticleItem(ai) === artF)) return false;
    if (asgF && assortmentOfRow(m) !== asgF) return false;
    if (conF) {
      const byContractId = conIdSet && conIdSet.has(+m.contractId);
      const byOrder = m.releaseOrder && conOrderNums && conOrderNums.has(m.releaseOrder);
      if (!byContractId && !byOrder) return false;
    }
    return true;
  }

  /** План выпуска по строке микроплана (с учётом подзаказов). */
  function rowPlan(m) {
    let v = +m.planRelease || 0;
    if (Array.isArray(m.subOrders)) v += m.subOrders.reduce((s, x) => s + (+x.planRelease || 0), 0);
    return v;
  }
  /** Факт выпуска по строке микроплана (с учётом подзаказов). */
  function rowFact(m) {
    let v = +m.factRelease || 0;
    if (Array.isArray(m.subOrders)) v += m.subOrders.reduce((s, x) => s + (+x.factRelease || 0), 0);
    return v;
  }

  /** Подходит ли строка макроплана под фильтры ОП / контракт / передел / артикул. */
  function macroRowMatches(r) {
    if (opF && r.op !== opF) return false;
    // Макроплан не привязан к бригаде — согласуем по ОП выбранной бригады.
    if (briOp && r.op !== briOp) return false;
    if (conF && !(conIdSet && conIdSet.has(+r.contractId))) return false;
    if (artF && articleGpForMacroArticleItem(r.articleItem) !== artF) return false;
    if (stF && stageOfRow(r) !== stF) return false;
    if (asgF && assortmentOfRow(r) !== asgF) return false;
    return true;
  }
  // ── Готовая продукция (изделия) без суммирования переделов и узлов ──
  // Передел агрегации: выбранный в фильтре «Передел», иначе — последний передел
  // маршрута, по которому есть план/факт в этом месяце (= готовая продукция).
  // Внутри передела целые изделия суммируются, узлы (/1,/2,/3) — min (комплект).
  const gpSetAll = new Set(S.nomenclature.map(n => n.articleGp).filter(Boolean));
  const monthMacroRows = S.macroplan.filter(r => r.month === curMonth && macroRowMatches(r));
  const monthMicroAll = S.microplan.filter(m => m.date && m.date.startsWith(curMonth) && rowMatches(m));
  let aggStage = stF;
  if (!aggStage) {
    for (const s of STAGES_A) {
      if (monthMacroRows.some(r => stageOfRow(r) === s) || monthMicroAll.some(m => stageOfRow(m) === s)) aggStage = s;
    }
  }
  const atAggStage = r => !aggStage || stageOfRow(r) === aggStage;
  // Для ШТУК микроплана агрегируем по самому глубокому переделу, реально присутствующему
  // в МИКРОПЛАНЕ (иначе при частичном плане — напр. только РЦ — штуки = 0, хотя минуты есть).
  let aggStageMicro = stF;
  if (!aggStageMicro) {
    for (const s of STAGES_A) if (monthMicroAll.some(m => stageOfRow(m) === s)) aggStageMicro = s;
    if (!aggStageMicro) aggStageMicro = aggStage;
  }
  const atAggStageMicro = r => !aggStageMicro || stageOfRow(r) === aggStageMicro;
  // Макроплан месяца. Штуки — комплекты на переделе готовой продукции (целые + min узлов).
  // Минуты — суммарная трудоёмкость макроплана (труд аддитивен по переделам и узлам).
  const macroPlanMonth = unit === 'min'
    ? Math.round(monthMacroRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0))
    : stageKitQtyForRows(monthMacroRows.filter(atAggStage), gpSetAll);

  // ── Разбивка месяца на недели (пн–вс), обрезанные границами месяца ──
  const [yy, mm] = curMonth.split('-').map(Number);
  const daysCnt = new Date(yy, mm, 0).getDate();
  const weeks = [];
  let wStart = 1;
  while (wStart <= daysCnt) {
    const d = new Date(yy, mm - 1, wStart);
    const dow = (d.getDay() + 6) % 7; // 0 = понедельник
    let wEnd = wStart + (6 - dow);
    if (wEnd > daysCnt) wEnd = daysCnt;
    weeks.push({ start: wStart, end: wEnd });
    wStart = wEnd + 1;
  }
  const pad = n => String(n).padStart(2, '0');
  const dateStr = day => `${curMonth}-${pad(day)}`;

  // ── План/факт по микроплану на переделе готовой продукции (kit-aware) ──
  // Считаем комплекты (целые + min по узлам), а не сумму строк всех переделов.
  const aggMicroRows = monthMicroAll.filter(atAggStage);
  const microEntries = (rows, field) => rows.map(m => ({
    articleItem: (microRowArticleItems(m)[0]) || m.articleItem || '',
    qty: field === 'plan' ? rowPlan(m) : rowFact(m)
  }));
  // Минуты строки микроплана (трудоёмкость) = кол-во × норма передела строки.
  const rowMin = (m, field) => {
    const q = field === 'plan' ? rowPlan(m) : rowFact(m);
    const ai = (microRowArticleItems(m)[0]) || m.articleItem || '';
    return q * tcForMicroRow(m, ai);
  };
  // Метрики, зависящие от единицы:
  //  • штуки — комплекты (целые + min по узлам) на переделе готовой продукции;
  //  • минуты — суммарная трудоёмкость (труд аддитивен) по ВСЕМ матченным переделам.
  const metricRows = unit === 'min' ? monthMicroAll : aggMicroRows;
  const planOf = rows => unit === 'min'
    ? Math.round(rows.reduce((s, m) => s + rowMin(m, 'plan'), 0))
    : kitQtyFromEntries(microEntries(rows, 'plan'), gpSetAll);
  const factOf = rows => unit === 'min'
    ? Math.round(rows.reduce((s, m) => s + rowMin(m, 'fact'), 0))
    : kitQtyFromEntries(microEntries(rows, 'fact'), gpSetAll);

  // Метрики за произвольный месяц (для годовой таблицы) — по тем же фильтрам и единице.
  function monthMetrics(ym) {
    const macroRows = S.macroplan.filter(r => r.month === ym && macroRowMatches(r));
    const microRows = S.microplan.filter(m => m.date && m.date.startsWith(ym) && rowMatches(m));
    let agg = stF;
    if (!agg) {
      for (const s of STAGES_A) {
        if (macroRows.some(r => stageOfRow(r) === s) || microRows.some(m => stageOfRow(m) === s)) agg = s;
      }
    }
    const atAgg = r => !agg || stageOfRow(r) === agg;
    const macro = unit === 'min'
      ? Math.round(macroRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0))
      : stageKitQtyForRows(macroRows.filter(atAgg), gpSetAll);
    const mRows = unit === 'min' ? microRows : microRows.filter(atAgg);
    return { macro, plan: planOf(mRows), fact: factOf(mRows) };
  }

  // Итоги текущего месяца — их сверяет кнопка «Сверить с сервером» в серверном
  // режиме. Считаются здесь, а не отдельной функцией: фильтры вкладки живут
  // замыканиями, и второй расчёт рядом с этим неизбежно от него отстанет.
  _analyticsTotals = Object.assign({ month: curMonth, unit }, monthMetrics(curMonth));

  // ── Понедельные итоги + накопительные с начала месяца ──
  const weekRows = weeks.map((w, i) => {
    const wRows = metricRows.filter(m => { const d = +m.date.slice(8, 10); return d >= w.start && d <= w.end; });
    const cRows = metricRows.filter(m => +m.date.slice(8, 10) <= w.end);
    const wPlan = planOf(wRows), wFact = factOf(wRows);
    const cumPlan = planOf(cRows), cumFact = factOf(cRows);
    return {
      idx: i + 1, start: w.start, end: w.end,
      wPlan, wFact,
      wPct: wPlan > 0 ? wFact / wPlan * 100 : 0,
      cumPlan, cumFact,
      cumPct: cumPlan > 0 ? cumFact / cumPlan * 100 : 0,
      macroPct: macroPlanMonth > 0 ? cumFact / macroPlanMonth * 100 : 0,
    };
  });
  // Итоги месяца считаем по всем строкам сразу (а не суммой недель) — точные комплекты.
  const totPlan = planOf(metricRows), totFact = factOf(metricRows);
  const totPct = totPlan > 0 ? totFact / totPlan * 100 : 0;
  const totMacroPct = macroPlanMonth > 0 ? totFact / macroPlanMonth * 100 : 0;

  const pctColor = p => p >= 100 ? '#16a34a' : p >= 70 ? '#f59e0b' : '#ef4444';

  // ── Шапка с фильтрами ──
  let html = `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px">
    <div class="sec-title" style="margin:0">Аналитика — выполнение плана</div>
    <button class="btn btn-outline btn-sm" onclick="analyticsMonth=prevMonth(analyticsMonth);renderAnalytics()">◀</button>
    <b style="font-size:14px;min-width:130px;text-align:center;display:inline-block">${mlabel(curMonth)}</b>
    <button class="btn btn-outline btn-sm" onclick="analyticsMonth=nextMonth(analyticsMonth);renderAnalytics()">▶</button>
  </div>

  <div class="ctx-bar" style="margin-bottom:16px">
    <label>ОП
      <select onchange="analyticsOp=this.value;analyticsBrigade='';renderAnalytics()">
        <option value="">Все ОП</option>
        ${allOps.map(n => `<option value="${esc(n)}" ${n === opF ? 'selected' : ''}>${esc(n)}</option>`).join('')}
      </select>
    </label>
    <label>Передел
      <select onchange="analyticsStage=this.value;analyticsBrigade='';renderAnalytics()">
        <option value="">Все переделы</option>
        ${STAGES_A.map(s => `<option value="${s}" ${s === stF ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
    </label>
    <label>Бригада
      <select onchange="analyticsBrigade=this.value;renderAnalytics()" title="Фильтр по бригаде (графику) — для выбранного ОП и передела">
        <option value="">Все бригады</option>
        ${allBrigades.map(s => `<option value="${esc(s.id)}" ${String(s.id) === String(briF) ? 'selected' : ''}>${esc(s.name || ('Бригада ' + s.id))}${s.workshop ? ' (' + esc(s.workshop) + ')' : ''}</option>`).join('')}
      </select>
    </label>
    <label>Контракт
      <select onchange="analyticsContract=this.value;renderAnalytics()">
        <option value="">Все контракты</option>
        ${allContracts.map(n => `<option value="${esc(n)}" ${n === conF ? 'selected' : ''}>${esc(n)}</option>`).join('')}
      </select>
    </label>
    <label>Ассорт. группа
      <select onchange="analyticsAssortment=this.value;renderAnalytics()">
        <option value="">Все группы</option>
        ${allAssortments.map(n => `<option value="${esc(n)}" ${n === asgF ? 'selected' : ''}>${esc(n)}</option>`).join('')}
      </select>
    </label>
    <label>Артикул ГП
      <select onchange="analyticsArticle=this.value;renderAnalytics()">
        <option value="">Все артикулы</option>
        ${allArticles.map(n => `<option value="${esc(n)}" ${n === artF ? 'selected' : ''}>${esc(n)}</option>`).join('')}
      </select>
    </label>
    <label>Единица
      <span style="display:inline-flex;border:1px solid #d1d5db;border-radius:6px;overflow:hidden">
        <button type="button" onclick="analyticsUnit='qty';renderAnalytics()" style="border:none;padding:5px 12px;font-size:12px;cursor:pointer;background:${unit==='qty'?'#2563eb':'#fff'};color:${unit==='qty'?'#fff':'#334155'}">Штуки</button>
        <button type="button" onclick="analyticsUnit='min';renderAnalytics()" style="border:none;border-left:1px solid #d1d5db;padding:5px 12px;font-size:12px;cursor:pointer;background:${unit==='min'?'#2563eb':'#fff'};color:${unit==='min'?'#fff':'#334155'}">Минуты</button>
      </span>
    </label>
    <button class="ctx-bar-btn" onclick="analyticsOp='';analyticsContract='';analyticsStage='';analyticsArticle='';analyticsAssortment='';analyticsBrigade='';renderAnalytics()">Сбросить</button>
  </div>`;

  // ── Карточки-итоги за месяц ──
  const card = (title, value, sub, color = '#1e293b') =>
    `<div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px;min-width:150px;flex:1">
      <div style="font-size:11px;color:#64748b;font-weight:600;margin-bottom:4px">${title}</div>
      <div style="font-size:24px;font-weight:700;color:${color}">${value}</div>
      ${sub ? `<div style="font-size:11px;color:#94a3b8;margin-top:2px">${sub}</div>` : ''}
    </div>`;
  // ── Карточки «На дату» (накопительно с начала месяца до выбранной даты; по умолчанию — сегодня) ──
  const _todayStr = new Date().toISOString().slice(0, 10);
  const _dateStr = analyticsDate || _todayStr;
  const _rowsToday = metricRows.filter(m => (m.date || '') <= _dateStr);
  const planToday = planOf(_rowsToday), factToday = factOf(_rowsToday);
  const todayPct = planToday > 0 ? factToday / planToday * 100 : 0;
  const todayDelta = factToday - planToday;
  html += `<div class="sec-title" style="margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">На дату
    <input type="date" value="${_dateStr}" onchange="analyticsDate=this.value;renderAnalytics()" style="font-size:13px;padding:3px 6px;border:1px solid #cbd5e1;border-radius:6px">
    ${analyticsDate && analyticsDate !== _todayStr ? `<button class="btn btn-outline btn-sm" onclick="analyticsDate='';renderAnalytics()" title="Вернуть на сегодня">Сегодня</button>` : ''}
    <span style="font-weight:400;font-size:12px;color:#94a3b8">(накопительно с начала месяца, ${unitLabel})</span></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
    ${card('План к дате', planToday.toLocaleString('ru') + ' ' + unitLabel, 'микроплан до выбранной даты')}
    ${card('Факт к дате', factToday.toLocaleString('ru') + ' ' + unitLabel, 'выпущено до выбранной даты', pctColor(todayPct))}
    ${card('Выполнение к дате', planToday > 0 ? todayPct.toFixed(1) + '%' : '—', 'факт / план к дате', pctColor(todayPct))}
    ${card('Отставание / опережение', (todayDelta >= 0 ? '+' : '') + todayDelta.toLocaleString('ru') + ' ' + unitLabel, todayDelta >= 0 ? 'опережение графика' : 'отставание от графика', todayDelta >= 0 ? '#16a34a' : '#ef4444')}
  </div>

  <div class="sec-title" style="margin-top:4px">За месяц — ${mlabel(curMonth)} <span style="font-weight:400;font-size:12px;color:#94a3b8">(${unitLabel})</span></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
    ${card('Макроплан за месяц', macroPlanMonth.toLocaleString('ru') + ' ' + unitLabel, 'план из макроплана')}
    ${card('Факт за месяц', totFact.toLocaleString('ru') + ' ' + unitLabel, 'выпущено', pctColor(totMacroPct))}
    ${card('Выполнение от макроплана', macroPlanMonth > 0 ? totMacroPct.toFixed(1) + '%' : '—', 'факт / макроплан', pctColor(totMacroPct))}
    ${card('Микроплан за месяц', totPlan.toLocaleString('ru') + ' ' + unitLabel, 'план по микроплану')}
    ${card('Отклонение от макроплана', (totFact - macroPlanMonth).toLocaleString('ru') + ' ' + unitLabel, 'факт − макроплан', (totFact - macroPlanMonth) >= 0 ? '#16a34a' : '#ef4444')}
  </div>`;

  // ── Понедельная таблица ──
  html += `<div class="sec-title" style="margin-top:4px">По неделям — план / факт и накопительно с начала месяца <span style="font-weight:400;font-size:12px;color:#94a3b8">(${unitLabel})</span></div>
  <div class="table-wrap"><table><thead>
    <tr>
      <th rowspan="2" style="vertical-align:bottom">Неделя</th>
      <th rowspan="2" style="vertical-align:bottom">Период</th>
      <th colspan="3" style="text-align:center;border-left:1px solid #e2e8f0">За неделю</th>
      <th colspan="5" style="text-align:center;border-left:1px solid #e2e8f0">Накопительно с начала месяца</th>
    </tr>
    <tr>
      <th style="text-align:right;border-left:1px solid #e2e8f0">План</th>
      <th style="text-align:right">Факт</th>
      <th style="text-align:right">Вып.</th>
      <th style="text-align:right;border-left:1px solid #e2e8f0">План</th>
      <th style="text-align:right">Факт</th>
      <th style="text-align:right">Вып.</th>
      <th style="text-align:right;border-left:1px solid #e2e8f0">Макроплан</th>
      <th style="text-align:right" title="Факт накопительно / макроплан месяца">Вып. от макроплана</th>
    </tr>
  </thead><tbody>`;

  if (!weekRows.length) {
    html += `<tr><td colspan="10" class="empty">Нет данных за месяц</td></tr>`;
  }
  for (const w of weekRows) {
    const pbar = (pct) => `<div style="display:inline-flex;align-items:center;gap:5px;justify-content:flex-end">
      <div style="width:54px;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden">
        <div style="width:${Math.min(100, pct).toFixed(0)}%;height:100%;background:${pctColor(pct)};border-radius:3px"></div>
      </div>
      <span style="font-size:11px;min-width:42px;text-align:right">${pct.toFixed(0)}%</span>
    </div>`;
    html += `<tr>
      <td style="font-weight:600">Неделя ${w.idx}</td>
      <td style="white-space:nowrap;color:#64748b">${pad(w.start)}–${pad(w.end)} ${mlabel(curMonth).split(' ')[0]}</td>
      <td style="text-align:right;border-left:1px solid #e2e8f0">${w.wPlan.toLocaleString('ru')}</td>
      <td style="text-align:right;font-weight:600">${w.wFact.toLocaleString('ru')}</td>
      <td style="text-align:right">${w.wPlan > 0 ? pbar(w.wPct) : '<span style="color:#cbd5e1">—</span>'}</td>
      <td style="text-align:right;border-left:1px solid #e2e8f0">${w.cumPlan.toLocaleString('ru')}</td>
      <td style="text-align:right;font-weight:600">${w.cumFact.toLocaleString('ru')}</td>
      <td style="text-align:right">${w.cumPlan > 0 ? pbar(w.cumPct) : '<span style="color:#cbd5e1">—</span>'}</td>
      <td style="text-align:right;border-left:1px solid #e2e8f0">${macroPlanMonth.toLocaleString('ru')}</td>
      <td style="text-align:right">${macroPlanMonth > 0 ? pbar(w.macroPct) : '<span style="color:#cbd5e1">—</span>'}</td>
    </tr>`;
  }
  html += `</tbody><tfoot><tr style="background:#f8fafc;font-weight:700">
    <td colspan="2" style="text-align:right;padding:6px 8px;border-top:2px solid #e2e8f0">Итого за месяц:</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0;border-left:1px solid #e2e8f0">${totPlan.toLocaleString('ru')}</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0">${totFact.toLocaleString('ru')}</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0;color:${pctColor(totPct)}">${totPct.toFixed(0)}%</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0;border-left:1px solid #e2e8f0">${totPlan.toLocaleString('ru')}</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0">${totFact.toLocaleString('ru')}</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0;color:${pctColor(totPct)}">${totPct.toFixed(0)}%</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0;border-left:1px solid #e2e8f0">${macroPlanMonth.toLocaleString('ru')}</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0;color:${pctColor(totMacroPct)}">${macroPlanMonth > 0 ? totMacroPct.toFixed(0) + '%' : '—'}</td>
  </tr></tfoot></table></div>`;

  // ── Помесячно за год ──
  const _year = curMonth.slice(0, 4);
  const _yMonths = Array.from({ length: 12 }, (_, i) => `${_year}-${String(i + 1).padStart(2, '0')}`);
  const _yData = _yMonths.map(ym => ({ ym, ...monthMetrics(ym) }));
  // Накопительно с начала года
  let _cM = 0, _cP = 0, _cF = 0;
  for (const m of _yData) { _cM += m.macro; _cP += m.plan; _cF += m.fact; m.cMacro = _cM; m.cPlan = _cP; m.cFact = _cF; }
  const _yTot = { macro: _cM, plan: _cP, fact: _cF };
  const _yHasData = _yData.some(m => m.macro || m.plan || m.fact);
  const _num = v => v.toLocaleString('ru');
  html += `<div class="sec-title" style="margin-top:18px">Помесячно за год — ${_year} <span style="font-weight:400;font-size:12px;color:#94a3b8">(${unitLabel})</span></div>
  <div class="table-wrap"><table><thead>
    <tr>
      <th rowspan="2" style="vertical-align:bottom">Месяц</th>
      <th colspan="4" style="text-align:center;border-left:1px solid #e2e8f0">За месяц</th>
      <th colspan="4" style="text-align:center;border-left:1px solid #e2e8f0">Накопительно с начала года</th>
    </tr>
    <tr>
      <th style="text-align:right;border-left:1px solid #e2e8f0">Макроплан</th>
      <th style="text-align:right">Микроплан</th>
      <th style="text-align:right">Факт</th>
      <th style="text-align:right" title="Факт / Макроплан">Вып.</th>
      <th style="text-align:right;border-left:1px solid #e2e8f0">Макроплан</th>
      <th style="text-align:right">Микроплан</th>
      <th style="text-align:right">Факт</th>
      <th style="text-align:right" title="Факт накопительно / Макроплан накопительно">Вып.</th>
    </tr>
  </thead><tbody>`;
  if (!_yHasData) {
    html += `<tr><td colspan="9" class="empty">Нет данных за ${_year}</td></tr>`;
  } else {
    for (const m of _yData) {
      const pct = m.macro > 0 ? m.fact / m.macro * 100 : 0;
      const cPct = m.cMacro > 0 ? m.cFact / m.cMacro * 100 : 0;
      const isCur = m.ym === curMonth;
      const empty = !(m.macro || m.plan || m.fact);
      const g = empty ? 'color:#cbd5e1;' : '';
      html += `<tr style="${isCur ? 'background:#eff6ff;' : ''}cursor:pointer" onclick="analyticsMonth='${m.ym}';renderAnalytics()" title="Открыть месяц">
        <td style="font-weight:${isCur ? '700' : '600'}">${mlabel(m.ym)}</td>
        <td style="text-align:right;border-left:1px solid #e2e8f0;${g}">${_num(m.macro)}</td>
        <td style="text-align:right;${g}">${_num(m.plan)}</td>
        <td style="text-align:right;font-weight:600;${g}">${_num(m.fact)}</td>
        <td style="text-align:right;font-weight:700;color:${m.macro > 0 ? pctColor(pct) : '#cbd5e1'}">${m.macro > 0 ? pct.toFixed(0) + '%' : '—'}</td>
        <td style="text-align:right;border-left:1px solid #e2e8f0">${_num(m.cMacro)}</td>
        <td style="text-align:right">${_num(m.cPlan)}</td>
        <td style="text-align:right;font-weight:600">${_num(m.cFact)}</td>
        <td style="text-align:right;font-weight:700;color:${m.cMacro > 0 ? pctColor(cPct) : '#cbd5e1'}">${m.cMacro > 0 ? cPct.toFixed(0) + '%' : '—'}</td>
      </tr>`;
    }
  }
  const _yPct = _yTot.macro > 0 ? _yTot.fact / _yTot.macro * 100 : 0;
  html += `</tbody><tfoot><tr style="background:#f8fafc;font-weight:700">
    <td style="padding:6px 8px;border-top:2px solid #e2e8f0">Итого за год</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0;border-left:1px solid #e2e8f0">${_num(_yTot.macro)}</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0">${_num(_yTot.plan)}</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0">${_num(_yTot.fact)}</td>
    <td style="text-align:right;border-top:2px solid #e2e8f0;color:${_yTot.macro > 0 ? pctColor(_yPct) : '#cbd5e1'}">${_yTot.macro > 0 ? _yPct.toFixed(0) + '%' : '—'}</td>
    <td colspan="4" style="border-top:2px solid #e2e8f0"></td>
  </tr></tfoot></table></div>`;

  // ── Разбивка по переделам (если фильтр передела не задан) ──
  if (!stF) {
    const stageData = STAGES_A.map(st => {
      const rows = monthMicroAll.filter(m => stageOfRow(m) === st);
      // Штуки — комплекты (целые + min узлов); минуты — сумма трудоёмкости.
      const p = planOf(rows);
      const f = factOf(rows);
      return { st, p, f, pct: p > 0 ? f / p * 100 : 0 };
    }).filter(x => x.p > 0 || x.f > 0);
    if (stageData.length) {
      html += `<div class="sec-title" style="margin-top:18px">По переделам — ${mlabel(curMonth)}</div>
      <div class="table-wrap"><table><thead>
        <tr><th>Передел</th><th style="text-align:right">План</th><th style="text-align:right">Факт</th><th style="text-align:right">Выполнение</th></tr>
      </thead><tbody>`;
      for (const s of stageData) {
        html += `<tr>
          <td style="font-weight:600">${s.st}</td>
          <td style="text-align:right">${s.p.toLocaleString('ru')}</td>
          <td style="text-align:right;font-weight:600">${s.f.toLocaleString('ru')}</td>
          <td style="text-align:right;color:${pctColor(s.pct)};font-weight:700">${s.pct.toFixed(1)}%</td>
        </tr>`;
      }
      html += `</tbody></table></div>`;
    }
  }

  // ── План (изначальный, baseline) ↔ Факт за месяц ──
  {
    const byKey = {};
    const keyOf = (order, stage) => order + '|' + stage;
    const passConF = order => { if (!conF) return true; const o = S.orders.find(x => releaseOrderEq(x.number, order)); return o && o.contractNum === conF; };
    for (const b of (S.planBaseline || [])) {
      if (b.month !== curMonth) continue;
      if (opF && b.op !== opF) continue;
      if (stF && (b.stage || 'ШЦ') !== stF) continue;
      if (briF && String(b.scheduleId) !== String(briF)) continue;
      if (!passConF(b.releaseOrder)) continue;
      const k = keyOf(b.releaseOrder, b.stage || 'ШЦ');
      (byKey[k] ||= { order: b.releaseOrder, stage: b.stage || 'ШЦ', plan: 0, fact: 0 }).plan += +b.planRelease || 0;
    }
    for (const m of S.microplan) {
      if (!m.date || m.date.slice(0, 7) !== curMonth) continue;
      if (opF && m.op !== opF) continue;
      if (stF && (m.stage || 'ШЦ') !== stF) continue;
      if (briF && String(m.scheduleId) !== String(briF)) continue;
      const addFact = (order, fact) => {
        if (!order || order === '__extra__' || !(+fact)) return;
        if (!passConF(order)) return;
        const k = keyOf(order, m.stage || 'ШЦ');
        (byKey[k] ||= { order, stage: m.stage || 'ШЦ', plan: 0, fact: 0 }).fact += +fact || 0;
      };
      addFact(m.releaseOrder, m.factRelease);
      for (const s of (m.subOrders || [])) addFact(s.releaseOrder, s.factRelease);
    }
    const rowsBF = Object.values(byKey).sort((a, b) =>
      String(a.order).localeCompare(String(b.order), 'ru') || String(a.stage).localeCompare(String(b.stage)));
    const totPlan = rowsBF.reduce((s, r) => s + r.plan, 0);
    const totFact = rowsBF.reduce((s, r) => s + r.fact, 0);
    html += `<div class="sec-title" style="margin-top:18px">План (изначальный) ↔ Факт · ${esc(mlabel(curMonth))}</div>`;
    if (!rowsBF.length) {
      html += `<p style="padding:12px;color:#64748b;font-size:13px">Нет зафиксированного плана за этот месяц. Нажмите «Сформировать микроплан» в графике — изначальный план зафиксируется автоматически.</p>`;
    } else {
      const totPct = totPlan > 0 ? totFact / totPlan * 100 : 0;
      html += `<div style="display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px">
        <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 14px;font-size:13px">Изнач. план: <b>${totPlan.toLocaleString('ru')}</b> шт</div>
        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 14px;font-size:13px">Факт: <b>${totFact.toLocaleString('ru')}</b> шт</div>
        <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px 14px;font-size:13px">Отклонение: <b>${(totFact - totPlan).toLocaleString('ru')}</b> шт · <b style="color:${pctColor(totPct)}">${totPct.toFixed(1)}%</b></div>
      </div>
      <div class="table-wrap"><table><thead><tr>
        <th>Заказ</th><th>Передел</th><th style="text-align:right">План изнач.</th><th style="text-align:right">Факт</th><th style="text-align:right">Δ</th><th style="width:160px">Выполнение</th>
      </tr></thead><tbody>`;
      for (const r of rowsBF) {
        const pct = r.plan > 0 ? r.fact / r.plan * 100 : (r.fact > 0 ? 100 : 0);
        const d = r.fact - r.plan;
        html += `<tr>
          <td class="ro">${esc(r.order)}</td>
          <td class="ro">${esc(r.stage)}</td>
          <td class="ro" style="text-align:right">${r.plan.toLocaleString('ru')}</td>
          <td class="ro" style="text-align:right;font-weight:600">${r.fact.toLocaleString('ru')}</td>
          <td class="ro" style="text-align:right;color:${d < 0 ? '#dc2626' : d > 0 ? '#16a34a' : '#64748b'}">${d > 0 ? '+' : ''}${d.toLocaleString('ru')}</td>
          <td>${pctBar(pct)}</td>
        </tr>`;
      }
      html += `<tr style="background:#f8fafc;font-weight:700">
        <td colspan="2" style="text-align:right">Итого:</td>
        <td style="text-align:right">${totPlan.toLocaleString('ru')}</td>
        <td style="text-align:right">${totFact.toLocaleString('ru')}</td>
        <td style="text-align:right">${(totFact - totPlan).toLocaleString('ru')}</td>
        <td>${pctBar(totPct)}</td>
      </tr>`;
      html += `</tbody></table></div>`;
    }
  }

  el.innerHTML = html;
}

// СПРАВОЧНИКИ (исправлена номенклатура)
// ================================================================
/** Время доставки между двумя ОП (календарных дней). 0 если не задано. */
function deliveryDaysFor(fromOp, toOp) {
  const row = (S.deliveryMatrix || []).find(r => r.fromOp === fromOp && r.toOp === toOp);
  if (row) return +row.days || 0;            // явная запись матрицы переопределяет
  if (fromOp && toOp && fromOp === toOp) return 1; // в пределах одного ОП — передача 1 день
  return 0;
}

/** Добавить дату N календарных дней к строке YYYY-MM-DD. */
function addCalDays(dateStr, n) {
  if (!dateStr || !n) return dateStr;
  const d = new Date(dateStr + 'T00:00:00'); // локальное время, не UTC
  d.setDate(d.getDate() + n);
  return localDateStr(d);
}

/** Строка YYYY-MM-DD по локальному времени (без UTC-сдвига). */
function localDateStr(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

/** Сдвинуть дату на предыдущий рабочий день, если попадает на сб/вс. */
function prevWorkday(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const dow = d.getDay();
  if (dow === 0) d.setDate(d.getDate() - 2); // вс → пт
  if (dow === 6) d.setDate(d.getDate() - 1); // сб → пт
  return localDateStr(d);
}

/**
 * Срок отгрузки = срок поставки − дни транспортировки от ОП упаковки до базы.
 * Если результат — сб/вс, сдвигаем на предыдущий рабочий день (пт).
 * Возвращает { shipmentDate, packDeadline, fromOp, days }.
 */
function calcArrivalDate(co) {
  if (!co.deliveryDate) return { shipmentDate: '', packDeadline: '', fromOp: '', days: 0 };
  // Ищем ОП упаковки (этап 'У') в микроплане для производственных заказов этого ЗК
  const prodOrders = (S.orders || []).filter(o =>
    o.customerOrderId === co.id ||
    (o.contractId === co.contractId && o.articleGp === co.articleGp)
  );
  const orderNums = new Set(prodOrders.map(o => String(o.number || '').trim()));
  const packRow = (S.microplan || []).find(m =>
    m.stage === 'У' && orderNums.has(String(m.releaseOrder || '').trim())
  );
  const fromOp = packRow ? (packRow.op || '') : (prodOrders[0] ? (prodOrders[0].op || '') : '');
  const toOp = co.base || '';
  const days = deliveryDaysFor(fromOp, toOp);
  // Срок отгрузки = дата поставки − дни транзита → предыдущий рабочий день
  const rawShipment = addCalDays(co.deliveryDate, -days);
  const shipmentDate = prevWorkday(rawShipment || co.deliveryDate);
  // Упаковка должна завершиться минимум за 1 рабочий день до отгрузки
  const packDeadline = prevWorkday(addCalDays(shipmentDate, -1));
  return { shipmentDate, packDeadline, fromOp, days };
}

/**
 * Проверка даты строки микроплана с учётом матрицы доставок.
 * Возвращает { ok, minDate, prevStage, prevOp, days } или { ok: true }.
 */
function checkDeliveryDate(row) {
  if (!row.date || !row.releaseOrder) return { ok: true };
  const orderNum = row.releaseOrder;
  const ord = orderNum === '__extra__' ? null : S.orders.find(o => releaseOrderEq(o.number, orderNum));
  const articleGp = ord?.articleGp || (() => {
    const ai = microRowArticleItems(row)[0] || row.articleItem || '';
    return S.nomenclature.find(n => n.articleGp === ai || allRoutesOf(n).some(rt => rt.articleItem === ai))?.articleGp || null;
  })();
  const prevStage = prevStageInRoute(articleGp, row.stage || 'ШЦ');
  if (!prevStage) return { ok: true };
  // Ищем наиболее раннюю дату предыдущего передела.
  // Для __extra__: ищем строки того же ГП (любой заказ или __extra__ с тем же ГП).
  let prevDate = null;
  let prevOp = null;
  for (const m of S.microplan) {
    if (m.id === row.id) continue;
    if (m.stage !== prevStage) continue;
    if (orderNum === '__extra__') {
      // Доп. объём сверяется только с другими __extra__ строками того же ГП
      if (m.releaseOrder !== '__extra__') continue;
      const mAi = microRowArticleItems(m)[0] || m.articleItem || '';
      const mGp = S.nomenclature.find(n => n.articleGp === mAi || allRoutesOf(n).some(rt => rt.articleItem === mAi))?.articleGp || mAi;
      if (mGp !== articleGp) continue;
    } else {
      if (!releaseOrderEq(m.releaseOrder, orderNum)) continue;
    }
    if (!m.date) continue;
    if (prevDate === null || m.date < prevDate) { prevDate = m.date; prevOp = m.op; }
  }
  if (!prevDate || !prevOp) return { ok: true };
  const days = deliveryDaysFor(prevOp, row.op);
  if (days <= 0) return { ok: true };
  const minDate = addCalDays(prevDate, days);
  if (row.date < minDate) return { ok: false, minDate, prevStage, prevOp, days };
  return { ok: true };
}

function addDeliveryMatrixRow() {
  const fromOp = document.getElementById('dm-from').value;
  const toOp   = document.getElementById('dm-to').value;
  const days   = parseInt(document.getElementById('dm-days').value, 10);
  if (!fromOp || !toOp) { _alert('Выберите оба ОП.'); return; }
  if (isNaN(days) || days < 0) { _alert('Укажите дни (≥ 0).'); return; }
  if (!Array.isArray(S.deliveryMatrix)) S.deliveryMatrix = [];
  const existing = S.deliveryMatrix.find(r => r.fromOp === fromOp && r.toOp === toOp);
  // renderRefs() напрямую, без renderTab — чистим черновик, suppress не нужен.
  clearAddFormDraft(['dm-from','dm-to','dm-days']);
  if (SRV.on) {
    // Пара ОП уникальна: повтор — это правка дней, а не вторая строка.
    if (existing) { existing.days = days; srvUpdate('deliveryMatrix', existing); }
    else srvCreate('deliveryMatrix', { id: nid(), fromOp, toOp, days });
    return;
  }
  if (existing) { existing.days = days; }
  else S.deliveryMatrix.push({ id: nid(), fromOp, toOp, days });
  save(); renderRefs();
}

async function delDeliveryMatrixRow(id) {
  if (SRV.on) { await srvDelete('deliveryMatrix', id); return; }
  S.deliveryMatrix = (S.deliveryMatrix || []).filter(r => r.id !== id);
  save(); renderRefs();
}

function updDeliveryMatrixDays(id, val) {
  const r = (S.deliveryMatrix || []).find(x => x.id === id);
  if (!r) return;
  r.days = Math.max(0, parseInt(val, 10) || 0);
  if (SRV.on) { srvUpdate('deliveryMatrix', r); return; }
  save();
}

function renderDeliveryMatrix() {
  const el = document.getElementById('refs-body');
  if (!el) return;
  const allOps   = [...new Set(S.ops.map(o => o.name))].sort((a,b) => a.localeCompare(b,'ru'));
  const allBases = (S.bases || []).map(b => b.name).sort((a,b) => a.localeCompare(b,'ru'));
  // «Откуда» — только ОП (доставка всегда с ОП); «Куда» — ОП или База.
  const fromOpts = allOps.length ? `<optgroup label="ОП">${allOps.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</optgroup>` : '';
  const toOpts   = [
    allOps.length   ? `<optgroup label="ОП">${allOps.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</optgroup>` : '',
    allBases.length ? `<optgroup label="Базы">${allBases.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}</optgroup>` : ''
  ].join('');
  const rows = S.deliveryMatrix || [];
  let tbody = rows.length
    ? rows.map(r => `<tr>
        <td class="ro">${esc(r.fromOp)}</td>
        <td class="ro">${esc(r.toOp)}</td>
        <td><input type="number" min="0" value="${r.days}" style="width:70px" onblur="updDeliveryMatrixDays(${r.id},this.value)" onkeydown="if(event.key==='Enter')this.blur()"> дн.</td>
        <td><button class="btn btn-danger btn-sm" onclick="delDeliveryMatrixRow(${r.id})">✕</button></td>
      </tr>`).join('')
    : `<tr><td colspan="4" class="empty">Нет записей.</td></tr>`;
  el.innerHTML = `
    <div class="add-form" style="margin-bottom:12px">
      <label>Откуда<select class="w160" id="dm-from"><option value="">— выбрать —</option>${fromOpts}</select></label>
      <label>Куда<select class="w160" id="dm-to"><option value="">— выбрать —</option>${toOpts}</select></label>
      <label>Дней<input type="number" min="0" class="w80" id="dm-days" value="1"></label>
      <button class="btn btn-primary" onclick="addDeliveryMatrixRow()">+ Добавить</button>
    </div>
    <div class="table-wrap"><table><thead>
      <tr><th>Откуда</th><th>Куда</th><th>Дней доставки</th><th></th></tr>
    </thead><tbody>${tbody}</tbody></table></div>`;
}

function renderRefs() {
  const el = document.getElementById('tab-refs');
  // Снимаем черновик формы «Добавить» номенклатуру ДО затирания DOM ниже.
  _nfAddDraftSnapshot = refsTab === 'nom' ? captureNfAddDraft() : null;
  el.innerHTML = `<div class="sub-tabs">
    <button class="sub-tab ${refsTab==='nom'?'active':''}"      onclick="refsTab='nom';renderRefs()">Номенклатура</button>
    <button class="sub-tab ${refsTab==='ops'?'active':''}"      onclick="refsTab='ops';renderRefs()">ОП / Цеха</button>
    <button class="sub-tab ${refsTab==='bases'?'active':''}"    onclick="refsTab='bases';renderRefs()">Базы</button>
    <button class="sub-tab ${refsTab==='delivery'?'active':''}" onclick="refsTab='delivery';renderRefs()">Матрица доставок</button>
  </div>${srvBannerHtml(refsTab)}<div id="refs-body"></div>`;
  if (refsTab==='nom')      renderNom();
  else if (refsTab==='ops') renderOps();
  else if (refsTab==='bases') renderBases();

}

/** Что каждая вкладка читает с сервера.
 *
 *  Перечислены не только «свои» коллекции: макроплан без контрактов и заказов
 *  не построишь, микроплан без бригад и норм — тоже. Кнопка «Обновить» тянет весь
 *  набор вкладки, иначе после чужой правки половина экрана осталась бы старой. */
const SRV_TAB_KINDS = {
  refs:       ['nomenclature', 'ops', 'bases', 'deliveryMatrix'],
  contracts:  ['contracts', 'orders', 'orderLinks', 'nomenclature'],
  manualFrv:  ['manualFrv', 'ops'],
  macroplan:  ['macroplan', 'macroEff', 'timeCosts', 'contracts', 'orders',
               'nomenclature', 'ops'],
  orders:     ['orders', 'contracts', 'orderLinks', 'nomenclature', 'ops'],
  schedule:   ['schedules', 'scheduleMonthOverrides', 'calOverrides', 'holidays', 'ops'],
  microplan:  ['microplan', 'schedules', 'calOverrides', 'planBaseline',
               'orders', 'macroplan', 'timeCosts', 'nomenclature', 'ops'],
  gantt:      ['microplan', 'orders', 'nomenclature', 'ops'],
  analytics:  ['microplan', 'macroplan', 'planBaseline', 'orders', 'contracts',
               'schedules', 'nomenclature', 'ops'],
};

/** Короткие названия коллекций — для подписи «в базе: …» в полосе режима. */
const SRV_KIND_LABEL = {
  nomenclature: 'номенклатура', ops: 'ОП', bases: 'базы',
  deliveryMatrix: 'матрица доставок', contracts: 'контракты',
  orders: 'заказы', orderLinks: 'связи заказов', macroplan: 'макроплан',
  macroEff: 'эффективность', microplan: 'микроплан', schedules: 'бригады',
  scheduleMonthOverrides: 'правки месяцев', calOverrides: 'правки дней',
  manualFrv: 'ФРВ', holidays: 'выходные', planBaseline: 'изначальный план',
  timeCosts: 'нормы заказов',
};

/** Человеческое название вкладки для полосы режима. */
const SRV_TAB_LABEL = {
  refs: 'справочники', contracts: 'контракты', manualFrv: 'ФРВ',
  macroplan: 'макроплан', orders: 'заказы на производство', schedule: 'графики бригад',
  microplan: 'микроплан', gantt: 'диаграмма', analytics: 'аналитика',
  nom: 'номенклатура', ops: 'ОП и цеха', bases: 'базы', delivery: 'матрица доставок',
};

/** Полоса серверного режима. Одна на все вкладки: переключатель общий, потому что
 *  переведены все — держать половину данных на сервере, а половину локально нельзя. */
function srvBannerHtml(kind) {
  const on = SRV.on;
  const tab = SRV_TAB_KINDS[kind] ? kind : activeTab;
  const what = SRV_TAB_LABEL[kind] || SRV_TAB_LABEL[tab] || 'данные';
  const u = SRV.user;
  const role = u
    ? (u.is_superuser ? 'администратор'
       : ((u.roles && u.roles.length) ? u.roles.join(', ') : 'только просмотр'))
    : '';
  // Площадки показываем ПО ЧТЕНИЮ: именно они решают, что вообще видно на
  // вкладках. Раньше выводились только те, где разрешена правка, и человек с
  // доступом к одной площадке не понимал, почему у него «пропали» данные —
  // а они просто не его.
  const read = (u && u.ops_read) || [];
  const who = u
    ? `${esc(u.username)} · ${esc(role)}` + (u.all_ops
        ? ' · все площадки'
        : (read.length ? ` · площадки: ${read.map(esc).join(', ')}` : ' · площадок не выдано'))
    : '';
  // Раздел, который правится с этой вкладки: у аналитики и диаграммы его нет.
  const section = SRV_TAB_SECTION[tab];
  const locked = on && section && !srvCanEdit(section);
  return `<div data-srv-banner style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      margin:10px 0 4px;padding:8px 12px;border-radius:8px;font-size:13px;
      background:${on ? '#dcfce7' : '#f1f5f9'};border:1px solid ${on ? '#16a34a' : '#e2e8f0'}">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0">
      <input type="checkbox" ${on ? 'checked' : ''} onchange="toggleServerMode(this.checked)">
      <b>Серверный режим</b>
    </label>
    <span style="color:#475569">${on
      ? `${what}: читаются и пишутся на сервере` + (who ? ` · ${who}` : '')
      : `${what}: работают локально, как раньше`}</span>
    ${locked ? `<span style="padding:2px 8px;border-radius:6px;background:#fef3c7;
        border:1px solid #f59e0b;color:#92400e"><b>Только просмотр</b> —
        раздел «${esc(srvSectionTitle(section))}» вам не открыт</span>` : ''}
    ${on ? `<span style="color:#475569">· в базе: ${esc(srvTabCounts(tab))}</span>` : ''}
    ${on ? `<button class="btn btn-outline btn-sm" onclick="srvReloadTab('${tab}')">Обновить с сервера</button>` : ''}
    ${on && tab === 'analytics'
      ? `<button class="btn btn-outline btn-sm" onclick="srvCheckAnalytics()">Сверить с расчётом сервера</button>` : ''}
    ${on ? `<button class="btn btn-outline btn-sm" onclick="srvChangesDialog('${tab}')">Кто менял</button>` : ''}
    ${on && u && u.is_superuser
      ? `<button class="btn btn-outline btn-sm" onclick="srvUploadDialog()">Залить файл</button>` : ''}
    ${on && u && u.is_superuser
      ? `<button class="btn btn-outline btn-sm" onclick="srvUsersDialog()">Пользователи</button>` : ''}
    ${on ? `<button class="btn btn-outline btn-sm" onclick="srvLogout()">Выйти</button>` : ''}
  </div>`;
}

/** Сколько всего записей сейчас в локальном состоянии — по коллекциям, которые
 *  переведены на сервер. Нужно, чтобы предупредить о замещении при включении
 *  режима: считать «есть ли что терять» на глаз нельзя. */
function srvLocalRecordCount() {
  let n = 0;
  for (const kind in SRV_ENTITIES) {
    const coll = S[SRV_ENTITIES[kind].coll];
    if (Array.isArray(coll)) n += coll.length;
  }
  return n;
}

/** Сколько записей вкладки пришло с сервера.
 *
 *  В серверном режиме `S` — это и есть данные базы, поэтому считаем прямо по нему.
 *  Без такой подписи процесс невидим: человек грузит файл в браузер, видит
 *  справочники, жмёт «Обновить с сервера» — и они пропадают, потому что в базе их
 *  никогда и не было. Теперь видно сразу, что там ноль. */
function srvTabCounts(tab) {
  const kinds = SRV_TAB_KINDS[tab] || SRV_TAB_KINDS[activeTab] || [];
  const parts = [];
  for (const kind of kinds) {
    const e = SRV_ENTITIES[kind];
    if (!e || !e.coll) continue;
    const coll = S[e.coll];
    if (!Array.isArray(coll)) continue;
    parts.push(`${SRV_KIND_LABEL[kind] || kind} ${coll.length}`);
    if (parts.length >= 4) break;          // полоса не должна разрастаться
  }
  return parts.length ? parts.join(', ') : 'нет данных';
}

/** Перечитать с сервера всё, что нужно вкладке. */
async function srvReloadTab(tab) {
  for (const kind of (SRV_TAB_KINDS[tab] || SRV_TAB_KINDS[activeTab] || [])) await srvLoad(kind);
  recalcNextId();
  renderActive();
}

/** Обратная совместимость: кнопка справочников звалась так. */
function srvReloadRefs() { return srvReloadTab('refs'); }

// ──────────────────── Заливка выгрузки на сервер (администратор) ─────────────
//
// Через меню «Файл» в серверном режиме загружать нельзя: файл заменил бы данные
// только в браузере и разошёлся бы с базой. Здесь — другой путь: файл уходит НА
// СЕРВЕР, и база решает, что с ним делать.
//
// Два режима, и разница между ними дорогая:
//   • слияние — совпадающие записи обновляются, новые добавляются. Так несколько
//     выгрузок с разных компьютеров собираются в одну базу;
//   • замещение — всё прежнее удаляется. Нужно редко (перенос с нуля).
//
// Дубли ищутся по деловому ключу (номер контракта, номер заказа, дата+ОП+передел+
// бригада+заказ+артикулы для смены), а НЕ по внутреннему id: счётчик id у каждого
// браузера свой, и слияние по нему смешало бы разные записи.

async function srvUploadDialog(preselected) {
  if (!SRV.on) { _alert('Заливка на сервер работает только в серверном режиме.'); return; }
  if (!SRV.user || !SRV.user.is_superuser) { _alert('Доступно только администратору.'); return; }

  const overlay = document.createElement('div');
  overlay.className = 'dlg-overlay';
  const box = document.createElement('div');
  box.className = 'dlg-box';
  box.style.maxWidth = '620px';
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const close = () => { overlay.parentNode && document.body.removeChild(overlay); };

  box.innerHTML = `
    <div class="dlg-msg">
      <b>Залить выгрузку на сервер</b>
      <div style="font-size:12px;color:#64748b;margin-top:6px">
        Файл, полученный через меню «Файл» → «Экспорт» на любом компьютере.
      </div>
    </div>
    <div style="margin:12px 0">
      <input type="file" id="_upFile" accept=".json,application/json"
             style="display:block;margin-bottom:14px">
      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;cursor:pointer">
        <input type="radio" name="_upMode" value="merge" checked style="margin-top:3px">
        <span><b>Слить с базой</b><br>
          <span style="font-size:12px;color:#64748b">Совпадающие записи обновятся,
            новые добавятся. Ничего не пропадёт — так собирают данные с нескольких
            компьютеров.</span></span>
      </label>
      <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
        <input type="radio" name="_upMode" value="replace" style="margin-top:3px">
        <span><b>Заменить всё</b><br>
          <span style="font-size:12px;color:#b45309">Прежние данные будут удалены
            целиком. Нужно только при переносе с нуля.</span></span>
      </label>
    </div>
    <div id="_upResult" style="font-size:12px;white-space:pre-wrap;max-height:34vh;
         overflow:auto;color:#334155"></div>
    <div class="dlg-btns">
      <button class="btn btn-outline" id="_upCancel">Отмена</button>
      <button class="btn btn-primary" id="_upGo">Залить</button>
    </div>`;

  box.querySelector('#_upCancel').onclick = close;
  box.querySelector('#_upGo').onclick = () => srvUploadRun(box, close, preselected);

  // Файл пришёл из кнопки «Загрузить» — показываем, что именно будет залито:
  // выбирать его второй раз человеку незачем.
  if (preselected) {
    const note = document.createElement('div');
    note.style.cssText = 'font-size:12px;color:#334155;margin:-6px 0 12px';
    note.textContent = 'Выбран файл: ' + preselected.name;
    const input = box.querySelector('#_upFile');
    if (input) { input.style.display = 'none'; input.parentNode.insertBefore(note, input); }
  }
}

async function srvUploadRun(box, close, preselected) {
  const input = box.querySelector('#_upFile');
  const file = preselected || (input && input.files && input.files[0]);
  if (!file) { _alert('Выберите файл выгрузки.'); return; }
  const merge = box.querySelector('input[name="_upMode"]:checked').value === 'merge';

  if (!merge && !await _confirm(
      'Заменить ВСЕ данные на сервере содержимым файла?\n\n' +
      'Всё, что есть в базе сейчас, будет удалено. Если нужно просто добавить ' +
      'данные — выберите «Слить с базой».')) return;

  const out = box.querySelector('#_upResult');
  const go = box.querySelector('#_upGo');
  go.disabled = true;
  out.textContent = 'Читаю файл…';

  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (err) {
    out.textContent = 'Файл не читается: ' + err.message;
    go.disabled = false;
    return;
  }
  // Частичная выгрузка (например, одни справочники) годится для СЛИЯНИЯ: чего в
  // файле нет, того слияние не трогает. Для замещения не годится — стёрло бы всё
  // остальное, и человек узнал бы об этом уже после.
  const known = Object.keys(SRV_ENTITIES)
    .map(k => SRV_ENTITIES[k].coll)
    .filter(c => c && data && data[c] !== undefined);
  if (!known.length) {
    out.textContent = 'Это не похоже на выгрузку «Плана» — нет ни одной известной ' +
                      'коллекции данных.';
    go.disabled = false;
    return;
  }
  if (!merge && !Array.isArray(data.microplan)) {
    out.textContent = 'Это частичная выгрузка (нет микроплана). Замещение стёрло бы ' +
                      'остальные данные — выберите «Слить с базой».';
    go.disabled = false;
    return;
  }
  out.textContent = 'В файле: ' + known.map(c => `${c} ${(data[c] || []).length}`)
                                       .slice(0, 6).join(', ');

  out.textContent += '\nОтправляю на сервер… Большой файл обрабатывается до минуты.';
  try {
    const resp = await SRV.post('import' + (merge ? '?merge=1' : ''), data);
    out.textContent = (resp && resp.report) || (resp && resp.detail) || 'Готово.';
  } catch (err) {
    out.textContent = 'Не удалось: ' + srvErrText(err);
    go.disabled = false;
    return;
  }

  // Перечитываем всё: база изменилась, и держать на экране прежний срез нельзя —
  // первая же правка ушла бы поверх чужих данных.
  out.textContent += '\n\nОбновляю данные на экране…';
  for (const kind of SRV_LOAD_ORDER) await srvLoad(kind);
  recalcNextId();
  renderActive();
  go.textContent = 'Готово';
  out.textContent += '\nГотово.';
}

// ───────────────────────────── Журнал изменений ──────────────────────────────
//
// Отвечает на вопрос «кто поставил этот план». Сервер хранит РАЗНИЦУ (что было и
// что стало), а не копию записи, поэтому список читается глазами.
//
// Своей копии журнала приложение не держит и в `S` его не кладёт: история —
// это то, что уже произошло на сервере, и вторая её версия могла бы разойтись
// с первой.

/** Сущности, по которым показываем историю вкладки. */
function srvChangeEntities(tab) {
  const kinds = SRV_TAB_KINDS[tab] || SRV_TAB_KINDS[activeTab] || [];
  const out = [];
  for (const kind of kinds) {
    const e = SRV_ENTITIES[kind];
    if (!e) continue;
    const prefix = String(e.url || '').replace(/\/.*$/, '');
    if (prefix && !out.includes(prefix)) out.push(prefix);
  }
  return out;
}

const SRV_ACTION_LABEL = {
  create: 'создал', update: 'изменил', delete: 'удалил', recalc: 'пересчитал',
};

    </div>
    <div style="max-height:62vh;overflow:auto;margin:8px 0">
      <table class="tbl" style="width:100%;font-size:12px">
        <thead><tr>
          <th style="text-align:left">Когда</th>
          <th style="text-align:left">Кто</th>

function srvChangeRowHtml(r) {
  const when = String(r.at || '').replace('T', ' ').slice(0, 16);
  const what = `${esc(r.entity || '')}${r.src_id != null ? ' №' + r.src_id : ''}` +
               (r.op_name ? ` <span style="color:#64748b">· ${esc(r.op_name)}</span>` : '');
  const diff = r.note
    ? esc(r.note)
    : Object.keys(r.changes || {}).map(f => {
        const pair = r.changes[f] || [];
        return `<div><b>${esc(f)}</b>: ${esc(srvChangeVal(pair[0]))} → ` +
               `${esc(srvChangeVal(pair[1]))}</div>`;
      }).join('') || '<span style="color:#64748b">—</span>';
  return `<tr>
    <td style="white-space:nowrap;vertical-align:top">${esc(when)}</td>
    <td style="vertical-align:top">${esc(r.username || '—')}</td>
    <td style="vertical-align:top">${SRV_ACTION_LABEL[r.action] || esc(r.action)}<br>${what}</td>
    <td style="vertical-align:top">${diff}</td>
  </tr>`;
}

/** Пустое значение показываем словом: иначе строка выглядит как «→ » и непонятна. */
function srvChangeVal(v) {
  if (v === null || v === undefined || v === '') return '(пусто)';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}

function srvUserRowHtml(u, roleNames) {
  const roles = u.roles || [];
  const checks = roleNames.map(name => `
    <label style="display:block;white-space:nowrap">
      <input type="checkbox" data-user="${u.id}" data-role="${esc(name)}"
             ${roles.includes(name) ? 'checked' : ''}> ${esc(name)}
    </label>`).join('');
  const ops = {};
  (u.ops || []).forEach(a => { ops[a.op_name] = a.can_edit ? 'edit' : 'read'; });
  const opRows = srvAllOpNames().map(name => `
    <div style="display:flex;gap:6px;align-items:center;white-space:nowrap">
      <select data-user="${u.id}" data-op="${esc(name)}" style="font-size:11px;padding:2px">
        <option value="" ${!ops[name] ? 'selected' : ''}>—</option>
        <option value="read" ${ops[name] === 'read' ? 'selected' : ''}>смотрит</option>
        <option value="edit" ${ops[name] === 'edit' ? 'selected' : ''}>правит</option>
      </select>
      <span>${esc(name)}</span>
    </div>`).join('');
  // Пустой набор площадок означает «все» — это же правило действует в расчёте.
  // Подпись стоит ВСЕГДА, а не только когда набор уже пуст: администратор,
  // снимающий последнюю галочку, должен видеть, что тем самым ОТКРЫВАЕТ всё,
  // а не закрывает.
  const allOps = '<div style="font-size:11px;color:#16a34a;margin-top:2px">' +
    'ни одной не отмечено = <b>все площадки</b></div>';
  return `<tr data-userrow="${u.id}">
    <td style="vertical-align:top"><b>${esc(u.username)}</b></td>
    <td style="vertical-align:top">${u.is_superuser
      ? '<span style="color:#64748b">администратор правит всё</span>' : checks}</td>
    <td style="vertical-align:top">${u.is_superuser
      ? '<span style="color:#64748b">все площадки</span>'
      : `<div style="max-height:110px;overflow:auto">${opRows}</div>${allOps}`}</td>
    <td style="text-align:center;vertical-align:top">
      <input type="checkbox" data-user="${u.id}" data-admin="1" ${u.is_superuser ? 'checked' : ''}></td>
    <td style="text-align:center;vertical-align:top">
      <input type="checkbox" data-user="${u.id}" data-active="1" ${u.is_active ? 'checked' : ''}></td>
    <td style="vertical-align:top;white-space:nowrap">
      <button class="btn btn-primary btn-sm" onclick="srvUserSave(${u.id})">Сохранить</button>
      <button class="btn btn-outline btn-sm" onclick="srvUserPassword(${u.id})">Пароль</button>
      <button class="btn btn-outline btn-sm" onclick="srvUserDelete(${u.id})">Удалить</button>
    </td>
  </tr>`;
}

/** Собрать правки строки и отправить. Список площадок уходит целиком: снятый
 *  доступ должен исчезнуть, а не остаться от прошлого набора. */
async function srvUserSave(id) {
  const box = _srvUsersBox;
  if (!box) return;
  const roles = [...box.querySelectorAll(`input[data-user="${id}"][data-role]`)]
    .filter(el => el.checked).map(el => el.getAttribute('data-role'));
  // Список площадок строится из справочника ОП, загруженного в браузере. Если он
  // пуст (не успел загрузиться, или у самого администратора урезан доступ), то
  // отправить «ни одной отмеченной» значит СТЕРЕТЬ человеку все выданные
  // площадки — молча и не тем действием, которое затевалось. В таком случае
  // ключ не отправляем вовсе: сервер тогда доступы не трогает.
  const known = srvAllOpNames();
  const ops = known.length
    ? [...box.querySelectorAll(`select[data-user="${id}"][data-op]`)]
        .filter(el => el.value)
        .map(el => ({ op_name: el.getAttribute('data-op'), can_edit: el.value === 'edit' }))
    : null;
  const admin = box.querySelector(`input[data-user="${id}"][data-admin]`);
  const active = box.querySelector(`input[data-user="${id}"][data-active]`);

  const body = {
    roles,
    is_superuser: !!(admin && admin.checked),
    is_active: !!(active && active.checked),
  };
  if (ops !== null) body.ops = ops;

  try {
    await SRV.patch('users/' + id + '/', body);
    if (ops === null) {
      _alert('Справочник ОП не загружен, поэтому площадки оставлены без изменений.\n' +
             'Роли и признаки сохранены.');
    }
  } catch (e) {
    _alert('Не удалось сохранить:\n' + srvErrText(e));
  }
  // Себе права могли измениться — перечитываем, иначе интерфейс остался бы
  // с прежним набором разделов до перезагрузки страницы.
  await SRV.whoami();
  await srvUsersReload(box, box._close);
  renderActive();
}

async function srvUserCreate() {
  const box = _srvUsersBox;
  if (!box) return;
  const login = (box.querySelector('#_nuLogin').value || '').trim();
  const pass = box.querySelector('#_nuPass').value || '';
  if (!login || !pass) { _alert('Нужны логин и пароль.'); return; }
  try {
    await SRV.post('users/', { username: login, password: pass });
  } catch (e) {
    _alert('Не удалось создать пользователя:\n' + srvErrText(e));
    return;
  }
  await srvUsersReload(box, box._close);
}

async function srvUserPassword(id) {
  const u = _srvUsers.find(x => x.id === id);
  const pass = prompt('Новый пароль для «' + (u ? u.username : id) + '»:');
  if (!pass) return;
  try {
    await SRV.patch('users/' + id + '/', { password: pass });
    _alert('Пароль изменён.');
  } catch (e) {
    _alert('Не удалось сменить пароль:\n' + srvErrText(e));
  }
}

async function srvUserDelete(id) {
  const u = _srvUsers.find(x => x.id === id);
  if (!await _confirm('Удалить пользователя «' + (u ? u.username : id) + '»?')) return;
  try {
    await SRV.del('users/' + id + '/');
  } catch (e) {
    _alert('Не удалось удалить:\n' + srvErrText(e));
  }
  await srvUsersReload(_srvUsersBox, _srvUsersBox._close);
}

/**
 * Сверить итоги аналитики с расчётом сервера.
 *
 * Вкладка считается на клиенте — по данным, загруженным с сервера. Это законно:
 * ядро перенесено в Python и сверено с оригиналом эталонами (фаза 2), поэтому обе
 * реализации обязаны давать одно и то же. Но «обязаны» проверяется, а не
 * предполагается: расхождение здесь означает, что порт и оригинал разошлись, и
 * узнать об этом лучше кнопкой, чем через месяц по неверному отчёту.
 */
async function srvCheckAnalytics() {
  if (!SRV.on) { _alert('Сверка доступна только в серверном режиме.'); return; }
  const month = analyticsMonth || new Date().toISOString().slice(0, 7);
  const unit = analyticsUnit === 'min' ? 'min' : 'qty';
  const q = new URLSearchParams({ month, unit });
  for (const [k, v] of [['op', analyticsOp], ['stage', analyticsStage],
                        ['brigade', analyticsBrigade], ['contract', analyticsContract],
                        ['assortment', analyticsAssortment], ['article', analyticsArticle]]) {
    if (v) q.set(k, v);
  }
  let srv;
  try { srv = await SRV.get('analytics?' + q.toString()); }
  catch (err) { _alert('Не удалось получить расчёт сервера:\n' + srvErrText(err)); return; }

  const here = _analyticsTotals;
  if (!here || here.month !== month || here.unit !== unit) {
    _alert('Сначала откройте вкладку «Аналитика» с нужным месяцем.');
    return;
  }
  const rows = [
    ['План макро', srv.macro_plan, here.macro],
    ['План микро', srv.micro_plan, here.plan],
    ['Факт', srv.micro_fact, here.fact],
  ];
  const bad = rows.filter(([, a, b]) => Math.abs((+a || 0) - (+b || 0)) > 0.5);
  const text = rows.map(([n, a, b]) =>
    `${n}: сервер ${Math.round(+a || 0).toLocaleString('ru')}, ` +
    `здесь ${Math.round(+b || 0).toLocaleString('ru')}`).join('\n');
  _alert((bad.length
    ? `РАСХОЖДЕНИЕ с расчётом сервера (${month}).\nЭто ошибка переноса ядра — ` +
      `сообщите разработчику.\n\n`
    : `Совпадает с расчётом сервера (${month}).\n\n`) + text);
}

function addBase() {
  const name = document.getElementById('basf-name').value.trim();
  if (!name) { _alert('Введите название базы'); return; }
  const rec = { id: nid(), name };
  clearAddFormDraft(['basf-name']); _suppressDraftCaptureOnce = true;
  if (SRV.on) { srvCreate('bases', rec); return; }
  S.bases.push(rec);
  save(); renderActive();
}
function updBase(id, f, v) {
  const b = byId(S.bases, id);
  if (!b) return;
  b[f] = v;
  if (SRV.on) { srvUpdate('bases', b); return; }
  save();
}
async function delBase(id) {
  if (!await _confirm('Удалить базу?')) return;
  if (SRV.on) { await srvDelete('bases', id); return; }
  S.bases = S.bases.filter(b => b.id !== id);
  save(); renderActive();
}

function nomCheckboxListHtmlRow(names, selectedSet, onchangeHandler) {

function nfAddRefreshSummary() {

function applyNomSelections(id) {
  const n = byId(S.nomenclature, id);
  if (!n) return;
  const ops = nfReadChecked(`nom-${id}-ops`);
  if (!ops.length) {
    _alert('Выберите минимум один ОП.');
    return;
  }
  // Цеха выводятся из выбранных ОП через справочник (пустой список = нет ограничений, как в addNom)
  const wss = [...new Set(S.ops.filter(o => ops.includes(o.name)).map(o => o.workshop).filter(Boolean))];

// Какой вариант маршрута сейчас редактируется в карточке: nom.id -> имя ОП ('' = базовый).
let nomRouteEditOp = {};

/** Имя ОП, чей маршрут сейчас редактируется в карточке ('' = базовый). */
function nomEditOpOf(n) { return nomRouteEditOp[n.id] || ''; }

/** Массив маршрута, который сейчас редактируется (базовый или переопределение ОП).
 *  createOverride=true — создаёт пустое переопределение, если его ещё нет. */
function nomRouteEditTarget(n, createOverride) {
  const op = nomEditOpOf(n);
  if (!op) {
    if (!Array.isArray(n.route)) n.route = [];
    return n.route;
  }
  if (!Array.isArray(n.routeOverrides)) n.routeOverrides = [];
  let ov = n.routeOverrides.find(o => o.op === op);
  if (!ov) {
    if (!createOverride) return null;
    ov = { op, route: [] };
    n.routeOverrides.push(ov);
  }
  if (!Array.isArray(ov.route)) ov.route = [];
  return ov.route;
}

/** Артикул ШЦ карточки (n.articleItem) ведётся только по БАЗОВОМУ маршруту. */
function syncNomArticleItem(n) {
  const sewItem = (Array.isArray(n.route) ? n.route : []).find(r => r.stage === 'ШЦ');
  n.articleItem = sewItem ? sewItem.articleItem : n.articleGp;
}

function _reopenNomRoute(nomId) {
  requestAnimationFrame(() => {
    const d = document.getElementById('nom-route-' + nomId);
    if (d) d.open = true;
  });
}

/** Переключить редактируемый вариант маршрута (общий / по конкретному ОП). */
function setNomRouteEditOp(nomId, op) {
  nomRouteEditOp[nomId] = op || '';
  renderActive();
  _reopenNomRoute(nomId);
}

/** Создать переопределение маршрута для выбранного ОП (copyBase — как копию общего). */
function createNomRouteOverride(nomId, copyBase) {
  const n = byId(S.nomenclature, nomId);
  if (!n) return;
  const op = nomEditOpOf(n);
  if (!op) return;
  if (!Array.isArray(n.routeOverrides)) n.routeOverrides = [];
  let ov = n.routeOverrides.find(o => o.op === op);
  if (!ov) { ov = { op, route: [] }; n.routeOverrides.push(ov); }
  ov.route = copyBase && Array.isArray(n.route) ? n.route.map(r => ({ ...r })) : [];
  save();
  renderActive();
  _reopenNomRoute(nomId);
}

/** Удалить переопределение текущего ОП — вернуть его к общему маршруту. */
async function deleteNomRouteOverride(nomId) {
  const n = byId(S.nomenclature, nomId);
  if (!n) return;
  const op = nomEditOpOf(n);
  if (!op || !Array.isArray(n.routeOverrides)) return;
  if (!await _confirm(`Удалить переопределение маршрута для ОП «${op}»? ОП вернётся к общему маршруту.`)) return;
  n.routeOverrides = n.routeOverrides.filter(o => o.op !== op);
  save();
  renderActive();
  _reopenNomRoute(nomId);
}

function addRouteItem(nomId) {
  const n = byId(S.nomenclature, nomId);
  if (!n) return;
  const rt = nomRouteEditTarget(n, true);
  rt.push({ stage: 'ШЦ', articleItem: '', name: '', timeCost: 0 });
  syncNomArticleItem(n);
  save();
  renderActive();
  _reopenNomRoute(nomId);
}
function delRouteItem(nomId, idx) {
  const n = byId(S.nomenclature, nomId);
  if (!n) return;
  const rt = nomRouteEditTarget(n, false);
  if (!rt) return;
  rt.splice(idx, 1);
  syncNomArticleItem(n);
  save();
  renderActive();
  _reopenNomRoute(nomId);
}
function updRouteItem(nomId, idx, field, value) {
  const n = byId(S.nomenclature, nomId);
  if (!n) return;
  const rt = nomRouteEditTarget(n, false);
  if (!rt || !rt[idx]) return;
  const item = rt[idx];
  if (field === 'timeCost') item.timeCost = Math.max(0, +value || 0);
  else item[field] = value;
  if (field === 'articleItem' || field === 'stage') syncNomArticleItem(n);
  if (field === 'stage') {
    const summaryEl = document.getElementById('nom-route-summary-' + nomId);
    if (summaryEl) {
      summaryEl.textContent = rt.length
        ? [...new Set(rt.map(r => r.stage))].join(' → ')
        : '—';
    }
  }
  save();
}

function addNom() {
  const gp = document.getElementById('nf-gp').value.trim();
  const nm = document.getElementById('nf-nm').value.trim();
  const assortmentGroup = (document.getElementById('nf-assort') && document.getElementById('nf-assort').value.trim()) || '';
  const model = (document.getElementById('nf-model') && document.getElementById('nf-model').value.trim()) || '';
  const normType = document.getElementById('nf-norm-type').value;
  const ops = nfReadChecked('nf-add-ops');
  if (!gp || !nm) { _alert('Заполните артикул ГП и наименование'); return; }
  if (S.nomenclature.some(x => x.articleGp === gp)) {
    _alert('Карточка с таким артикулом ГП уже есть.');
    return;
  }
  const card = {
    id: nid(),
    articleGp: gp,
    articleItem: gp,
    name: nm,
    model,
    assortmentGroup,
    normType,
    nomOps: ops,
    nomWorkshops: [],
    route: [],
    routeOverrides: []
  };
  if (SRV.on) { srvAddNom(card); return; }
  S.nomenclature.push(card);
  save();
  renderActive();
}

function srvAddNom(card) { return srvCreate('nomenclature', card); }

function updNom(id, f, v) {
  const n = byId(S.nomenclature, id);
  if (!n) return;
  n[f] = v;
  if (f === 'articleGp' && n.route) {
    const sewItem = n.route.find(r => r.stage === 'ШЦ');
    n.articleItem = sewItem ? sewItem.articleItem : v;
  }
  if (SRV.on) { srvUpdNom(n); return; }
  save();
  renderActive();
}

function srvUpdNom(n) { return srvUpdate('nomenclature', n); }
async function delNom(id){
  if(!await _confirm('Удалить карточку номенклатуры? Это может повлиять на расчёты.')) return;
  if (SRV.on) { await srvDelete('nomenclature', id); return; }
  S.nomenclature = S.nomenclature.filter(n=>n.id!==id);
  save(); renderActive();
}

  const wInput = document.getElementById('opf-w');
  if (!pt || !wLabel) return;
  if (pt === 'База') {
    wLabel.firstChild.textContent = 'База';
    if (wInput) wInput.placeholder = 'Название базы';
    if (tLabel) tLabel.style.display = 'none';
  } else {
    wLabel.firstChild.textContent = 'Цех / бригада';
    if (wInput) wInput.placeholder = 'Цех курток';
    if (tLabel) tLabel.style.display = '';
  }
}
function addOp(){
  const n = document.getElementById('opf-n').value.trim();
  const w = document.getElementById('opf-w').value.trim();
  const processType = document.getElementById('opf-process').value;
  const type = processType === 'База' ? 'БТК' : document.getElementById('opf-type').value;
  if(!n || !w){
    _alert('Заполните ОП и ' + (processType === 'База' ? 'базу' : 'цех'));
    return;
  }
  const rec = {id:nid(), name:n, workshop:w, type, processType, shiftDuration:480, frvMin:0};
  clearAddFormDraft(['opf-n','opf-w','opf-process','opf-type']); _suppressDraftCaptureOnce = true;
  if (SRV.on) { srvCreate('ops', rec); return; }
  S.ops.push(rec);
  save(); renderActive();
}
function updOp(id, f, v){
  const o=byId(S.ops,id);
  if(!o) return;
  o[f]=v;
  if (SRV.on) { srvUpdate('ops', o); return; }
  save(); renderActive();
}
async function delOp(id){
  if(!await _confirm('Удалить ОП/цех? Это может затронуть номенклатуру и планы.')) return;
  if (SRV.on) { await srvDelete('ops', id); return; }
  S.ops = S.ops.filter(o=>o.id!==id);
  save(); renderActive();
}

// ================================================================
