  return `<details style="position:relative">
    <summary class="cbf-trigger">${esc(summary)}</summary>
    <div onclick="event.stopPropagation()" style="position:absolute;top:calc(100%+4px);left:0;z-index:40;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.12);padding:8px;max-height:220px;overflow:auto;min-width:180px">
      <div id="${listId}">${checkboxes}</div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:1px solid #e2e8f0;gap:6px">
        <button type="button" class="btn btn-outline btn-sm" onclick="event.stopPropagation();document.querySelectorAll('#${listId} input').forEach(el=>el.checked=true)">Все</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="event.stopPropagation();document.querySelectorAll('#${listId} input').forEach(el=>el.checked=false)">Снять все</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="event.stopPropagation();${applyFn}()">OK</button>
      </div>
    </div>
  </details>`;
}

function resetMacroFilters() {
  macroFilters = { articleItem: '', contractNumber: '', assortment: '', workshops: [], months: [], volumeType: '' };
  renderMacroplan();
}

/** Подсветка всех ячеек с тем же артикулом изделия или тем же наименованием (макроплан). */
function macroPlanHl(el, on) {
  if (!el) return;
  const a = el.getAttribute('data-mp-art') || '';
  const n = el.getAttribute('data-mp-nm') || '';
  document.querySelectorAll('td.mp-macro-pair').forEach(td => {
    const ta = td.getAttribute('data-mp-art') || '';
    const tn = td.getAttribute('data-mp-nm') || '';
    const match = (a && ta === a) || (n && tn === n);
    if (match) td.classList.toggle('mp-macro-hl', !!on);
  });
}

function renderMacroplan() {
  migrateMacroplanProcessQty();
  const el = document.getElementById('tab-macroplan');
  const allOps = [...new Set(S.ops.map(o => o.name))].sort((a, b) => a.localeCompare(b, 'ru'));
  const selectedOps = macroSelectedOps();
  const opSet = new Set(selectedOps);
  const opMatches = (opName) => !opSet.size || opSet.has(opName);
  const opsForForm = selectedOps.length ? selectedOps : allOps;
  if (!macroCtx.formOp || !opsForForm.includes(macroCtx.formOp)) macroCtx.formOp = opsForForm[0] || '';
  const formOp = macroCtx.formOp || '';

  if (!allOps.length) {
    el.innerHTML = `<div class="sec-title">Макроплан</div><p style="padding:20px;color:#64748b">Сначала заполните справочник ОП / Цеха.</p>`;
    return;
  }

  const opItems = allNomArticleItems(formOp);
  const opWorkshops = [...new Set(S.ops.filter(o => o.name === formOp).map(o => o.workshop))];
  const contractDatalist = S.contracts.map(c=>`<option value="${esc(c.number)}">`).join('');
  const itemOpts = opItems.map(ai=>`<option value="${esc(ai)}">${esc(ai)}</option>`).join('');
  const workshopOpts = opWorkshops.map(ws=>`<option value="${esc(ws)}">${esc(ws)}</option>`).join('');

  const macroRowsForOps = S.macroplan.filter(r => opMatches(r.op));
  const artOpts = [...new Set(macroRowsForOps.map(r => articleGpForMacroArticleItem(r.articleItem)))].sort((a, b) => String(a).localeCompare(String(b), 'ru'));
  const contractOptsF = [...new Set(macroRowsForOps.map(r => {
    const c = byId(S.contracts, r.contractId);
    return c ? c.number : '';
  }).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), 'ru'));
  const assortOpts = [...new Set(S.nomenclature.map(n => String(n.assortmentGroup || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));

  let html = `<div class="sec-title">Макроплан</div>
  <div class="ctx-bar mac-ctx-one">
    <label>ОП
    <details id="mac-op-dd" style="position:relative" ontoggle="if(this.open){const d=this.querySelector('div');if(d)d.scrollTop=0}">
      <summary class="cbf-trigger">${esc(macroOpsSummary(allOps))}</summary>
      <div onclick="event.stopPropagation()" style="position:absolute;top:calc(100% + 4px);left:0;z-index:40;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.12);padding:8px;max-height:220px;overflow:auto;min-width:230px">
        <div id="mac-op-list">
          ${allOps.map(opName => `<label style="display:grid;grid-template-columns:16px 1fr;align-items:center;column-gap:8px;margin-bottom:6px;white-space:nowrap;cursor:pointer">
            <input type="checkbox" value="${esc(opName)}" ${(!selectedOps.length || opSet.has(opName)) ? 'checked' : ''} style="width:14px;height:14px;margin:0;accent-color:#2563eb;justify-self:start">
            <span style="font-size:12px;color:#1e293b">${esc(opName)}</span>
          </label>`).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:6px;border-top:1px solid #e2e8f0;gap:8px">
          <button type="button" class="btn btn-outline btn-sm" onclick="event.stopPropagation();document.querySelectorAll('#mac-op-list input[type=checkbox]').forEach(el=>el.checked=true);macroApplyOpsFromChecks()">Все</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="event.stopPropagation();macroApplyOpsFromChecks()">Применить</button>
        </div>
      </div>
    </details>
    </label>
    <label>Артикул ГП
      <select onchange="macroFilters.articleItem=this.value;renderMacroplan()">
        <option value="">Все</option>
        ${artOpts.map(ai => `<option value="${esc(ai)}" ${macroFilters.articleItem === ai ? 'selected' : ''}>${esc(ai)}</option>`).join('')}
      </select>
    </label>
    <label>Контракт
      <select onchange="macroFilters.contractNumber=this.value;renderMacroplan()">
        <option value="">Все</option>
        ${contractOptsF.map(num => `<option value="${esc(num)}" ${macroFilters.contractNumber === num ? 'selected' : ''}>${esc(num)}</option>`).join('')}
      </select>
    </label>
    <label>Ассорт. группа
      <select onchange="macroFilters.assortment=this.value;renderMacroplan()">
        <option value="">Все</option>
        ${assortOpts.map(ag => `<option value="${esc(ag)}" ${macroFilters.assortment === ag ? 'selected' : ''}>${esc(ag)}</option>`).join('')}
      </select>
    </label>
    <label>Цех
      ${(() => {
        const allWs = [...new Set(S.macroplan.filter(r => !macroSelectedOps().length || macroSelectedOps().includes(r.op)).map(r => r.workshop || '').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
        return allWs.length ? checkboxFilterHtml('mac-ws-list', allWs, macroFilters.workshops || [], 'macroApplyWorkshopsFromChecks') : '<span style="font-size:12px;color:#94a3b8">—</span>';
      })()}
    </label>
    <label>Месяц
      ${(() => {
        const allM = [...new Set(S.macroplan.map(r => r.month || '').filter(Boolean))].sort();
        return allM.length ? checkboxFilterHtml('mac-month-list', allM, macroFilters.months || [], 'macroApplyMonthsFromChecks', m => mlabel(m)) : '<span style="font-size:12px;color:#94a3b8">—</span>';
      })()}
    </label>
    <label>Тип объёма
      <select onchange="macroFilters.volumeType=this.value;renderMacroplan()">
        <option value="">Все</option>
        <option value="main" ${macroFilters.volumeType === 'main' ? 'selected' : ''}>Основные</option>
        <option value="extra" ${macroFilters.volumeType === 'extra' ? 'selected' : ''}>Доп.</option>
      </select>
    </label>
    <button class="ctx-bar-btn" onclick="resetMacroFilters()">Сбросить</button>
  </div>`;

  const formWorkshop = macroCtx.formWorkshop || '';
  const formContract = macroCtx.formContract || '';
  const filteredItems = allNomArticleItemsFiltered(formOp, formContract, formWorkshop);
  const filteredItemOpts = filteredItems.map(ai => `<option value="${esc(ai)}"${ai === lastFormInput.articleItem ? ' selected' : ''}>${esc(ai)}</option>`).join('');
  const filteredWorkshopOpts = opWorkshops.map(ws => `<option value="${esc(ws)}"${ws === formWorkshop ? ' selected' : ''}>${esc(ws)}</option>`).join('');
  const normVal = (formOp && lastFormInput.articleItem) ? timeCostOfForOp(lastFormInput.articleItem, formOp, formWorkshop) : 0;
  const initMonth = lastFormInput.month || '';
  if (initMonth) MPS['mpf-month'] = { year: +initMonth.split('-')[0], value: initMonth };

  html += `<div class="add-form">
    <label>ОП
      <select class="w160" id="mpf-op" onchange="macroCtx.formOp=this.value;macroCtx.formWorkshop='';macroFormUpdateWorkshops()">
        <option value="">— выбрать —</option>
        ${opsForForm.map(o=>`<option ${formOp===o?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}
      </select>
    </label>
    <label>Контракт
      <select class="w200" id="mpf-c" onchange="macroFormContractChange()">
        <option value="">— выбрать —</option>
        ${S.contracts.map(c=>`<option value="${esc(c.id)}" ${String(formContract)===String(c.id)?'selected':''}>${esc(c.number)}${c.name?' — '+esc(c.name):''}</option>`).join('')}
      </select>
    </label>
    <label>Цех
      <select class="w160" id="mpf-ws" onchange="macroCtx.formWorkshop=this.value;macroFormUpdateArticles()">
        <option value="">— выбрать —</option>${filteredWorkshopOpts}
      </select>
    </label>
    <label>Артикул изделия
      <select class="w160" id="mpf-item" onchange="macroFormUpdateNorm()">
        <option value="">— выбрать —</option>${filteredItemOpts}
      </select>
    </label>
    <label>Норма, мин/шт<input class="w80" id="mpf-norm" type="number" min="0" step="0.01" placeholder="${normVal > 0 ? normVal : '—'}" value="${normVal > 0 ? normVal : ''}" oninput="this._userEdited=true" title="Норма из номенклатуры подставляется автоматически, можно скорректировать"></label>
    <label>Месяц${mpWidget('mpf-month', lastFormInput.month || '')}</label>
    <label>Эфф.%<input class="w64" id="mpf-eff" type="number" min="0" max="999" step="1" value="100" placeholder="100"></label>
    <label>Кол-во, шт<input class="w64" id="mpf-qty-sew" type="number" min="0" placeholder="0"></label>
    <label>Тип объёма
      <select class="w120" id="mpf-vol-type">
        <option value="main">Основные</option>
        <option value="extra">Доп. объёмы</option>
      </select>
    </label>
    <button class="btn btn-primary" onclick="addMacro()">+ Добавить</button>
  </div>`;

  if (!macroRowsForOps.length) {
    el.innerHTML = html + `<p style="padding:20px;color:#64748b">Нет данных по выбранному фильтру ОП. Используйте форму выше для добавления.</p>`;
    mpGrid('mpf-month');
    return;
  }

  const macroRowsVisible = macroRowsForOps.filter(macroRowPassesFilters);
  if (!macroRowsVisible.length) {
    el.innerHTML = html + `<p style="padding:20px;color:#64748b">Нет строк макроплана по выбранным фильтрам таблицы. Сбросьте фильтры или измените критерии.</p>`;
    mpGrid('mpf-month');
    return;
  }

  const months = [...new Set(macroRowsVisible.map(r => r.month).filter(Boolean))].sort();

  function frvFromSchedForOps(ops, ym) {
    return ops.reduce((s, opName) => s + frvNominalFromSchedOp(opName, ym), 0);
  }

  function frvEffectiveFromSchedForOps(ops, ym) {
    return ops.reduce((s, opName) => s + frvEffectiveForMacroLoad(opName, ym), 0);
  }

  const opsUsed = selectedOps.length ? selectedOps : allOps;

  // Без агрегации: КАЖДАЯ запись макроплана — отдельная строка таблицы.
  // У разных строк с одинаковыми контракт/артикул/ОП могут быть разные нормы и заказы.
  // Месяцы остаются колонками; строка заполняет только колонку своего месяца.
  const sortedRows = macroRowsVisible.slice().sort((a, b) => {
    const ca = byId(S.contracts, a.contractId)?.number || '';
    const cb = byId(S.contracts, b.contractId)?.number || '';
    return ca.localeCompare(cb, 'ru')
      || String(a.articleItem).localeCompare(String(b.articleItem), 'ru')
      || String(a.op).localeCompare(String(b.op), 'ru')
      || String(a.month || '').localeCompare(String(b.month || ''));
  });

  const monthThs = months.map(m => `<th class="mp-st-month" style="text-align:center">${mlabel(m)}</th>`).join('');

  html += `<div id="macro-sel-summary"></div>`;
  html += `<div id="macro-plan-scroll" class="table-wrap mac-plan-scroll"><table><thead>
      <tr>
      <th style="width:26px;text-align:center" title="Выделить для суммирования"><input type="checkbox" id="macro-sel-all" onclick="macroToggleSelAll(this.checked)"></th>
      <th class="mp-st-1">Контракт</th>
      <th class="mp-st-2">Артикул изделия</th>
      <th class="mp-st-3">Наименование изделия</th>
      <th class="mp-st-4">ОП / Цех</th>
      <th class="mp-st-5">Норма<br><span style="font-weight:400;font-size:11px">мин/шт</span></th>
      <th class="mp-st-6" style="text-align:center">Итого<br><span style="font-weight:400;font-size:11px">план</span></th>
      ${monthThs}
      <th title="Заказы на производство">Заказы на пр-во</th>
      <th>Тип</th><th></th>
      </tr>
  </thead><tbody>`;

  for (const r of sortedRows) {
    const c = byId(S.contracts, r.contractId);
    const contractNum = c ? c.number : '';
    const articleItem = r.articleItem;
    const op = r.op, workshop = r.workshop || '';
    const vt = r.volumeType || 'main';
    const rMonth = r.month || '';
    const tcByOp = timeCostOfForOp(articleItem, op, workshop);
    const displayNorm = (r.normOverride != null && r.normOverride !== '') ? r.normOverride : tcByOp;
    const qty = +macroRowKitQuantity(r) || 0;
    const effM = r.eff != null ? +r.eff : 100;

    const normInput = `<input type="number" min="0" step="0.01" value="${displayNorm||''}" placeholder="${tcByOp||''}" style="width:60px;font-size:11px;text-align:center;border:1px solid #e2e8f0;border-radius:4px;padding:1px 3px" onkeydown="if(event.key==='Enter')this.blur()" onblur="updMacroRowNormFlat(${r.id},this.value)">`;

    const monthCells = months.map(m => {
      if (m !== rMonth) return `<td class="mp-st-month" style="background:#fafbfc"></td>`;
      const qtyInput = `<input type="number" min="0" value="${qty||''}" placeholder="0" style="width:72px;text-align:center;padding:2px 4px;border:1px solid #e2e8f0;border-radius:4px;font-size:13px;font-weight:600;display:block;margin:0 auto 2px" onblur="updMacroCell(${r.id},+this.value)">`;
      const effInput = `<div style="display:flex;align-items:center;justify-content:center;gap:2px;margin-top:1px"><span style="font-size:10px;color:#64748b">эфф:</span><input type="number" min="0" max="999" step="1" value="${effM}" style="width:36px;font-size:10px;text-align:center;border:1px solid #e2e8f0;border-radius:3px;padding:0 2px" onkeydown="if(event.key==='Enter')this.blur()" onblur="updMacroCellEff(${r.id},+this.value)"><span style="font-size:10px;color:#64748b">%</span></div>`;
      return `<td class="mp-st-month" style="padding:4px 6px;text-align:center;vertical-align:middle">${qtyInput}${effInput}</td>`;
    }).join('');

    const nmDisp = routeNameOf(articleItem) || '';
    const orderNums = r.orderNums || [];
    const wrapId = 'r' + r.id;
    const moSummary = orderNums.length
      ? orderNums.map(n => esc(n)).join(', ')
      : '<span style="color:#cbd5e1">—</span>';
    const ordersCell = `<div class="launch-wrap" id="macro-ow-${wrapId}">
      <div style="font-size:11px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px" title="${esc(orderNums.join(', '))}">${moSummary}</div>
      <button type="button" class="micro-w-trigger" onclick="toggleMacroRowOrdersPanel(event,${r.id})">▼ Заказы${orderNums.length?` (${orderNums.length})`:''}</button>
      <div id="macro-rc-dates-${wrapId}">${_macroRowRcDatesSummary(r)}</div>
      <div class="launch-panel" style="min-width:280px"></div>
    </div>`;

    html += `<tr>
      <td style="text-align:center"><input type="checkbox" class="macro-row-sel" ${macroSelected.has(r.id)?'checked':''} onchange="macroToggleRowSel(${r.id},this.checked)"></td>
      <td class="ro mp-st-1">${esc(contractNum)}</td>
      <td class="ro mp-st-2">${esc(articleItem)}</td>
      <td class="ro mp-st-3">${nmDisp ? esc(nmDisp) : '—'}</td>
      <td class="ro mp-st-4">${esc(workshop ? `${op} / ${workshop}` : op)}</td>
      <td class="mp-st-5">${normInput}</td>
      <td class="mp-st-6 ro" style="text-align:center;font-weight:700">${qty.toLocaleString('ru')}</td>
      ${monthCells}
      <td class="ro" style="min-width:100px">${ordersCell}</td>
      <td style="min-width:80px"><select style="font-size:11px;padding:2px 4px" onchange="updMacroRowVolumeType(${r.id},this.value)">
          <option value="main" ${vt==='main'?'selected':''}>Основные</option>
          <option value="extra" ${vt==='extra'?'selected':''}>Доп.</option>
        </select></td>
      <td style="text-align:center"><button class="btn btn-danger btn-sm" onclick="deleteMacroRow(${r.id})">✕</button></td>
    </tr>`;
  }
  html += `</tbody></table></div>`;

  // ФРВ и загрузка по месяцам
  const microMonths = [...new Set(S.microplan.filter(r=>opMatches(r.op) && r.date).map(r=>r.date.slice(0,7)))];
  const schedMonths = [...new Set(S.schedules.filter(s=>opMatches(s.op)).flatMap(s=>s.activeMonths||[]))];
  const frvMonths = [...new Set([...months, ...microMonths, ...schedMonths])].sort();
  if (frvMonths.length) {
    // Загрузка по цехам (ОП × цех × месяц)
    const opWsPairs = [...new Set([
      ...S.manualFrv.filter(x => opsUsed.includes(x.op)).map(x => x.op + '|||' + (x.workshop||'')),
      ...macroRowsVisible.map(r => r.op + '|||' + (r.workshop||''))
    ])].map(k => { const [op, ws] = k.split('|||'); return { op, ws }; })
      .sort((a,b) => a.op.localeCompare(b.op,'ru') || a.ws.localeCompare(b.ws,'ru'));

    html += `<div class="sec-title" style="margin-top:14px">Загрузка по цехам по месяцам</div>
    <div id="macro-load-scroll" class="table-wrap mac-load-scroll"><table><thead>
      <tr><th class="mf-st-op">ОП / Цех</th>${frvMonths.map(m => `<th class="mf-st-month" style="text-align:center;width:190px;min-width:190px">${esc(mlabel(m))}</th>`).join('')}</tr>
    </thead><tbody>`;

    // Хелпер: ячейка загрузки за месяц
    // mainRows = volumeType==='main', allRows = main+extra, frvAvail = ФРВ×0.95, manEff = эфф.%
    const macroLoadCell = (mainRows, allRows, frvAvail, manEff) => {
      const needMain = mainRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0);
      const needAll  = allRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0);
      const qtyMain  = mainRows.reduce((s, r) => s + macroRowKitQuantity(r), 0);
      const qtyExtra = allRows.filter(r => (r.volumeType||'main') === 'extra').reduce((s, r) => s + macroRowKitQuantity(r), 0);
      const hasExtra = needAll > needMain && qtyExtra > 0;
      if (frvAvail <= 0 && needAll <= 0) return `<td class="mf-st-month" style="color:#94a3b8;text-align:center">—</td>`;
      const effK    = Math.max(0.01, (manEff || 100) / 100);
      const lpMain  = frvAvail > 0 && needMain > 0 ? needMain / (frvAvail * effK) * 100 : (frvAvail <= 0 && needMain > 0 ? null : null);
      const lpAll   = frvAvail > 0 && needAll  > 0 ? needAll  / (frvAvail * effK) * 100 : null;
      const loadCol = lp => lp == null ? '#94a3b8' : lp > 100 ? '#ef4444' : lp > 85 ? '#f59e0b' : '#16a34a';
      const line = (label, val) => `<div style="font-size:11px;display:flex;gap:4px"><span style="color:#94a3b8;white-space:nowrap">${label}:</span><span>${val}</span></div>`;
      const loadLine = lpMain != null || lpAll != null
        ? line('Загрузка',
            (lpMain != null ? `<b style="color:${loadCol(lpMain)}">${lpMain.toFixed(1)}%</b>` : '<span style="color:#94a3b8">—</span>') +
            (hasExtra && lpAll != null ? `<span style="font-size:10px;color:#6366f1;margin-left:4px">/ <b>${lpAll.toFixed(1)}%</b> с доп.</span>` : ''))
        : '';
      return `<td class="mf-st-month" style="vertical-align:top;padding:4px 8px">
        ${qtyMain > 0 ? line('Осн.',     qtyMain.toLocaleString('ru') + ' шт') : ''}
        ${hasExtra    ? line('Доп.',      qtyExtra.toLocaleString('ru') + ' шт') : ''}
        ${needMain > 0 ? line('Время',   Math.round(needMain).toLocaleString('ru') + (hasExtra ? `<span style="color:#6366f1;font-size:10px"> +${Math.round(needAll-needMain).toLocaleString('ru')}</span>` : '') + ' мин') : ''}
        ${frvAvail > 0 ? line('Доступно', Math.round(frvAvail).toLocaleString('ru') + ' мин') : needAll > 0 ? line('Доступно', '<span style="color:#ef4444">нет ФРВ</span>') : ''}
        ${loadLine}
      </td>`;
    };

    // Хелпер: строка ввода эффективности (под каждой строкой цеха)
    const macroEffRow = (op, ws) => {
      const effCells = frvMonths.map(m => {
        const v = getMacroEff(op, ws, m);
        const frvAvail = frvEffectiveForMacroLoad(op, m, ws);
        if (frvAvail <= 0) return `<td class="mf-st-month" style="text-align:center;color:#94a3b8">—</td>`;
        return `<td class="mf-st-month" style="text-align:center;padding:2px 4px">
          <input type="number" min="0" max="999" step="1" value="${v}"
            style="width:52px;font-size:11px;text-align:center;border:1px solid #d1d5db;border-radius:4px;padding:1px 3px"
            title="Эффективность % для ${esc(op)}/${esc(ws)} за ${esc(mlabel(m))}"
            onkeydown="if(event.key==='Enter')this.blur()"
            onblur="setMacroEff('${esc(op)}','${esc(ws)}','${m}',+this.value)">
        </td>`;
      }).join('');
      return `<tr style="background:#f8fafc"><td class="mf-st-op" style="padding-left:16px;font-size:11px;color:#64748b">Эфф.&nbsp;%</td>${effCells}</tr>`;
    };

    for (const { op, ws } of opWsPairs) {
      const _opRec = (S.ops || []).find(o => o.name === op && o.workshop === ws);
      const _isShc = _opRec ? _opRec.processType === 'ШЦ' : ws === 'ШЦ';
      if (_isShc) {
        // Одна строка ШЦ, разбивка количества по наименованиям внутри каждой ячейки месяца
        const shcCells = frvMonths.map(m => {
          const allRows  = macroRowsForOps.filter(r => r.op === op && (r.workshop||'') === ws && r.month === m);
          const mainRows = allRows.filter(r => (r.volumeType||'main') === 'main');
          const extraRows = allRows.filter(r => (r.volumeType||'main') === 'extra');
          const needMain = mainRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0);
          const needAll  = allRows.reduce((s, r) => s + macroRowLaborMinutes(r), 0);
          const frvAvail = frvEffectiveForMacroLoad(op, m, ws);
          const manEff   = macroRowsEfficiency(allRows);
          if (frvAvail <= 0 && needAll <= 0) return `<td class="mf-st-month" style="color:#94a3b8;text-align:center">—</td>`;
          const effK    = Math.max(0.01, manEff / 100);
          const lpMain  = frvAvail > 0 && needMain > 0 ? needMain / (frvAvail * effK) * 100 : null;
          const lpAll   = frvAvail > 0 && needAll  > 0 ? needAll  / (frvAvail * effK) * 100 : null;
          const hasExtra = extraRows.length > 0;
          const loadCol  = lp => lp == null ? '#94a3b8' : lp > 100 ? '#ef4444' : lp > 85 ? '#f59e0b' : '#16a34a';
          // Тот же стиль, что и в остальных строках (цвет меток #94a3b8, flex).
          const line = (label, val) => `<div style="font-size:11px;display:flex;gap:4px"><span style="color:#94a3b8;white-space:nowrap">${label}:</span><span>${val}</span></div>`;
          // Строка номенклатуры: название серым (переносится), кол-во жирным под ним (не рвётся).
          const nameLine = (nm, valHtml) => `<div style="font-size:11px;line-height:1.25;margin-bottom:3px"><div style="color:#94a3b8">${esc(nm)}</div><div style="white-space:nowrap;font-weight:600">${valHtml}</div></div>`;
          // Осн. изделия по наименованиям
          const nameMapMain = {};
          for (const r of mainRows) {
            const nm = routeNameOf(r.articleItem) || r.articleItem || '—';
            nameMapMain[nm] = (nameMapMain[nm] || 0) + macroRowKitQuantity(r);
          }
          const nameLinesMain = Object.entries(nameMapMain)
            .sort(([a], [b]) => a.localeCompare(b, 'ru'))
            .filter(([, qty]) => qty > 0)
            .map(([nm, qty]) => nameLine(nm, qty.toLocaleString('ru') + ' шт'))
            .join('');
          // Доп. изделия по наименованиям
          const nameMapExtra = {};
          for (const r of extraRows) {
            const nm = routeNameOf(r.articleItem) || r.articleItem || '—';
            nameMapExtra[nm] = (nameMapExtra[nm] || 0) + macroRowKitQuantity(r);
          }
          const nameLinesExtra = Object.entries(nameMapExtra)
            .sort(([a], [b]) => a.localeCompare(b, 'ru'))
            .filter(([, qty]) => qty > 0)
            .map(([nm, qty]) => nameLine(nm, `<span style="color:#6366f1">${qty.toLocaleString('ru')} шт доп.</span>`))
            .join('');
          const loadLine = lpMain != null || lpAll != null
            ? line('Загрузка',
                (lpMain != null ? `<b style="color:${loadCol(lpMain)};white-space:nowrap">${lpMain.toFixed(1)}%</b>` : '<span style="color:#94a3b8">—</span>') +
                (hasExtra && lpAll != null ? `<span style="font-size:10px;color:#6366f1;margin-left:4px;white-space:nowrap">/ <b>${lpAll.toFixed(1)}%</b> с доп.</span>` : ''))
            : '';
          return `<td class="mf-st-month" style="vertical-align:top;padding:4px 8px">
            ${nameLinesMain}
            ${nameLinesExtra}
            ${needMain > 0 ? line('Время', `<span style="white-space:nowrap">${Math.round(needMain).toLocaleString('ru')}${hasExtra ? '' : ' мин'}</span>` + (hasExtra ? `<span style="color:#6366f1;font-size:10px;white-space:nowrap"> +${Math.round(needAll-needMain).toLocaleString('ru')} мин</span>` : '')) : ''}
            ${frvAvail > 0 ? line('Доступно', Math.round(frvAvail).toLocaleString('ru') + ' мин') : needAll > 0 ? line('Доступно', '<span style="color:#ef4444">нет ФРВ</span>') : ''}
            ${loadLine}
          </td>`;
        }).join('');
        html += `<tr><td class="mf-st-op"><b>${esc(op)} / ${esc(ws)}</b></td>${shcCells}</tr>`;
      } else {
        const cells = frvMonths.map(m => {
          const allRows  = macroRowsForOps.filter(r => r.op === op && (r.workshop||'') === ws && r.month === m);
          const mainRows = allRows.filter(r => (r.volumeType||'main') === 'main');
          return macroLoadCell(mainRows, allRows, frvEffectiveForMacroLoad(op, m, ws), macroRowsEfficiency(allRows));
        }).join('');
        html += `<tr><td class="mf-st-op"><b>${esc(op)}${ws ? ' / ' + esc(ws) : ''}</b></td>${cells}</tr>`;
      }
    }
    if (!opWsPairs.length) {
      html += `<tr><td colspan="${1 + frvMonths.length}" class="empty">Нет данных — добавьте строки в макроплан или ФРВ.</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }


  el.innerHTML = html;
  mpGrid('mpf-month');
  macroRenderSelSummary();
  requestAnimationFrame(() => requestAnimationFrame(() => macroPlanScrollToEnd()));
}

/** Переключить выделение строки макроплана для суммирования. */
function macroToggleRowSel(id, checked) {
  if (checked) macroSelected.add(id); else macroSelected.delete(id);
  macroRenderSelSummary();
  const allEl = document.getElementById('macro-sel-all');
  if (allEl) {
    const boxes = [...document.querySelectorAll('.macro-row-sel')];
    allEl.checked = boxes.length > 0 && boxes.every(b => b.checked);
  }
}

/** Выделить/снять все видимые строки макроплана. */
function macroToggleSelAll(checked) {
  document.querySelectorAll('.macro-row-sel').forEach(b => {
    const id = +b.getAttribute('onchange').match(/macroToggleRowSel\((\d+)/)[1];
    b.checked = checked;
    if (checked) macroSelected.add(id); else macroSelected.delete(id);
  });
  macroRenderSelSummary();
}

/** Сумма количеств и трудоёмкости по выделенным видимым строкам макроплана. */
function macroRenderSelSummary() {
  const box = document.getElementById('macro-sel-summary');
  if (!box) return;
  const rows = (S.macroplan || []).filter(r => macroSelected.has(r.id) && macroRowPassesFilters(r));
  if (!rows.length) { box.innerHTML = ''; return; }
  const sumQty = rows.reduce((s, r) => s + (+macroRowKitQuantity(r) || 0), 0);
  const sumMin = rows.reduce((s, r) => s + (+macroRowLaborMinutes(r) || 0), 0);
  box.innerHTML = `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:4px 0 10px;padding:8px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;font-size:13px">
    <span style="font-weight:700;color:#1e40af">Выделено строк: ${rows.length}</span>
    <span>Σ кол-во: <b>${sumQty.toLocaleString('ru')}</b> шт</span>
    <span>Σ трудоёмкость: <b>${Math.round(sumMin).toLocaleString('ru')}</b> мин</span>
    <button class="btn btn-outline btn-sm" onclick="macroSelected.clear();renderMacroplan()">Снять выделение</button>
  </div>`;
}

function addMacro() {
  const contractId = document.getElementById('mpf-c').value.trim();
  const articleItem = document.getElementById('mpf-item').value;
  const month       = mpVal('mpf-month');
  const workshop    = document.getElementById('mpf-ws').value;
  const qtySew  = Math.max(0, parseFloat(document.getElementById('mpf-qty-sew').value) || 0);
  const effEl   = document.getElementById('mpf-eff');
  const eff     = effEl ? Math.max(0, Math.min(999, parseFloat(effEl.value) || 100)) : 100;
  const volTypeEl = document.getElementById('mpf-vol-type');
  const volumeType = volTypeEl ? volTypeEl.value : 'main';
  const opEl = document.getElementById('mpf-op');
  const op = (opEl ? opEl.value : '') || macroCtx.formOp || '';
  const normEl = document.getElementById('mpf-norm');
  const normOverride = normEl && normEl.value !== '' ? +normEl.value : null;
  const ordersEl = document.getElementById('mpf-orders');
  const orderNums = ordersEl ? [...ordersEl.selectedOptions].map(o => o.value).filter(Boolean) : [];
  if (!contractId || !articleItem || !month || !op) {
    _alert('Заполните: контракт, артикул изделия, месяц, ОП');
    return;
  }
  if (qtySew <= 0) {
    _alert('Укажите количество шт');
    return;
  }
  const contract = byId(S.contracts, contractId);
  if (!contract) {
    _alert('Контракт не найден. Выберите контракт из списка.');
    return;
  }
  // БЕЗ агрегации: каждая запись — отдельная строка макроплана,
  // даже если контракт/артикул/ОП/цех/месяц совпадают (нормы и заказы могут отличаться).
  const row = { id: nid(), contractId: contract.id, articleItem, op, workshop, month, qtySew, volumeType, eff };
  if (normOverride != null) row.normOverride = normOverride;
  if (orderNums.length) row.orderNums = orderNums;
  S.macroplan.push(row);
  lastFormInput = { op, workshop, articleItem, month };
  macroCtx.formContract = String(contract.id);
  macroCtx.formWorkshop = workshop;
  clearAddFormDraft(['mpf-c','mpf-item','mpf-month','mpf-ws','mpf-qty-sew','mpf-eff','mpf-vol-type','mpf-op','mpf-norm','mpf-orders']); _suppressDraftCaptureOnce = true;
  save(); renderActive();
}

function updMacroCell(id, val) {
  const r = byId(S.macroplan, id);
  if (!r) return;
  r.qtySew = Math.max(0, +val || 0);
  if (r.qtySew <= 0) S.macroplan = S.macroplan.filter(x => x.id !== id);
  save(); renderActive();
}

function updMacroCellEff(id, val) {
  const r = byId(S.macroplan, id);
  if (!r) return;
  r.eff = Math.max(0, Math.min(999, +val || 100));
  save(); renderActive();
}

function updMacroGroupNorm(contractId, articleItem, op, workshop, volumeType, newValStr) {
  const rows = S.macroplan.filter(r =>
    r.contractId === +contractId && r.articleItem === articleItem &&
    r.op === op && (r.workshop||'') === workshop && (r.volumeType||'main') === volumeType
  );
  const val = newValStr !== '' ? parseFloat(newValStr) : null;
  for (const r of rows) {
    if (val != null && val > 0) r.normOverride = val;
    else delete r.normOverride;
  }
  recalcAllMicroPlans();
  save(); renderActive();
}

function updMacroGroupOrderNums(contractId, articleItem, op, workshop, volumeType, selectEl) {
  const selected = [...selectEl.selectedOptions].map(o => o.value).filter(Boolean);
  const rows = S.macroplan.filter(r =>
    r.contractId === +contractId && r.articleItem === articleItem &&
    r.op === op && (r.workshop||'') === workshop && (r.volumeType||'main') === volumeType
  );
  for (const r of rows) r.orderNums = selected;
  save();
}

function _macroGroupRows(contractId, articleItem, op, workshop, volumeType) {
  return S.macroplan.filter(r =>
    r.contractId === +contractId && r.articleItem === articleItem &&
    r.op === op && (r.workshop||'') === workshop && (r.volumeType||'main') === volumeType
  );
}

function _macroGroupOrderNums(contractId, articleItem, op, workshop, volumeType) {
  return [...new Set(_macroGroupRows(contractId, articleItem, op, workshop, volumeType).flatMap(r => r.orderNums||[]))];
}

function _refreshMacroOrdersTrigger(wrapId, orderNums) {
  const wrap = document.getElementById('macro-ow-' + wrapId);
  if (!wrap) return;
  const summary = wrap.querySelector('div');
  if (summary) summary.innerHTML = orderNums.length
    ? orderNums.map(n => n.replace(/</g,'&lt;')).join(', ')
    : '<span style="color:#cbd5e1">—</span>';
  const btn = wrap.querySelector('.micro-w-trigger');
  if (btn) btn.textContent = `▼ Заказы${orderNums.length ? ` (${orderNums.length})` : ''}`;
}

function _buildMacroOrdersPanelHtml(orderNums, contractId, articleItem, op, workshop, volumeType, wrapId) {
  // Только заказы, совпадающие с контрактом строки и её артикулом ГП.
  const _cNum = byId(S.contracts, +contractId)?.number || '';
  const _gp = articleGpForMacroArticleItem(articleItem);
  const allOrders = (S.orders||[])
    .filter(o => o.number && (!_cNum || o.contractNum === _cNum) && o.articleGp === _gp)
    .map(o=>o.number);
  const available = allOrders.filter(n => !orderNums.includes(n));
  const ci = contractId, ai = articleItem.replace(/'/g,"\\'"), oi = op.replace(/'/g,"\\'"), wi = (workshop||'').replace(/'/g,"\\'"), vi = volumeType||'main', key = wrapId.replace(/'/g,"\\'");
  const listRows = orderNums.length
    ? orderNums.map(n => `<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 10px">
        <span style="font-size:12px;font-weight:600;color:#1e40af">${n.replace(/</g,'&lt;')}</span>
        <button type="button" class="btn btn-danger btn-sm" style="padding:0 5px;font-size:10px" onclick="removeMacroGroupOrder(${ci},'${ai}','${oi}','${wi}','${vi}','${n.replace(/'/g,"\\'")}','${key}')">✕</button>
      </div>`).join('')
    : `<div style="padding:6px 10px;font-size:11px;color:#94a3b8">Нет привязанных заказов</div>`;
  const addRow = available.length
    ? `<div style="display:flex;align-items:center;gap:4px;padding:5px 8px;border-top:1px solid #f1f5f9">
        <select id="macro-ow-add-${wrapId}" style="flex:1;font-size:12px;padding:3px 5px;border:1px solid #d1d5db;border-radius:4px">
          <option value="">— выбрать заказ —</option>
          ${available.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">${n.replace(/</g,'&lt;')}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-outline btn-sm" style="white-space:nowrap;font-size:11px" onclick="addMacroGroupOrder(${ci},'${ai}','${oi}','${wi}','${vi}','${key}')">+ добавить</button>
      </div>`
    : '';
  return `<div>${listRows}</div>${addRow}`;
}

// Per-row (flat) macroplan functions — work on a single S.macroplan record by id

function updMacroRowMonth(id, val) {
  const r = byId(S.macroplan, id);
  if (!r) return;
  r.month = val;
  save(); renderActive();
}

function updMacroRowDeliveryDate(id, val) {
  const r = byId(S.macroplan, id);
  if (!r) return;
  r.deliveryDate = val;
  save();
}

function updMacroRowVolumeType(id, val) {
  const r = byId(S.macroplan, id);
  if (!r) return;
  r.volumeType = val || 'main';
  save(); renderActive();
}

function updMacroRowNormFlat(id, newValStr) {
  const r = byId(S.macroplan, id);
  if (!r) return;
  const newVal = newValStr !== '' ? parseFloat(newValStr) : null;
  if (newVal != null && newVal >= 0) {
    r.normOverride = newVal;
    if (isRcArticleItem(r.articleItem) && (r.orderNums || []).length) {
      if (!S.tcRcOverrides) S.tcRcOverrides = {};
      for (const ord of r.orderNums) S.tcRcOverrides[ord] = newVal;
      r.macroReleaseOrder = r.orderNums[0];
    }
  } else {
    delete r.normOverride;
  }
  // Норма влияет на трудоёмкость → авто-план микроплана нужно пересчитать.
  recalcAllMicroPlans();
  save(); renderActive();
}

async function deleteMacroRow(id) {
  if (!await _confirm('Удалить строку макроплана?')) return;
  S.macroplan = S.macroplan.filter(r => r.id !== id);
  save(); renderMacroplan();
}

function updMacroPivotCell(contractId, articleItem, op, workshop, volumeType, month, qty) {
  const vt = volumeType || 'main';
  const existing = S.macroplan.find(r =>
    r.contractId === +contractId && r.articleItem === articleItem &&
    r.op === op && (r.workshop||'') === (workshop||'') &&
    (r.volumeType||'main') === vt && r.month === month
  );
  if (existing) {
    if (qty > 0) { existing.qtySew = qty; }
    else { S.macroplan = S.macroplan.filter(r => r !== existing); }
  } else if (qty > 0) {
    const anyRow = S.macroplan.find(r =>
      r.contractId === +contractId && r.articleItem === articleItem &&
      r.op === op && (r.workshop||'') === (workshop||'') && (r.volumeType||'main') === vt
    );
    S.macroplan.push({
      id: nextId(), contractId: +contractId, articleItem, op,
      workshop: workshop || '', month, qtySew: qty,
      eff: anyRow?.eff ?? 100, volumeType: vt,
      ...(anyRow?.normOverride != null ? {normOverride: anyRow.normOverride} : {}),
      deliveryDate: anyRow?.deliveryDate || '', orderNums: []
    });
  }
  save(); renderMacroplan();
}

function updMacroPivotEff(contractId, articleItem, op, workshop, volumeType, month, eff) {
  const vt = volumeType || 'main';
  const r = S.macroplan.find(x =>
    x.contractId === +contractId && x.articleItem === articleItem &&
    x.op === op && (x.workshop||'') === (workshop||'') &&
    (x.volumeType||'main') === vt && x.month === month
  );
  if (r) { r.eff = Math.max(0, Math.min(999, eff || 100)); save(); renderMacroplan(); }
}

function updMacroGroupEffFull(contractId, articleItem, op, workshop, volumeType, eff) {
  const vt = volumeType || 'main';
  for (const r of S.macroplan) {
    if (r.contractId === +contractId && r.articleItem === articleItem &&
        r.op === op && (r.workshop||'') === (workshop||'') && (r.volumeType||'main') === vt) {
      r.eff = Math.max(0, Math.min(999, eff || 100));
    }
  }
  save();
  renderMacroplan();
}

function updMacroGroupVolType(contractId, articleItem, op, workshop, oldVt, newVt) {
  const ovt = oldVt || 'main';
  for (const r of S.macroplan) {
    if (r.contractId === +contractId && r.articleItem === articleItem &&
        r.op === op && (r.workshop||'') === (workshop||'') && (r.volumeType||'main') === ovt) {
      r.volumeType = newVt || 'main';
    }
  }
  save();
}

function _buildMacroRowOrdersPanelHtml(orderNums, rowId, wrapId) {
  // Только заказы, совпадающие с контрактом и артикулом ГП строки макроплана.
  const _row = byId(S.macroplan, rowId);
  const _cNum = _row ? (byId(S.contracts, +_row.contractId)?.number || '') : '';
  const _gp = _row ? articleGpForMacroArticleItem(_row.articleItem) : null;
  // Признак строки РЦ: для неё показываем ручные даты полотна/кроя по каждому заказу.
  const _opRec = _row ? (S.ops || []).find(o => o.name === _row.op && (o.workshop || '') === (_row.workshop || '')) : null;
  const _isRc = _opRec ? _opRec.processType === 'РЦ' : (_row && (_row.workshop || '') === 'РЦ');
  const allOrders = (S.orders || [])
    .filter(o => o.number && (!_cNum || o.contractNum === _cNum) && (_gp == null || o.articleGp === _gp))
    .map(o => o.number);
  const available = allOrders.filter(n => !orderNums.includes(n));
  const safeWrap = String(wrapId).replace(/'/g, "\\'");
  const rcDatesHtml = (n) => {
    if (!_isRc) return '';
    const _ord = (S.orders || []).find(o => o.number === n);
    if (!_ord) return '';
    return `<div style="display:flex;gap:10px;padding:0 10px 6px;flex-wrap:wrap">
      <label style="font-size:10px;color:#64748b;display:flex;flex-direction:column;gap:1px">Потребность полотна
        <input type="date" value="${esc(_ord.fabricNeedDate || '')}" style="font-size:11px;padding:1px 3px" onchange="updOrderRcDate(${_ord.id},'fabricNeedDate',this.value,${rowId},'${safeWrap}')"></label>
      <label style="font-size:10px;color:#64748b;display:flex;flex-direction:column;gap:1px">Готовность/отгрузка кроя
        <input type="date" value="${esc(_ord.cutReadyDate || '')}" style="font-size:11px;padding:1px 3px" onchange="updOrderRcDate(${_ord.id},'cutReadyDate',this.value,${rowId},'${safeWrap}')"></label>
    </div>`;
  };
  const listRows = orderNums.length
    ? orderNums.map(n => `<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 10px">
        <span style="font-size:12px;font-weight:600;color:#1e40af">${n.replace(/</g, '&lt;')}</span>
        <button type="button" class="btn btn-danger btn-sm" style="padding:0 5px;font-size:10px" onclick="removeMacroRowOrder(${rowId},'${n.replace(/'/g, "\\'")}','${safeWrap}')">✕</button>
      </div>${rcDatesHtml(n)}`).join('')
    : `<div style="padding:6px 10px;font-size:11px;color:#94a3b8">Нет привязанных заказов</div>`;
  const addRow = available.length
    ? `<div style="display:flex;align-items:center;gap:4px;padding:5px 8px;border-top:1px solid #f1f5f9">
        <select id="macro-ow-add-${esc(wrapId)}" style="flex:1;font-size:12px;padding:3px 5px;border:1px solid #d1d5db;border-radius:4px">
          <option value="">— выбрать заказ —</option>
          ${available.map(n => `<option value="${n.replace(/"/g, '&quot;')}">${n.replace(/</g, '&lt;')}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-outline btn-sm" style="white-space:nowrap;font-size:11px" onclick="addMacroRowOrder(${rowId},'${safeWrap}')">+ добавить</button>

function _macroRowRcDatesSummary(r) {
  if (!r) return '';
  const opRec = (S.ops || []).find(o => o.name === r.op && (o.workshop || '') === (r.workshop || ''));
  const isRc = opRec ? opRec.processType === 'РЦ' : ((r.workshop || '') === 'РЦ');
  if (!isRc) return '';
  const parts = [];
  for (const n of (r.orderNums || [])) {
    const o = (S.orders || []).find(x => x.number === n);
    if (!o || (!o.fabricNeedDate && !o.cutReadyDate)) continue;
    const fn = o.fabricNeedDate ? fmtDate(o.fabricNeedDate) : '—';

    parts.push(`<div style="white-space:nowrap"><b>${esc(n)}</b>: 🧵 ${fn} → ✂ ${cr}</div>`);
  }
  if (!parts.length) return '';
  return `<div style="font-size:10px;color:#64748b;margin-top:2px" title="Потребность полотна → готовность/отгрузка кроя">${parts.join('')}</div>`;

function _positionLaunchPanel(wrap) {
  requestAnimationFrame(() => {
    const panel = wrap.querySelector('.launch-panel');
    if (!panel) return;
    const trigger = wrap.querySelector('.micro-w-trigger') || wrap;
    const rect = trigger.getBoundingClientRect();
    const pw = panel.offsetWidth || 420;
    const ph = panel.offsetHeight || 300;
    let left = rect.left;
    let top = rect.bottom + 4;
    if (left + pw > window.innerWidth - 10) left = Math.max(8, window.innerWidth - pw - 10);
    if (top + ph > window.innerHeight - 10) top = Math.max(8, rect.top - ph - 4);
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
  });
}

function updMacroRowTcRc(contractId, articleItem, op, workshop, volumeType, newValStr) {
  const newVal = parseFloat(newValStr);
  if (isNaN(newVal) || newVal < 0) { renderActive(); return; }
  const entries = S.macroplan.filter(r =>
    r.contractId === +contractId && r.articleItem === articleItem && r.op === op &&
    (r.workshop || '') === (workshop || '') && (r.volumeType || 'main') === (volumeType || 'main')
  );
  for (const r of entries) r.normOverride = newVal;
  // Применяем к tcRcOverrides для всех привязанных заказов на производство
  if (!S.tcRcOverrides) S.tcRcOverrides = {};
  const linkedOrders = [...new Set(entries.flatMap(r => r.orderNums || []))];
  for (const ord of linkedOrders) S.tcRcOverrides[ord] = newVal;
  if (linkedOrders.length) for (const r of entries) r.macroReleaseOrder = linkedOrders[0];
  recalcAllMicroPlans();
  save(); renderActive();
}

function updRcNormForOrder(orderNum, newValStr) {
  const newVal = parseFloat(newValStr);
  if (isNaN(newVal) || newVal < 0) { renderActive(); return; }
  if (!orderNum) { renderActive(); return; }
  if (!S.tcRcOverrides) S.tcRcOverrides = {};

function updContractNumber(contractId, newNumber) {
  const trimmed = newNumber.trim();
  if (!trimmed) return;
  const c = byId(S.contracts, contractId);
  if (!c) return;
  if (c.number === trimmed) return;
  const existing = S.contracts.find(x => x.number === trimmed && x.id !== contractId);
  if (existing) {
    S.macroplan.filter(r => r.contractId === contractId).forEach(r => r.contractId = existing.id);
    save(); renderActive();
  } else {
    c.number = trimmed;
    save(); renderActive();
  }
}

function getArticleOptionsForLaunchRow(row, entry) {
  const stage = row.stage || 'ШЦ';
  if (entry.order === '__extra__') {
    // Доп. объём: показываем все артикулы, доступные для данного ОП/цеха и этапа
    const items = new Set();
    for (const n of S.nomenclature) {
      if (row.op && nomRowOps(n).length && !nomRowOps(n).includes(row.op)) continue;
      if (row.workshop && nomRowWorkshops(n).length && !nomRowWorkshops(n).includes(row.workshop)) continue;
      for (const routeItem of routeForOp(n, row.op)) {
        if (routeItem.stage === stage) items.add(routeItem.articleItem);
      }
      if (stage === 'У') items.add(n.articleGp);
    }
    if (!items.size) {
      for (const n of S.nomenclature) if (n.articleGp) items.add(n.articleGp);
    }
    const sorted = [...items].sort((a,b)=>a.localeCompare(b,'ru'));
    return `<option value="">— выбрать —</option>` + sorted.map(ai => `<option value="${esc(ai)}" ${ai === entry.articleItem ? 'selected' : ''}>${esc(nameOf(ai) || ai)}</option>`).join('');
  }
  // Обычный заказ: ищем ГП и его маршрут
  const ord = entry.order ? S.orders.find(o => releaseOrderEq(o.number, entry.order)) : null;
  if (!ord) return '<option value="">— заказ не выбран —</option>';
  const n = S.nomenclature.find(x => x.articleGp === ord.articleGp);
  if (!n) return `<option value="${esc(ord.articleGp)}">${esc(nameOf(ord.articleGp) || ord.articleGp)}</option>`;
  const _rt = routeForOp(n, row.op);
  if (!_rt.length) return `<option value="${esc(ord.articleGp)}">${esc(nameOf(ord.articleGp) || ord.articleGp)}</option>`;
  const items = _rt.filter(item => item.stage === stage).map(item => item.articleItem);
  if (!items.length) items.push(ord.articleGp);
  return items.map(ai => `<option value="${esc(ai)}" ${ai === entry.articleItem ? 'selected' : ''}>${esc(nameOf(ai) || ai)}</option>`).join('');
}

function bindLaunchPanelEvents(rowId) {
  const wrap = document.getElementById('launch-wrap-' + rowId);
  if (!wrap) return;
  const panel = wrap.querySelector('.launch-panel');
  if (!panel) return;

  // Удаляем старый panel, чтобы не было дублирования обработчиков (проще клонировать)
  const newPanel = panel.cloneNode(true);
  panel.parentNode.replaceChild(newPanel, panel);

  newPanel.addEventListener('change', (e) => {
    const target = e.target;
    const tr = target.closest('tr');
    if (!tr) return;
    const entryId = parseInt(tr.dataset.launchEntryId);
    if (target.classList.contains('launch-order-select')) {
      updLaunchEntry(rowId, entryId, 'order', target.value);
    } else if (target.classList.contains('launch-article-select')) {
      updLaunchEntry(rowId, entryId, 'articleItem', target.value);
    }
  });

  newPanel.addEventListener('blur', (e) => {
    const target = e.target;
    if (target.classList.contains('launch-qty-input')) {
      const tr = target.closest('tr');
      if (!tr) return;
      const entryId = parseInt(tr.dataset.launchEntryId);
      updLaunchEntry(rowId, entryId, 'qty', target.value);
    }
  }, true);

  newPanel.addEventListener('click', (e) => {
    const target = e.target;
    const tr = target.closest('tr');
    if (target.classList.contains('launch-del-btn') && tr) {
      const entryId = parseInt(tr.dataset.launchEntryId);
      removeLaunchEntry(rowId, entryId);
    } else if (target.classList.contains('launch-add-btn')) {
      addLaunchEntry(rowId);
    }
  });
}

// Делегирует в workersAvailableMinSum — устранено дублирование логики расчёта доступных минут.
function calculatePlanReleaseForWorkers(articleItem, op, workshop, workers, processKind) {
  const tc = timeCostForProcess(articleItem, op, processKind || 'SEW');
  if (tc <= 0 || !workers || !workers.length) return 0;
  const availMin = workersAvailableMinSum(workers, op, workshop);
  const total = Math.floor(availMin / tc);
  return total > 0 ? total : 0;
}

function microBrigadesForContext() {
  const op = microCtx.op || '';

    .sort((a, b) => a.name.localeCompare(b.name, 'ru'));
}

function addSchedWorker(sid) {
  const s = byId(S.schedules, sid);
  if (!s) return;
  if (!Array.isArray(s.workers) || !s.workers.length) s.workers = schedWorkers(s).map(w => ({ ...w, id: nid() }));
  s.workers.push({ id: nid(), name: '', staffCount: 0, effPct: 100, absence: true });
  s.staffCount = schedStaffSum(s); s.effPct = schedEffWeighted(s);
  save();
  // Перестроить только содержимое панели + сводку, без перерисовки графика.
  const panel = document.getElementById('sched-w-panel-' + sid);
  if (panel) panel.innerHTML = '<div class="panel-drag-handle" title="Перетащите, чтобы переместить">⠿ перетащить</div>' + schedWorkersTableHtml(s);
  _schedRefreshSummaryDom(s);
}

function updSchedWorkerField(sid, wid, field, val) {
  const s = byId(S.schedules, sid);
  if (!s) return;
  if (!Array.isArray(s.workers) || !s.workers.length) s.workers = schedWorkers(s).map(w => ({ ...w, id: nid() }));
  const w = s.workers.find(x => +x.id === +wid);
  if (!w) return;
  if (field === 'name') w.name = String(val ?? '').trim();
  else if (field === 'staffCount') w.staffCount = Math.max(0, parseFloat(val) || 0);
  else if (field === 'shiftTime') { const v = +val; w.shiftTime = Number.isFinite(v) && v > 0 ? v : 0; }
  else if (field === 'effPct') w.effPct = Math.max(0, parseFloat(val) || 0);
  else if (field === 'absence') w.absence = !!val;
  s.staffCount = schedStaffSum(s);   // производные синхронизируем
  s.effPct = schedEffWeighted(s);
  save();
  _schedRefreshSummaryDom(s);   // без renderSchedules — панель остаётся на месте
}

function delSchedWorker(sid, wid) {
  const s = byId(S.schedules, sid);
  if (!s || !Array.isArray(s.workers) || s.workers.length <= 1) return;
  s.workers = s.workers.filter(x => +x.id !== +wid);
  s.staffCount = schedStaffSum(s);
  s.effPct = schedEffWeighted(s);
  save();
  const panel = document.getElementById('sched-w-panel-' + sid);
  if (panel) panel.innerHTML = '<div class="panel-drag-handle" title="Перетащите, чтобы переместить">⠿ перетащить</div>' + schedWorkersTableHtml(s);
  _schedRefreshSummaryDom(s);
}

// ===== Состав работников на КОНКРЕТНЫЙ ДЕНЬ (переопределение calOverride.workers) =====
function _calOv(sid, date) { return (S.calOverrides || []).find(o => o.scheduleId === sid && o.date === date); }
function _ensureCalOv(sid, date) {
  let o = _calOv(sid, date);
  if (!o) { o = { scheduleId: sid, date }; S.calOverrides.push(o); }
  return o;
}
/** Гарантирует явный состав дня (целыми) — инициализирует из текущего состояния дня, если нет. */
function materializeDayWorkers(sid, date) {
  const s = byId(S.schedules, sid);
  const o = _ensureCalOv(sid, date);
  if (!Array.isArray(o.workers) || !o.workers.length) {
    const cs = getCellState(s, date);
    o.workers = cs.workers.map(w => ({
      id: nid(), name: w.name || '', staffCount: +w.staffCount || 0,
      shiftTime: (+w.shiftTime > 0) ? +w.shiftTime : 0,
      effPct: (w.effPct != null && Number.isFinite(+w.effPct)) ? +w.effPct : 100,
      absence: w.absence !== false
    }));
  }
  return o;
}
function _dayPanelHandle() { return '<div class="panel-drag-handle" title="Перетащите, чтобы переместить">⠿ состав дня</div>'; }

function dayCompTableHtml(sid, date) {
  const s = byId(S.schedules, sid);

  const rows = ws.map(w => `<tr>

    <td><input type="number" min="1" value="${esc((+w.shiftTime > 0) ? w.shiftTime : (s.shiftTime || 480))}" style="width:60px;font-size:11px" title="Смена, мин" onkeydown="if(event.key==='Enter')this.blur()" onblur="updDayWorkerField(${sid},'${date}',${w.id},'shiftTime',this.value)"></td>
    <td><input type="number" min="0" value="${esc(w.effPct != null ? w.effPct : 100)}" style="width:56px;font-size:11px" title="Эффективность, %" onkeydown="if(event.key==='Enter')this.blur()" onblur="updDayWorkerField(${sid},'${date}',${w.id},'effPct',this.value)"></td>
    <td style="text-align:center"><input type="checkbox" ${w.absence === false ? '' : 'checked'} title="Учитывать абсентеизм (×0.95)" style="width:14px;height:14px" onchange="updDayWorkerField(${sid},'${date}',${w.id},'absence',this.checked)"></td>

  <table class="micro-w-workers-table"><thead><tr>
    <th>Группа</th><th>Числ.</th><th>Смена</th><th>Эфф.%</th><th>Абсентеизм</th><th></th>

function _afterDayCompChange(sid, date, rebuild) {

    const cs = getCellState(byId(S.schedules, sid), date);
    inp.value = cs.staffCount ? Math.round(cs.staffCount) : '';
  }
  syncMicroplanFromSchedule(sid, date);
  renderMicroplan();

    const p = document.getElementById('day-comp-panel');
    if (p && p.style.display !== 'none') p.innerHTML = _dayPanelHandle() + dayCompTableHtml(sid, date);

function addDayWorker(sid, date) {

  o.workers.push({ id: nid(), name: '', staffCount: 0, shiftTime: 0, effPct: 100, absence: true });
  _afterDayCompChange(sid, date, true);
}
function updDayWorkerField(sid, date, wid, field, val) {
  const o = materializeDayWorkers(sid, date);
  const w = o.workers.find(x => +x.id === +wid);
  if (!w) return;
  if (field === 'name') w.name = String(val ?? '').trim();
  else if (field === 'staffCount') w.staffCount = Math.max(0, parseFloat(val) || 0);
  else if (field === 'shiftTime') { const v = +val; w.shiftTime = Number.isFinite(v) && v > 0 ? v : 0; }
  else if (field === 'effPct') w.effPct = Math.max(0, parseFloat(val) || 0);

  _afterDayCompChange(sid, date, false);
}
function delDayWorker(sid, date, wid) {

  _afterDayCompChange(sid, date, true);
}
/** Вернуть базовый состав бригады на этот день (убрать переопределение состава). */
function resetDayWorkers(sid, date) {
  const o = _calOv(sid, date);
  if (o) { delete o.workers; if (o.staffCount == null && !o.dayType) { S.calOverrides = S.calOverrides.filter(x => x !== o); } }
  save();
  syncMicroplanFromSchedule(sid, date);
  renderSchedules(); renderMicroplan();
}

function addMicroWorker(rowId) {
  const r = byId(S.microplan, rowId);
  if (!r) return;
  flushMicroWorkerInputsFromDom(rowId);
  microWorkersDetailsOpenRowId = rowId;
  if (!Array.isArray(r.workers)) r.workers = [];
  const maxOrd = r.workers.reduce((m, w) => Math.max(m, Number.isFinite(+w.order) ? +w.order : -1), -1);
  const _sched = byId(S.schedules, r.scheduleId);
  r.workers.push({
    id: nid(),
    name: '',
    order: maxOrd + 1,
    staffCount: 0,
    attendance: 0,
    shiftTime: shiftDurationOf(r.op, r.workshop),
    effPct: defaultEffPct(r.op, r.workshop),
    absence: _sched ? (_sched.absence !== false) : true   // дефолт абсентеизма бригады
  });
  recalcPlanRelease(r);
  save();
  renderActive();
}

function delMicroWorker(rowId, workerId) {
  const r = byId(S.microplan, rowId);
  if (!r || !Array.isArray(r.workers)) return;
  if (r.workers.length <= 1) {
    _alert('Нужна хотя бы одна группа работников.');
    return;
  }
  microWorkersDetailsOpenRowId = rowId;
  flushMicroWorkerInputsFromDom(rowId);
  r.workers = r.workers.filter(w => +w.id !== +workerId);
  r.workers.forEach((w, i) => { w.order = i; });
  recalcPlanRelease(r);
  save();
  renderActive();
}

/** Галочка абсентеизма в составе строки микроплана — влияет на план выпуска этой строки. */
function updMicroWorkerField(rowId, workerId, field, rawVal) {
  const r = byId(S.microplan, rowId);
  if (!r || !Array.isArray(r.workers)) return;
  flushMicroWorkerInputsFromDom(rowId);
  const w = r.workers.find(x => +x.id === +workerId);
  if (!w) return;
  microWorkersDetailsOpenRowId = rowId;
  if (field === 'name') {
    w.name = String(rawVal ?? '').trim();
  } else if (field === 'staffCount') {
    w.staffCount = Math.max(0, parseFloat(rawVal) || 0);
  } else if (field === 'attendance') {
    w.attendance = Math.max(0, parseFloat(rawVal) || 0);
  } else if (field === 'shiftTime') {
    const v = +rawVal;
    w.shiftTime = Number.isFinite(v) && v > 0 ? v : shiftDurationOf(r.op, r.workshop);
  } else if (field === 'effPct') {
    const t = String(rawVal ?? '').trim();
    if (t === '') w.effPct = defaultEffPct(r.op, r.workshop);
    else {
      const val = Number(t);
      w.effPct = Number.isFinite(val) && val >= 0 ? val : defaultEffPct(r.op, r.workshop);
    }
  } else if (field === 'absence') {
    w.absence = !!rawVal;
  }
  recalcPlanRelease(r);
  save();
  renderActive();
}


let launchPanelOutsideBound = false;
function bindLaunchPanelOutsideOnce() {
  if (launchPanelOutsideBound) return;
  launchPanelOutsideBound = true;
  document.addEventListener('mousedown', (e) => {
    const t = e.target;
    if (!t || !t.closest) return;
    // Обрабатываем только панели на вкладке микроплана
    document.querySelectorAll('#tab-microplan .launch-wrap.launch-open, #tab-macroplan .launch-wrap.launch-open').forEach(wrap => {
      if (wrap.contains(t)) return;
      wrap.classList.remove('launch-open');
    });
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('#tab-microplan .launch-wrap.launch-open, #tab-macroplan .launch-wrap.launch-open').forEach(w => w.classList.remove('launch-open'));
  });
}

function renderMicroplan() {
  const el = document.getElementById('tab-microplan');
  bindMicroWorkersPanelOutsideOnce();
  bindLaunchPanelOutsideOnce();
  migrateMicroplanArticleItems();
  migrateMicroplanWorkers();
  const prevWrap = el.querySelector('.table-wrap');
  microScrollState = {
    paneTop: el.scrollTop || 0,
    tableTop: prevWrap ? prevWrap.scrollTop : 0,
    tableLeft: prevWrap ? prevWrap.scrollLeft : 0
  };
  const allOps = [...new Set(S.ops.map(o=>o.name).concat(S.macroplan.map(r=>r.op).filter(Boolean)))];

  const allBrigades = microBrigadesForContext();

  // Список переделов для фильтра «Передел» — присутствующие в микроплане (с учётом ОП),
  // в технологическом порядке РЦ→АЦ→ШЦ→У.
  const STAGE_ORDER_M = ['РЦ', 'АЦ', 'ШЦ', 'У', 'База'];
  const stageScopeRows = microCtx.op ? S.microplan.filter(r => r.op === microCtx.op) : S.microplan;
  const stageListForCtx = STAGE_ORDER_M.filter(st => stageScopeRows.some(r => stageOfMacroRow(r) === st));

  // Иерархические базы для фильтров: каждый уровень зависит только от предыдущих
  const _baseOpWsBrig = S.microplan.filter(r => {
    if (microCtx.op && r.op !== microCtx.op) return false;
    if (microCtx.stages?.length && !microCtx.stages.includes(stageOfMacroRow(r))) return false;
    if (microCtx.brigade && String(r.scheduleId) !== String(microCtx.brigade)) return false;
    return true;
  });
  // В список заказов для фильтра включаем и ПОДЗАКАЗЫ (второй заказ в смене) — иначе заказ,
  // который идёт не первой строкой, в фильтре не появлялся и не находился.
  const _allOrders = [...new Set(_baseOpWsBrig.flatMap(r => [r.releaseOrder, ...(r.subOrders||[]).map(s=>s.releaseOrder), ...(r.launches||[]).map(le=>le.order)].filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'ru'));
  const _baseForArticles = _baseOpWsBrig.filter(r => {
    if (microCtx.orderFilters?.length && !microCtx.orderFilters.some(f => releaseOrderEq(r.releaseOrder, f) || (r.subOrders||[]).some(s=>releaseOrderEq(s.releaseOrder,f)) || (r.launches||[]).some(le=>releaseOrderEq(le.order,f)))) return false;
    return true;
  });
  const _allArticles = [...new Set(_baseForArticles.flatMap(r => microRowArticleItems(r)))].sort((a,b)=>a.localeCompare(b,'ru'));
  const _baseForMonths = _baseForArticles.filter(r => {
    if (microCtx.articleFilter && !microRowArticleItems(r).includes(microCtx.articleFilter)) return false;
    return true;
  });
  const allMonths = [...new Set(_baseForMonths.map(r => (r.date||'').slice(0,7)).filter(Boolean))].sort();


  const _ctxBrigade = microCtx.brigade ? allBrigades.find(b => String(b.id) === String(microCtx.brigade)) : null;
  const _ctxLabel = [
    microCtx.op ? `ОП: ${microCtx.op}` : null,
    microCtx.stages?.length ? `Передел: ${microCtx.stages.join(', ')}` : null,
    _ctxBrigade ? `Бригада: ${_ctxBrigade.name}` : null,
  ].filter(Boolean).join(' · ');

  let html = `<div class="sec-title">Микроплан${_ctxLabel ? `<span style="font-size:11px;font-weight:400;color:#64748b;margin-left:10px">${esc(_ctxLabel)}</span>` : ''}</div>
  <div class="ctx-bar">
    <label>ОП
      <select id="ctx-op" onchange="microCtx.op=this.value;microCtx.stages=[];microCtx.brigade='';microCtx.articleFilter='';microCtx.orderFilters=[];renderMicroplan()">
        <option value="">Все</option>
        ${allOps.map(op=>`<option ${microCtx.op===op?'selected':''} value="${esc(op)}">${esc(op)}</option>`).join('')}
      </select>
    </label>
    <label>Передел
      ${stageListForCtx.length ? checkboxFilterHtml('micro-stage-list', stageListForCtx, microCtx.stages, 'microApplyStagesFromChecks') : '<span style="font-size:12px;color:#94a3b8">—</span>'}
    </label>
    <label>Бригада
      <select id="ctx-brigade" onchange="microCtx.brigade=this.value;renderMicroplan()" title="Фильтр по бригаде">
        <option value="">Все</option>
        ${allBrigades.map(b=>`<option value="${b.id}" ${String(microCtx.brigade)===String(b.id)?'selected':''}>${esc(b.name)} (${esc(b.workshop)})</option>`).join('')}
      </select>
    </label>
    <label>Заказы
      ${_allOrders.length ? checkboxFilterHtml('micro-order-list', _allOrders, microCtx.orderFilters, 'microApplyOrdersFromChecks', o => o === '__extra__' ? 'Доп. объём' : o) : '<span style="font-size:12px;color:#94a3b8">—</span>'}
    </label>
    <label>Артикул
      <select id="ctx-article" onchange="microCtx.articleFilter=this.value;renderMicroplan()">
        <option value="">Все</option>
        ${_allArticles.map(a=>`<option value="${esc(a)}" ${microCtx.articleFilter===a?'selected':''}>${esc(a)}</option>`).join('')}
      </select>
    </label>
    <label>Месяц
      ${allMonths.length ? checkboxFilterHtml('micro-month-list', allMonths, microCtx.months, 'microApplyMonthsFromChecks', m => mlabel(m)) : '<span style="font-size:12px;color:#94a3b8">—</span>'}
    </label>
    <button class="ctx-bar-btn" onclick="microCtx={op:'',stages:[],brigade:'',months:[_curYm()],articleFilter:'',orderFilters:[]};renderMicroplan()">Сбросить</button>
    <label style="margin-left:auto">Проверки
      <span style="display:inline-flex;border:1px solid #d1d5db;border-radius:6px;overflow:hidden" title="Без — проверки выключены; Прямой — РЦ→АЦ→ШЦ→У; От ШЦ — ШЦ якорь, РЦ/АЦ проверяются на достаточность">
        ${[['off','Без'],['forward','Прямой'],['fromShc','От ШЦ']].map(([m,lbl],i) =>
          `<button type="button" onclick="setMicroCheckMode('${m}')" style="border:none;${i?'border-left:1px solid #d1d5db;':''}padding:4px 10px;font-size:11px;cursor:pointer;background:${microCheckMode===m?'#2563eb':'#fff'};color:${microCheckMode===m?'#fff':'#334155'}">${lbl}</button>`
        ).join('')}
      </span>
    </label>
  </div>`;

  // Средняя эффективность с учётом освоения — по текущим фильтрам ОП/цех/месяцы
  if (microCtx.op && microCtx.months?.length) {
    const effByMonth = microCtx.months.map(ym => {
      // Узкая эфф. по одному цеху доступна только если выбран ровно один передел с одним цехом у ОП.
      const _stWss = microCtx.stages?.length === 1
        ? [...new Set(S.ops.filter(o => o.name === microCtx.op && o.processType === microCtx.stages[0]).map(o => o.workshop))]
        : [];
      const ws = _stWss.length === 1 ? _stWss[0] : null;
      const v = microAvgEffPctForOpMonth(microCtx.op, ym, ws ?? undefined);
      return v != null ? `${mlabel(ym)}: <b>${v}%</b>` : null;
    }).filter(Boolean);
    if (effByMonth.length) {
      html += `<div style="padding:6px 16px 2px;font-size:11px;color:#475569">
        <span style="color:#64748b">Средняя эфф. (с учётом освоения):</span>&ensp;${effByMonth.join('&ensp;·&ensp;')}
      </div>`;
    }
  }

  let rows = [...S.microplan];
  if (microCtx.op)                    rows = rows.filter(r => r.op===microCtx.op);
  if (microCtx.stages?.length)        rows = rows.filter(r => microCtx.stages.includes(stageOfMacroRow(r)));
  if (microCtx.brigade)               rows = rows.filter(r => String(r.scheduleId) === String(microCtx.brigade));
  if (microCtx.months?.length)        rows = rows.filter(r => microCtx.months.includes((r.date||'').slice(0,7)));
  if (microCtx.articleFilter)         rows = rows.filter(r => microRowArticleItems(r).includes(microCtx.articleFilter));
  if (microCtx.orderFilters?.length)  rows = rows.filter(r => microCtx.orderFilters.some(f => releaseOrderEq(r.releaseOrder, f) || (r.subOrders||[]).some(s=>releaseOrderEq(s.releaseOrder,f)) || (r.launches||[]).some(le=>releaseOrderEq(le.order,f))));
  if (mpFrom) rows = rows.filter(r => r.date >= mpFrom);
  if (mpTo)   rows = rows.filter(r => r.date <= mpTo);
  // Сортировка: по дате, затем В ПРЕДЕЛАХ ДНЯ — по переделам маршрута (РЦ→АЦ→ШЦ→У), затем стабильно по id.
  const _STG_ORD = { 'РЦ': 0, 'АЦ': 1, 'ШЦ': 2, 'У': 3, 'База': 4 };
  rows.sort((a, b) =>
    String(a.date || '').localeCompare(String(b.date || ''))
    || ((_STG_ORD[stageOfMacroRow(a)] ?? 9) - (_STG_ORD[stageOfMacroRow(b)] ?? 9))
    || ((+a.id || 0) - (+b.id || 0))
  );

  // Сводка заказов на производство по видимым строкам микроплана
  const _visibleOrderNums = [...new Set(rows.flatMap(r => [r.releaseOrder, ...(r.subOrders||[]).map(s=>s.releaseOrder)].filter(Boolean)))];
  if (_visibleOrderNums.length) {
    const _orderRows = _visibleOrderNums.map(num => {
      const isExtra = num === '__extra__';
      const ord = isExtra ? null : S.orders.find(o => releaseOrderEq(o.number, num));
      const qty = ord ? (+ord.quantity || 0) : 0;

      // Для Доп. объёма — артикулы ГП и кол-во из макроплана
      let extraGps = '', extraMacroQty = 0;
      if (isExtra) {
        const gpSet = new Set();
        const _addExtraAi = (ai) => {
          if (!ai) return;
          const gp = S.nomenclature.find(n => n.articleGp === ai || allRoutesOf(n).some(rt => rt.articleItem === ai))?.articleGp || ai;
          if (gp) gpSet.add(gp);
        };
        for (const r of S.microplan) {
          if (r.releaseOrder === '__extra__') _addExtraAi(microRowArticleItems(r)[0] || r.articleItem || '');
          for (const sub of (r.subOrders || [])) {
            if (sub.releaseOrder === '__extra__') _addExtraAi((sub.articleItems || [])[0] || '');
          }
        }
        extraGps = [...gpSet].sort((a, b) => a.localeCompare(b, 'ru')).join(', ');
        const _visExtraOps = new Set(rows.filter(r2 => r2.releaseOrder === '__extra__').map(r2 => r2.op).filter(Boolean));
        const _extraByStg = {};
        for (const mr of S.macroplan) {
          if ((mr.volumeType || 'main') !== 'extra') continue;
          if (_visExtraOps.size && !_visExtraOps.has(mr.op)) continue;
          const _opR = S.ops.find(o => o.name === mr.op && o.workshop === mr.workshop);
          const _mSt = _opR?.processType || mr.workshop;
          _extraByStg[_mSt] = (_extraByStg[_mSt] || 0) + macroRowKitQuantity(mr);
        }
        extraMacroQty = _extraByStg['У'] || _extraByStg['ШЦ'] || 0;
      }

      const stageStats = (stage) => {
        // Передел, которого нет в маршруте заказа, не показываем (Ост. = «—»).
        if (ord) {
          const _rStages = routeStagesForGp(ord.articleGp);
          if (_rStages.size && !_rStages.has(stage)) return null;
        }
        // ОБЩИЙ остаток по переделу = кол-во заказа − ВЕСЬ факт этого передела (по всем артикулам,
        // бригадам и цехам — один заказ могут делать на разных ОП). Не дробим по узлам.
        let done = 0;
        for (const r of S.microplan) {
          if ((r.stage || 'ШЦ') !== stage) continue;
          if (releaseOrderEq(r.releaseOrder, num)) done += (+r.factRelease || 0);
          for (const sub of (r.subOrders || [])) {
            if (releaseOrderEq(sub.releaseOrder, num)) done += (+sub.factRelease || 0);
          }
        }
        if (qty <= 0 && done <= 0) return null;
        return [{ plan: done, remaining: Math.max(0, qty - done) }];
      };
      const cellRem = (stage) => {
        const stats = stageStats(stage);
        if (!stats) return `<td class="ro" style="text-align:right;color:#94a3b8">—</td>`;
        const allDone = stats.every(s => s.remaining === 0);
        const anyProgress = stats.some(s => s.plan > 0);
        const col = allDone ? '#16a34a' : anyProgress ? '#b45309' : '#64748b';
        const text = stats.map(s => s.remaining.toLocaleString('ru')).join(' / ');
        return `<td class="ro" style="text-align:right;font-weight:600;color:${col};white-space:nowrap">${text}</td>`;
      };
      // Для Доп. объёма: остаток = макроплан (доп) - план микроплана по стадии
      const cellRemExtra = (stage) => {
        // Собираем кол-во из макроплана по артикулу
        const macroByAI = new Map();
        for (const mr of S.macroplan) {
          if ((mr.volumeType || 'main') !== 'extra') continue;
          const _opR = S.ops.find(o => o.name === mr.op && o.workshop === mr.workshop);
          if ((_opR?.processType || mr.workshop) !== stage) continue;
          const ai = mr.articleItem || '';
          macroByAI.set(ai, (macroByAI.get(ai) || 0) + macroRowKitQuantity(mr));
        }
        if (!macroByAI.size) return `<td class="ro" style="text-align:right;color:#94a3b8">—</td>`;
        // Собираем план микроплана по артикулу
        const planByAI = new Map();
        for (const mr of S.microplan) {
          if (mr.stage !== stage) continue;
          if (mr.releaseOrder === '__extra__') {
            const ai = (microRowArticleItems(mr)[0]) || '';
            planByAI.set(ai, (planByAI.get(ai) || 0) + (+mr.planRelease || 0));
          }
          for (const sub of (mr.subOrders || [])) {
            if (sub.releaseOrder !== '__extra__') continue;
            const ai = (sub.articleItems || [])[0] || '';
            planByAI.set(ai, (planByAI.get(ai) || 0) + (+sub.planRelease || 0));
          }
        }
        const entries = [...macroByAI.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ru'));
        const remArr = entries.map(([ai, mQty]) => Math.max(0, mQty - (planByAI.get(ai) || 0)));
        const allDone = remArr.every(x => x === 0);
        const anyProgress = [...planByAI.values()].some(p => p > 0);
        const col = allDone ? '#16a34a' : anyProgress ? '#b45309' : '#64748b';
        const titleTxt = entries.map(([ai, mQty]) => `${ai}: ${mQty - (planByAI.get(ai)||0)}`).join(', ');
        return `<td class="ro" style="text-align:right;font-weight:600;color:${col};white-space:nowrap" title="${esc(titleTxt)}">${remArr.map(x => x.toLocaleString('ru')).join(' / ')}</td>`;
      };
      return `<tr${isExtra ? ' style="background:#f0fdf4"' : ''}>
        <td style="font-weight:600;white-space:nowrap${isExtra ? ';color:#15803d' : ''}">${isExtra ? 'Доп. объём' : esc(num)}</td>
        <td class="ro">${isExtra ? esc(extraGps || '—') : (ord ? esc(ord.articleGp) : '—')}</td>
        <td class="ro" style="text-align:right">${isExtra ? (extraMacroQty > 0 ? extraMacroQty.toLocaleString('ru') : '—') : (qty > 0 ? qty.toLocaleString('ru') : '—')}</td>
        ${isExtra ? cellRemExtra('РЦ')+cellRemExtra('АЦ')+cellRemExtra('ШЦ')+cellRemExtra('У') : cellRem('РЦ')+cellRem('АЦ')+cellRem('ШЦ')+cellRem('У')}
      </tr>`;
    }).join('');
    html += `<div style="margin-bottom:10px;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;background:#fff">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:#f8fafc">
          <th style="padding:5px 8px;text-align:left;border-bottom:1px solid #e2e8f0">Заказ</th>
          <th style="padding:5px 8px;text-align:left;border-bottom:1px solid #e2e8f0">Артикул ГП</th>
          <th style="padding:5px 8px;text-align:right;border-bottom:1px solid #e2e8f0">Кол-во</th>
          <th style="padding:5px 8px;text-align:right;border-bottom:1px solid #e2e8f0" title="Осталось выпустить = кол-во заказа − факт, передел РЦ">Ост. РЦ</th>
          <th style="padding:5px 8px;text-align:right;border-bottom:1px solid #e2e8f0" title="Осталось выпустить = кол-во заказа − факт, передел АЦ">Ост. АЦ</th>
          <th style="padding:5px 8px;text-align:right;border-bottom:1px solid #e2e8f0" title="Осталось выпустить = кол-во заказа − факт, передел ШЦ">Ост. ШЦ</th>
          <th style="padding:5px 8px;text-align:right;border-bottom:1px solid #e2e8f0" title="Осталось выпустить = кол-во заказа − факт, передел У">Ост. У</th>
        </tr></thead>
        <tbody>${_orderRows}</tbody>
      </table>
    </div>`;
  }

  html += `<div class="table-wrap"><table><thead>
      <tr><th title="Дата строки микроплана">Дата</th><th title="ОП, Цех, Бригада и передел">ОП / Цех / Бригада</th><th title="Наименование изделия/строки">Наименование</th><th title="Допускается выбор нескольких изделий">Артикул изделия</th><th title="Артикул готовой продукции">Артикул (ГП)</th>
      <th title="Норматив трудоемкости из номенклатуры">Затрата (мин/шт)</th><th title="Состав работников: списочная, явка, смена, эффективность">Работники</th>
      <th title="Эффективность освоения нового ассортимента (кривая роста)">Эфф.<br><span style="font-weight:400;font-size:10px">освоения</span></th>
      <th>Запуск <span style="font-weight:400;font-size:10px;color:#64748b">(заказ и шт)</span></th>
      <th title="Производственный заказ выпуска">Заказ выпуска</th>
      <th title="План выпуска, шт">План выпуска</th><th title="Фактический выпуск, шт">Факт выпуска</th>
      <th title="% выполнения = Σ(факт × норма) / Σ(план 100% × норма) по строке и её подзаказам">% вып.</th>
      <th title="Незавершенное производство">НЗП</th><th title="Комментарий (причина отклонения)">Коммент.</th></tr>
     </thead><tbody>`;

  const { wip, wipSubs } = precomputeWip();

  if (!rows.length) html += `<tr><td colspan="15" class="empty">Нет данных. Выберите ОП и добавьте строки.</td></tr>`;

  let _lastMicroMonth = '';
  let _lastMicroDate = '';
  let _dayBand = 0;
  for (const r of rows) {
      const _rowMonth = (r.date || '').slice(0, 7);
      if (_rowMonth && _rowMonth !== _lastMicroMonth) {
        _lastMicroMonth = _rowMonth;
        const _monthCount = rows.filter(x => (x.date || '').startsWith(_rowMonth)).length;
        html += `<tr style="background:#1e293b;color:#fff"><td colspan="15" style="padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.03em">
          <div style="display:flex;align-items:center;gap:10px">
            <span>${esc(mlabel(_rowMonth))}</span>
            <span style="color:#94a3b8;font-weight:400;font-size:11px">${_monthCount} строк</span>
          </div>
        </td></tr>`;
      }
