          <td class="ro ${_isRC?'':wipSubVal>0?'wip-pos':'wip-zero'}">${_isRC?'—':wipSubVal}</td>
        </tr>`;
      }).join('')}`;
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;

  const nextWrap = el.querySelector('.table-wrap');
  const reopenMicroWorkersRowId = microWorkersDetailsOpenRowId;
  microWorkersDetailsOpenRowId = null;

  requestAnimationFrame(() => {
    el.scrollTop = microScrollState.paneTop || 0;
    if (nextWrap) {
      nextWrap.scrollTop = microScrollState.tableTop || 0;
      nextWrap.scrollLeft = microScrollState.tableLeft || 0;
    }
    if (reopenMicroWorkersRowId != null) {
      const wrap = document.getElementById('micro-w-wrap-' + reopenMicroWorkersRowId);
      if (wrap) {
        wrap.classList.add('micro-w-open');
        const panel = wrap.querySelector('.micro-w-panel');
        const trigger = wrap.querySelector('.micro-w-trigger');
        if (panel && trigger) {
          const rect = trigger.getBoundingClientRect();
          const panelW = Math.min(540, window.innerWidth - 32);
          let left = rect.left;
          if (left + panelW > window.innerWidth - 8) left = Math.max(8, window.innerWidth - panelW - 8);
          panel.style.left = left + 'px';
          panel.style.top = Math.min(rect.bottom + 4, window.innerHeight - 210) + 'px';
          panel.style.width = panelW + 'px';
        }
      }
    }
  });

  // Открытие панели запуска, если нужно
  if (launchOpenRowId != null) {
    const wrap = document.getElementById('launch-wrap-' + launchOpenRowId);
    if (wrap) {
      wrap.classList.add('launch-open');
      if (launchOpenRowIdNeedsRepos) {
        requestAnimationFrame(() => {
          positionLaunchPanel(wrap);
        });
        launchOpenRowIdNeedsRepos = false;
      } else {
        positionLaunchPanel(wrap);
      }
    }
    launchOpenRowId = null;
  }
  // После отрисовки таблицы заполняем панели запуска для всех видимых строк
  requestAnimationFrame(() => {
    for (const row of rows) {
      refreshLaunchPanel(row.id);
    }
  });

}


function hlOrder(key, on) {
  if (!key) return;
  document.querySelectorAll(`td[data-order="${key}"]`).forEach(td => {
    td.style.background = on ? '#fef9c3' : '';
  });
}

/** Все строки той же БРИГАДЫ-ДНЯ (общий пул мощности): тот же scheduleId (или op|workshop), дата и передел. */
function brigadeDayGroupRows(row) {
  if (!row) return [];
  const key = (r) => (r.scheduleId != null && r.scheduleId !== '' ? 'S' + r.scheduleId : 'W' + (r.op || '') + '|' + (r.workshop || ''))
    + '|' + (r.date || '') + '|' + (r.stage || 'ШЦ');
  const k = key(row);
  return (S.microplan || []).filter(r => key(r) === k);
}

/** Сырой физический пул минут бригады-дня (ФРВ × абсентеизм × эфф.работников), БЕЗ эфф. освоения. */
function brigadeDayPoolRawMin(groupRows) {
  return groupRows.reduce((s, g) => s + workersAvailableMinSum(microRowWorkers(g), g.op, g.workshop), 0);
}

/** Физические минуты, уже занятые ДРУГИМИ строками бригады-дня (штуки × норма / эфф.освоения). */
function brigadeDayUsedByOthersRawMin(row, groupRows) {
  let used = 0;
  for (const g of groupRows) {
    if (g === row || g.id === row.id) continue;
    const gLEff = Math.max(0.01, (g.learningEff ?? 100) / 100);
    const gTc = [...new Set(microRowArticleItems(g))].reduce((s, ai) => s + tcForMicroRow(g, ai), 0);
    used += gTc > 0 ? (+g.planRelease || 0) * gTc / gLEff : 0;
    for (const sub of (g.subOrders || [])) {
      const subTc = tcForSubOrder(sub, g.op, g.stage);
      const subLEff = Math.max(0.01, (sub.learningEff ?? 100) / 100);
      used += subTc > 0 ? (+sub.planRelease || 0) * subTc / subLEff : 0;
    }
  }
  return used;
}

function _recalcPlanReleaseCore(microRow) {
  if (!microRow) return;
  migrateMicroplanWorkers();
  const workers = microRowWorkers(microRow);
  const ais = [...new Set(microRowArticleItems(microRow))];
  microRow.planByArticle = {};

  const subs = microRow.subOrders || [];
  const tc1 = ais.reduce((s, ai) => s + tcForMicroRow(microRow, ai), 0);
  const tcSubs = subs.map(sub => tcForSubOrder(sub, microRow.op, microRow.stage));
  const totalSubTc = tcSubs.reduce((s, v) => s + v, 0);
  // Доступные физические минуты ЭТОЙ строки = общий пул бригады-дня минус занятое другими строками.
  const _grp = brigadeDayGroupRows(microRow);
  const _poolRaw = brigadeDayPoolRawMin(_grp);
  const _usedOthers = brigadeDayUsedByOthersRawMin(microRow, _grp);
  const availMin = Math.max(0, _poolRaw - _usedOthers);
  const _lEffFactor = Math.max(0.01, (microRow.learningEff ?? 100)) / 100;
  const effectiveAvailMin = availMin * _lEffFactor;
  const myStage = microRow.stage || 'ШЦ';

  // Основной пул бригады-дня (минуты за 100% времени) для разбивки плана осн./доп.
  // Заполняется по приоритету: сначала главный заказ полностью, затем подзаказы по порядку.
  const _effRow = microRowEffPct(workers, microRow.op, microRow.workshop);
  const _mainPoolMin = _effRow > 100 ? availMin * 100 / _effRow : availMin;
  let _mainUsed = 0;

  let newPlan = 0;

  if (!workers.length || !ais.length) {
    newPlan = 0;

  } else if (subs.length > 0 && !microRow.planReleaseIsManual) {
    // Главный заказ: мощность смены, но не больше остатка по заказу (лимит 6a)
    newPlan = tc1 > 0 && effectiveAvailMin > 0 ? Math.round(effectiveAvailMin / tc1) : 0;
    if (microRow.releaseOrder) {
      const ord = S.orders.find(o => releaseOrderEq(o.number, microRow.releaseOrder));
      if (ord && (+ord.quantity || 0) > 0) {
        const releasedBefore = orderCoveredBefore(microRow.releaseOrder, myStage, microRow.date,
          { excludeRowId: microRow.id });
        const plannedSameDay = orderStagePlannedQty(microRow.releaseOrder, myStage, microRow.date,
          { excludeRowId: microRow.id, metric: 'plan', when: '==', skipManualMain: true });
        const remaining = Math.max(0, +ord.quantity - releasedBefore - plannedSameDay);
        newPlan = Math.min(newPlan, remaining);
      }
    }
    for (const ai of ais) microRow.planByArticle[ai] = newPlan;

  } else if (ais.length === 1) {
    // Один артикул — мощность смены через норму строки (tc1 уже учитывает ПЕРЕДЕЛ строки:
    // для У берётся норма У 4.79, а не ШЦ 236.94).
    newPlan = tc1 > 0 && effectiveAvailMin > 0 ? Math.round(effectiveAvailMin / tc1) : 0;
    // Лимит остатка заказа (6a) — один артикул
    if (!microRow.planReleaseIsManual && microRow.releaseOrder) {
      const ord = S.orders.find(o => releaseOrderEq(o.number, microRow.releaseOrder));
      if (ord && (+ord.quantity || 0) > 0) {
        const releasedBefore = orderCoveredBefore(microRow.releaseOrder, myStage, microRow.date,
          { excludeRowId: microRow.id });
        const plannedSameDay = orderStagePlannedQty(microRow.releaseOrder, myStage, microRow.date,
          { excludeRowId: microRow.id, metric: 'plan', when: '==', skipManualMain: true });
        const remaining = Math.max(0, (+ord.quantity) - releasedBefore - plannedSameDay);
        newPlan = Math.min(newPlan, remaining);
      }
    }
    microRow.planByArticle[ais[0]] = newPlan;

  } else {
    // Несколько артикулов: пропорциональное распределение доступного времени
    // Доля каждого артикула = его трудоёмкость / суммарная трудоёмкость
    // Plan_ai = floor(availMin * tc_ai / totalTc / tc_ai) = floor(availMin / totalTc) — одинаково
    // Но лимит заказа применяется НЕЗАВИСИМО для каждого артикула
    for (const ai of ais) {
      const aiTc = tcForMicroRow(microRow, ai);
      // Пропорциональная доля времени: share = (aiTc / tc1) * effectiveAvailMin
      const shareMin = tc1 > 0 ? (aiTc / tc1) * effectiveAvailMin : 0;
      let aiPlan = aiTc > 0 ? Math.round(shareMin / aiTc) : 0;

      // Лимит остатка заказа по данному артикулу (6a — независимо)
      if (!microRow.planReleaseIsManual && microRow.releaseOrder) {
        const ord = S.orders.find(o => releaseOrderEq(o.number, microRow.releaseOrder));
        if (ord && (+ord.quantity || 0) > 0) {
          const relBefore = orderCoveredBefore(microRow.releaseOrder, myStage, microRow.date,
            { excludeRowId: microRow.id, articleItem: ai });
          const remaining = Math.max(0, +ord.quantity - relBefore);
          aiPlan = Math.min(aiPlan, remaining);
        }
      }
      microRow.planByArticle[ai] = aiPlan;
    }
    newPlan = Object.values(microRow.planByArticle).reduce((s, v) => s + v, 0);
  }

  if (!microRow.planReleaseIsManual) {
    if (microRow.planRelease !== newPlan) {
      microRow.planRelease = newPlan;
      microRow.planLaunch = newPlan;
      save();
      const planCell = document.querySelector(`.plan-release-${microRow.id}`);
      if (planCell) {
        const inp = planCell.querySelector('input');
        if (inp) inp.value = newPlan;
        else planCell.textContent = newPlan;
      }
    }
  }

  // План НЕ реагирует на факт: при перевыполнении план дня НЕ подтягивается к факту.
  // План — то, что запланировали; перевыполнение видно как факт>план, план остаётся чистым.

  // Разбивку осн/доп убрали: план — чистое число. Основной = весь план, доп всегда 0.
  {
    const _plan = +microRow.planRelease || 0;
    microRow.planReleaseMain = _plan;
    microRow.planReleaseExtra = 0;
    _mainUsed += tc1 > 0 ? _plan * tc1 / _lEffFactor : 0;
  }

  if (subs.length > 0) {
    // Подзаказы получают остаток минут после главного заказа, с ограничением по заказу и макроплану
    const usedMin = tc1 > 0 ? (microRow.planRelease || 0) * tc1 / _lEffFactor : 0;
    let usedSubMin = 0;
    for (let i = 0; i < subs.length; i++) {
      const sub = subs[i];
      const subTc = tcSubs[i] || 0;
      const subLEff = Math.max(0.01, (sub.learningEff ?? 100)) / 100;
      const remainMin = Math.max(0, availMin - usedMin - usedSubMin);
      // Эфф. освоения снижает выработку: effectiveMin = remainMin * lEff
      let sp = (subTc > 0 && remainMin > 0) ? Math.round(remainMin * subLEff / subTc) : 0;
      if (sub.releaseOrder === '__extra__') {
        // Cap по остатку Доп. объёма в макроплане для данного передела
        const macroExtra = S.macroplan
          .filter(mr => (mr.volumeType || 'main') === 'extra')
          .reduce((s, mr) => {
            const opRec = S.ops.find(o => o.name === mr.op && o.workshop === mr.workshop);
            return (opRec?.processType || mr.workshop) === myStage ? s + macroRowKitQuantity(mr) : s;
          }, 0);
        const alreadyExtra = S.microplan
          .filter(m => (m.stage || 'ШЦ') === myStage && m.id !== microRow.id)
          .reduce((s, m) => {
            if (m.releaseOrder === '__extra__') s += (+m.planRelease || 0);
            for (const s2 of (m.subOrders || [])) {
              if (s2.releaseOrder === '__extra__') s += (+s2.planRelease || 0);
            }
            return s;
          }, 0);
        sp = Math.min(sp, Math.max(0, macroExtra - alreadyExtra));
      } else if (sub.releaseOrder) {
        // Cap по остатку производственного заказа
        const ordSub = S.orders.find(o => releaseOrderEq(o.number, sub.releaseOrder));
        if (ordSub && (+ordSub.quantity || 0) > 0) {
          // Другие строки (main+подзаказы) того же заказа; текущую строку исключаем,
          // её вклад добавляем явно ниже (parentPlanSameOrd + prevSubsSameOrd).
          const releasedBeforeSub = orderCoveredBefore(sub.releaseOrder, myStage, microRow.date,
            { excludeRowId: microRow.id });
          const plannedSameDaySub = orderStagePlannedQty(sub.releaseOrder, myStage, microRow.date,
            { excludeRowId: microRow.id, metric: 'plan', when: '==', skipManualMain: true });
          // Также вычитаем план родительской строки и предыдущих подзаказов с тем же заказом
          const parentPlanSameOrd = releaseOrderEq(sub.releaseOrder, microRow.releaseOrder) ? (+microRow.planRelease || 0) : 0;
          const prevSubsSameOrd = subs.slice(0, i).filter(s => releaseOrderEq(s.releaseOrder, sub.releaseOrder)).reduce((a, s) => a + (+s.planRelease || 0), 0);
          const remainingSub = Math.max(0, +ordSub.quantity - releasedBeforeSub - plannedSameDaySub - parentPlanSameOrd - prevSubsSameOrd);
          sp = Math.min(sp, remainingSub);
        }
      }
      // Ручной план подзаказа фиксирован — авторасчёт не перекрывает его (резервирует пул как есть).
      if (sub.planReleaseIsManual) sp = +sub.planRelease || 0;
      // План подзаказа НЕ реагирует на факт (перевыполнение план не двигает).
      sub.planRelease = sp;
      // Разбивку осн/доп убрали: основной = весь план подзаказа, доп всегда 0.
      {
        sub.planReleaseMain = sp;
        sub.planReleaseExtra = 0;
        _mainUsed += subTc > 0 ? sp * subTc / subLEff : 0;
      }
      // Фактические физические минуты = штуки × tc / lEff (при 50% eff — в 2 раза больше)
      usedSubMin += subTc > 0 ? sp * subTc / subLEff : 0;
    }
  }
}

/**
 * Пересчёт авто-плана с учётом ОБЩЕГО ПУЛА мощности бригады-дня: сбрасываем авто-строки
 * группы и заполняем их последовательно, чтобы остаток пула делился между заказами одной
 * бригады корректно. Ручные строки фиксированы (их штуки резервируют пул).
 */
function recalcPlanRelease(row) {
  if (!row) return;
  const group = brigadeDayGroupRows(row);
  // Сброс: авто-планы строк + подзаказы всех строк группы.
  for (const r of group) {
    if (!r.planReleaseIsManual) { r.planRelease = 0; r.planLaunch = 0; }
    (r.subOrders || []).forEach(s => { if (!s.planReleaseIsManual) s.planRelease = 0; });
  }
  // Ручные первыми (фикс. план + пересчёт их подзаказов), затем авто (делят остаток пула).
  const ordered = [...group].sort((a, b) => {
    const am = a.planReleaseIsManual ? 0 : 1, bm = b.planReleaseIsManual ? 0 : 1;
    return am !== bm ? am - bm : (+a.id || 0) - (+b.id || 0);
  });
  for (const r of ordered) _recalcPlanReleaseCore(r);
}

/** Ручная установка плана выпуска по 1-му заказу (блокирует авторасчёт).
 *  Проверки плана (6a — остаток заказа, 6b — план предыдущего передела) имеют уровень
 *  'warn': это расхождение планирования, а не ошибка ввода. Раньше каждое било модалкой
 *  «Всё равно сохранить?», и при опережении или отставании заполнение микроплана
 *  превращалось в череду подтверждений. Теперь сохраняем молча, а расхождение видно
 *  жёлтым индикатором в строке (лимит и на сколько превышен) — см. блок про severity
 *  над `validateStageFact`. Проверку уровня 'stop' сюда добавлять с подтверждением,
 *  как сделано для факта в `updMFact`. */
async function setMicroPlanManual(id, val) {
  const r = byId(S.microplan, id);
  if (!r) return;
  flushMicroWorkerInputsFromDom(id);
  const v = Math.max(0, parseInt(val) || 0);
  r.planRelease = v;
  r.planReleaseIsManual = true;
  recalcPlanRelease(r);
  save();
  renderActive();
}

/** Сброс ручного плана — вернуть к авторасчёту. */
function resetMicroPlanAuto(id) {
  const r = byId(S.microplan, id);
  if (!r) return;
  r.planReleaseIsManual = false;
  recalcPlanRelease(r);
  save();
  renderActive();
}

/** Ручная установка плана выпуска по подзаказу (2-й и далее заказ в смене). */
async function setMicroSubPlanManual(rowId, subId, val) {
  const r = byId(S.microplan, rowId);
  if (!r) return;
  const sub = (r.subOrders || []).find(s => s.id === subId);
  if (!sub) return;
  const v = Math.max(0, parseInt(val) || 0);
  sub.planRelease = v;
  sub.planReleaseIsManual = true;
  recalcPlanRelease(r);
  save();
  renderActive();
}

/** Сброс ручного плана подзаказа — вернуть к авторасчёту. */
function resetMicroSubPlanAuto(rowId, subId) {
  const r = byId(S.microplan, rowId);
  if (!r) return;
  const sub = (r.subOrders || []).find(s => s.id === subId);
  if (!sub) return;
  sub.planReleaseIsManual = false;
  recalcPlanRelease(r);
  save();
  renderActive();
}

function addMicroSubOrder(rowId) {
  const r = byId(S.microplan, rowId);
  if (!r) return;
  if (!Array.isArray(r.subOrders)) r.subOrders = [];
  // Второй заказ в смене добавляем с планом 0 (ручной — авторасчёт его не трогает): по нему
  // просто вводят ФАКТ, сколько сделали. При желании план можно вернуть на авторасчёт кнопкой ↺.
  r.subOrders.push({ id: nid(), releaseOrder: '', articleItems: [], planRelease: 0, factRelease: 0, launchOrder: '', factLaunch: 0, planReleaseIsManual: true });
  recalcPlanRelease(r);
  save();
  renderActive();
}

function updMicroMainArticle(id, ai) {
  const r = byId(S.microplan, id);
  if (!r) return;
  flushMicroWorkerInputsFromDom(id);
  r.articleItems = ai ? [ai] : [];
  r.articleItem = ai || '';
  recalcPlanRelease(r);
  save();
  renderActive();
}

function clearMicroSubOrder(rowId, subId) {
  const r = byId(S.microplan, rowId);
  if (!r || !Array.isArray(r.subOrders)) return;
  r.subOrders = r.subOrders.filter(s => +s.id !== +subId);
  recalcPlanRelease(r);
  save();
  renderActive();
}

function updMicroSubOrderArticle(rowId, subId, ai) {
  const r = byId(S.microplan, rowId);
  if (!r) return;
  const sub = (r.subOrders || []).find(s => +s.id === +subId);
  if (!sub) return;
  sub.articleItems = ai ? [ai] : [];
  recalcPlanRelease(r);
  save();
  renderActive();
}

function updMicroLearningEff(id, valStr) {
  const r = S.microplan.find(m => m.id === id);
  if (!r) return;
  const v = Math.max(1, Math.min(200, Math.round(parseFloat(valStr) || 100)));
  r.learningEff = v;
  // Эфф. освоения влияет на общий пул бригады-дня и на остаток заказа по датам — пересчитываем всё.
  recalcAllMicroPlans();
  save(); renderActive();
}

function updMicroSubLearningEff(rowId, subId, valStr) {
  const r = S.microplan.find(m => m.id === rowId);
  if (!r) return;
  const sub = (r.subOrders || []).find(s => s.id === subId);
  if (!sub) return;
  sub.learningEff = Math.max(1, Math.min(200, Math.round(parseFloat(valStr) || 100)));
  recalcPlanRelease(r);
  save(); renderActive();
}

async function updMicroSubOrder(rowId, subId, field, val) {
  const r = byId(S.microplan, rowId);
  if (!r) return;
  const sub = (r.subOrders || []).find(s => +s.id === +subId);
  if (!sub) return;
  if (field === 'releaseOrder') {
    sub.releaseOrder = String(val || '');
    sub.articleItems = [];
    if (sub.releaseOrder === '__extra__') {
      const stageF = r.stage || 'ШЦ';
      const exIt = new Set();
      S.nomenclature
        .filter(n => (!r.op || !nomRowOps(n).length || nomRowOps(n).includes(r.op)) &&
                     (!r.workshop || !nomRowWorkshops(n).length || nomRowWorkshops(n).includes(r.workshop)))
        .forEach(n => {
          for (const item of routeForOp(n, r.op)) { if (item.stage === stageF) exIt.add(item.articleItem); }
          if (stageF === 'У') exIt.add(n.articleGp);
        });
      const mainAisE = new Set(microRowArticleItems(r));
      const usedAisE = new Set((r.subOrders || []).filter(s => +s.id !== +subId).flatMap(s => s.articleItems || []));
      const candE = [...exIt].filter(a => !mainAisE.has(a) && !usedAisE.has(a));
      sub.articleItems = candE.length ? [candE[0]] : [];
    } else if (sub.releaseOrder) {
      const o = S.orders.find(o => releaseOrderEq(o.number, sub.releaseOrder));
      if (o) {
        const candidates = getMicroItemOptions(o, r.op, r.workshop, r.stage || 'ШЦ');
        const withTc = candidates.filter(a => timeCostOf(a, r.op) > 0);
        sub.articleItems = withTc.length ? [withTc[0]] : (candidates.length ? [candidates[0]] : []);
      }
    }
  } else if (field === 'factRelease') {
    const newVal = Math.max(0, parseInt(val) || 0);
    // Межпередельная проверка для подзаказа
    if (sub.releaseOrder && newVal > 0) {
      const ord = S.orders.find(o => releaseOrderEq(o.number, sub.releaseOrder));
      if (ord) {
        const stage = r.stage || 'ШЦ';
        const subAi = (sub.articleItems || [])[0] || '';
        // Проверка по количеству заказа (для любого передела, включая первый).
        const orderQty = +ord.quantity || 0;
        if (orderQty > 0) {
          const usedQty = (stage === 'У'
              ? factByOrderStageArticle(sub.releaseOrder, stage, null, null)
              : factByOrderStageArticle(sub.releaseOrder, stage, subAi || null, null))
            - (+sub.factRelease || 0);
          const availQty = Math.max(0, orderQty - usedQty);
          if (newVal > availQty) {
            const msg = `Превышено количество заказа на переделе ${stage} (подзаказ)!\n\n` +
                        `Кол-во заказа: ${orderQty} шт\n` +
                        `Уже выпущено на ${stage}: ${usedQty} шт\n` +
                        `Доступно к выпуску: ${availQty} шт\n` +
                        `Вы пытаетесь ввести: ${newVal} шт`;
            if (!await _confirm(msg + '\n\nВсё равно сохранить?')) {
              renderActive();
              return;
            }
          }
        }
        const info = stageFactLimit(sub.releaseOrder, ord.articleGp, stage, subAi, null, r.op);
        if (info) {
          const alreadyUsed = factByOrderStageArticle(sub.releaseOrder, stage, subAi || null, null)
                              - (+sub.factRelease || 0); // вычитаем текущее значение подзаказа
          const available = Math.max(0, info.limit - alreadyUsed);
          if (newVal > available) {
            const msg = `Превышен лимит передела ${stage} (подзаказ)!\n\n` +
                        `${info.detail}\n` +
                        `Уже выпущено на ${stage}: ${alreadyUsed} шт\n` +
                        `Доступно к выпуску: ${available} шт\n` +
                        `Вы пытаетесь ввести: ${newVal} шт`;
            if (!await _confirm(msg + '\n\nВсё равно сохранить?')) {
              renderActive();
              return;
            }
          }
        }
      }
    }
    sub.factRelease = newVal;
  } else if (field === 'launchOrder') {
    sub.launchOrder = String(val || '');
  } else if (field === 'factLaunch') {
    const newVal = Math.max(0, parseFloat(val) || 0);
    // Межпередельная проверка запуска подзаказа
    if (microValidation && sub.launchOrder && newVal > 0) {
      const tempRow = { ...r, launchOrder: sub.launchOrder, articleItems: sub.articleItems || [], id: -1 };
      const check = validateStageLaunch(tempRow, newVal);
      if (!check.ok) {
        if (!await _confirm(check.msg + '\n\nВсё равно сохранить?')) {
          renderActive();
          return;
        }
      }
    }
    sub.factLaunch = newVal;
  }
  recalcPlanRelease(r);
  save();
  renderActive();
}

function toggleLaunchPanel(ev, rowId) {
  if (ev) {
    ev.preventDefault();
    ev.stopPropagation();
  }
  const wrap = document.getElementById('launch-wrap-' + rowId);
  if (!wrap) return;
  const opening = !wrap.classList.contains('launch-open');
  // Закрываем все другие открытые панели запуска
  document.querySelectorAll('#tab-microplan .launch-wrap.launch-open').forEach(w => {
    if (w !== wrap) w.classList.remove('launch-open');
  });
  wrap.classList.toggle('launch-open', opening);
  if (opening) {
    requestAnimationFrame(() => {
      positionLaunchPanel(wrap);
    });
  }
}


function positionLaunchPanel(wrap) {
  if (!wrap || !wrap.classList.contains('launch-open')) return;
  const panel = wrap.querySelector('.launch-panel');
  if (!panel) return;
  const trigger = wrap.querySelector('.launch-trigger');
  const rect = trigger ? trigger.getBoundingClientRect() : wrap.getBoundingClientRect();
  let left = rect.left;
  const panelWidth = 400; // соответствует min-width панели
  if (left + panelWidth > window.innerWidth - 10) {
    left = Math.max(10, window.innerWidth - panelWidth - 10);
  }
  const panelH = panel.offsetHeight || 320;
  let top = rect.bottom + 4;
  if (top + panelH > window.innerHeight - 8) {
    top = Math.max(8, rect.top - panelH - 4);
  }
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
  panel.style.width = 'auto';
  panel.style.maxWidth = 'min(540px, calc(100vw - 32px))';
}

function launchEntryAvailQty(order, articleItem, stage, excludeEntryId) {
  if (!order || stage === 'РЦ') return null;
  if (order === '__extra__') {
    const gp = articleItem ? (findNomByArticle(articleItem, null)?.articleGp || articleItem) : null;
    const prevStg = gp ? prevStageInRoute(gp, stage) : null;
    if (!prevStg) return null;

    // Найти артикул на предыдущем переделе, соответствующий текущему articleItem.
    // Используем позицию в маршруте: Рубашка[0] на ШЦ ↔ Рубашка[0] на АЦ.
    const nom = gp ? S.nomenclature.find(n => n.articleGp === gp) : null;
    const route = nom?.route || [];
    const curItems = route.filter(ri => ri.stage === stage);
    const prevItems = route.filter(ri => ri.stage === prevStg);
    const curIdx = articleItem ? curItems.findIndex(ri => ri.articleItem === articleItem) : -1;
    const prevAi = (curIdx >= 0 && curIdx < prevItems.length) ? prevItems[curIdx].articleItem : null;

    let prevFact = 0;
    for (const mr of S.microplan) {
      if (mr.stage !== prevStg) continue;
      if (mr.releaseOrder === '__extra__') {
        const mrAi = (microRowArticleItems(mr)[0]) || '';
        if (!prevAi || !mrAi || mrAi === prevAi) prevFact += (+mr.factRelease || 0);
      }
      for (const sub of (mr.subOrders || [])) {
        if (sub.releaseOrder !== '__extra__') continue;
        const subAi = (sub.articleItems || [])[0] || '';
        if (!prevAi || !subAi || subAi === prevAi) prevFact += (+sub.factRelease || 0);
      }
    }
    // Уже запущено на текущем переделе для этого же артикула (кроме текущей записи)
    let already = 0;
    for (const mr of S.microplan) {
      if ((mr.stage || 'ШЦ') !== stage) continue;
      for (const le of (mr.launches || [])) {
        if (excludeEntryId != null && +le.id === +excludeEntryId) continue;
        if (le.order !== '__extra__') continue;
        if (articleItem && le.articleItem && le.articleItem !== articleItem) continue;
        already += (+le.qty || 0);
      }
    }
    return { avail: Math.max(0, prevFact - already), prevStage: prevStg };
  }
  const ord = S.orders.find(o => releaseOrderEq(o.number, order));
  if (!ord) return null;
  const info = stageFactLimit(order, ord.articleGp, stage, articleItem, null);
  if (!info) return null;
  let already = 0;
  for (const mr of S.microplan) {
    if ((mr.stage || 'ШЦ') !== stage) continue;
    for (const le of (mr.launches || [])) {
      if (excludeEntryId != null && +le.id === +excludeEntryId) continue;
      if (releaseOrderEq(le.order, order)) {
        if (!articleItem || !le.articleItem || le.articleItem === articleItem) already += (+le.qty || 0);
      }
    }
  }
  return { avail: Math.max(0, info.limit - already), prevStage: info.prevStage };
}

function launchCellHtml(row) {
  if ((row.stage || 'ШЦ') === 'РЦ') return `<span style="color:#cbd5e1;">—</span>`;
  const launches = row.launches || [];

  const summary = launches.filter(e => e.order && e.qty).map(e => {
    const label = e.order === '__extra__' ? 'Доп. объём' : e.order;
    const product = e.articleItem ? nameOf(e.articleItem) || e.articleItem : '';
    return `${label}×${e.qty}${product ? ' ' + product : ''}`;
  }).join('; ');
  const deliveryCheck = checkDeliveryDate(row);
  return `<div class="launch-wrap" id="launch-wrap-${row.id}">
    <div style="font-size:11px; color:#475569; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px;" title="${esc(summary || '—')}">${totalQty ? summary : '<span style="color:#cbd5e1;">—</span>'}</div>
    <button type="button" class="micro-w-trigger${deliveryCheck.ok ? '' : ' micro-w-trigger--warn'}" onclick="toggleLaunchPanel(event, ${row.id})">▼ Запуск${deliveryCheck.ok ? '' : ' ⚠'}</button>
  </div>`;
}

function getMicroItemOptions(order, op, workshop, stage) {
  if (!order) return [];
  const stageFilter = stage || 'ШЦ';
  const items = new Set();
  const add = v => { if (v) items.add(v); };

  S.nomenclature
    // Фильтр по ОП; цех НЕ фильтруем — артикул определяется переделом (stageFilter),
    // а название цеха в строке может расходиться со справочником («АЦ» / «Цех автоматизации»).
    .filter(n => n.articleGp === order.articleGp &&
      (!op || !nomRowOps(n).length || nomRowOps(n).includes(op)))
    .forEach(n => {
      for (const item of routeForOp(n, op)) {
        if (item.stage === stageFilter) add(item.articleItem);
      }
      // У передела — артикул ГП
      if (stageFilter === 'У') add(n.articleGp);
    });

  // Если ничего не нашли по переделу — fallback к ГП артикулу
  if (!items.size) add(order.articleGp);

  const arr = [...items];
  arr.sort((a, b) => {
    if (a === order.articleGp) return -1;
    if (b === order.articleGp) return 1;
    return String(a).localeCompare(String(b), 'ru');
  });
  return arr;
}

function getRowArticleItemOptions(row) {
  const items = new Set();
  const add = v => { if (v) items.add(v); };
  const op = row.op || '';
  const workshop = row.workshop || '';

  if (row.releaseOrder === '__extra__') {
    const stageFilter = row.stage || 'ШЦ';
    S.nomenclature
      // Фильтр по ОП; цех НЕ фильтруем — артикул определяется переделом (тип цеха).
      .filter(n => (!op || !nomRowOps(n).length || nomRowOps(n).includes(op)))
      .forEach(n => {
        for (const item of routeForOp(n, op)) {
          if (item.stage === stageFilter) add(item.articleItem);
        }
        if (stageFilter === 'У') add(n.articleGp);
      });
    // текущий артикул оставляем в списке только если он подходит переделу
    if (row.articleItem && items.has(row.articleItem)) add(row.articleItem);
    if (!items.size) S.nomenclature.forEach(n => { if (n.articleGp) add(n.articleGp); });
    return [...items].sort((a, b) => String(a).localeCompare(String(b), 'ru'));
  }

  let order = null;
  if (row.releaseOrder) order = S.orders.find(o => releaseOrderEq(o.number, row.releaseOrder));

  if (order) {
    getMicroItemOptions(order, op, workshop, row.stage || 'ШЦ').forEach(add);
  } else {
    add(row.articleItem);
    return [...items];
  }
  // Артикулы строки добавляем только если они валидны для передела (иначе на АЦ
  // мог «прилипнуть» 01.000001 вместо 09.211933 и появиться лишним пунктом).
  for (const ai of microRowArticleItems(row)) if (items.has(ai)) add(ai);
  return [...items];
}

function updM(id, f, v) {
  const r = byId(S.microplan, id);
  if (r) {
    flushMicroWorkerInputsFromDom(id);
    r[f] = v;
    if (f === 'releaseOrder') {
      if (!v) {
        // Очищаем все связанные данные при сбросе заказа
        r.contractId = null;
        r.articleItem = '';
        r.articleItems = [];
        r.launches = [];
        r.factRelease = 0;
        r.planRelease = 0;
        r.planReleaseIsManual = false;
      } else {
        const order = S.orders.find(o => releaseOrderEq(o.number, v));
        if (order) {
          r.contractId = order.contractId;
          // Изделие пересчитываем всегда, когда текущий артикул не принадлежит НОВОМУ заказу.
          // Раньше условие было `if (!r.articleItem)` — при ИСПРАВЛЕНИИ заказа в уже заполненной
          // строке изделие и норма оставались от прежнего заказа, и план считался по чужой норме.
          // Если артикул подходит и новому заказу (общий ГП), выбор пользователя сохраняем.
          const opts = getMicroItemOptions(order, r.op, r.workshop, r.stage || 'ШЦ');
          const keepCurrent = r.articleItem && opts.includes(r.articleItem);
          if (!keepCurrent) {
            const ai = articleItemForCtx(order.articleGp, r.op, r.workshop, r.stage);
            if (ai) {
              r.articleItem = ai;
              r.articleItems = [ai];
            }
          }
        }
      }
      recalcPlanRelease(r);
    } else if (f === 'launchOrder') {
      const order = S.orders.find(o => releaseOrderEq(o.number, v));
      if (order && !r.releaseOrder) {
        r.contractId = order.contractId;
        if (!r.articleItem) {
          const ai = articleItemForCtx(order.articleGp, r.op, r.workshop, r.stage);
          if (ai) {
            r.articleItem = ai;
            r.articleItems = [ai];
          }
        }
      }
    } else if (f === 'articleItem') {
      r.articleItems = v ? [v] : [];
      recalcPlanRelease(r);
    } else if (f === 'op' || f === 'workshop') {
      recalcPlanRelease(r);
    }
    save();
    renderActive();
  }
}

async function updMFact(id, val) {
  const r = byId(S.microplan, id);
  if (r) {
    flushMicroWorkerInputsFromDom(id);
    const newVal = parseFloat(val) || 0;
    // Проверка по количеству заказа — всегда (не зависит от режима межпередельных проверок).
    const chkQty = validateFactVsOrderQty(r, newVal, id);
    if (!chkQty.ok) {
      if (!await _confirm(chkQty.msg + '\n\nВсё равно сохранить?')) {
        renderActive();
        return;
      }
    }
    if (microValidation) {
      // Межпередельная проверка (выпуск ≤ факт предыдущего передела)
      const check = validateStageFact(r, newVal, id);
      if (!check.ok) {
        if (!await _confirm(check.msg + '\n\nВсё равно сохранить?')) {
          renderActive();
          return;
        }
      }
      // Лимит 6d: выпуск ≤ сумма запусков (этот передел, эти даты)
      const chkLaunch = validateReleaseVsLaunches(r, newVal);
      if (!chkLaunch.ok) {
        if (!await _confirm(chkLaunch.msg + '\n\nВсё равно сохранить?')) {
          renderActive();
          return;
        }
      }
    }
    // Первый факт в месяце — фиксируем изначальный план (baseline, план на 100%) ДО пересчёта от факта.
    const _ym = (r.date || '').slice(0, 7);
    if (newVal > 0 && _ym && !(S.planBaseline || []).some(b => b.month === _ym)) {
      snapshotPlanBaselineForMonth(_ym);
    }
    r.factRelease = newVal;
    // Факт НЕ двигает план (не сжимаем и не пересчитываем авто-план от факта). Перевыполнение и
    // недовыполнение показываем ИНДИКАТОРАМИ при рендере: лишние (уже покрытые) смены заказа —
    // красным «с конца»; остаток к допланированию — в верхней таблице заказов.
    save();
    refreshWip(r.releaseOrder);
    renderActive();
  }
}

function isShiftPatternWorkDay(dateStr, cycleStart, workDays, restDays, skipWeekends) {
  const d0 = new Date(cycleStart);
  const d1 = new Date(dateStr);
  d0.setHours(0,0,0,0); d1.setHours(0,0,0,0);
  if (d1 < d0) return false;
  const period = workDays + restDays;
  if (period <= 0) return false;

  if (skipWeekends) {
    const dow1 = d1.getDay();
    if (dow1 === 0 || dow1 === 6) return false;
    const days = Math.round((d1 - d0) / 86400000);
    const fullWeeks = Math.floor(days / 7);
    const rem = days % 7;
    const startDow = d0.getDay();
    let wdCount = fullWeeks * 5;
    for (let i = 0; i < rem; i++) {
      const d = (startDow + i) % 7;
      if (d !== 0 && d !== 6) wdCount++;
    }
    return (wdCount % period) < workDays;
  }

  const diff = Math.round((d1 - d0) / 86400000);
  return (diff % period) < workDays;
}

function baseWorkForSchedule(sched, dateStr) {
  if (sched.graphPreset === '5/2') {
    const d0 = new Date(sched.cycleStart), d1 = new Date(dateStr);
    d0.setHours(0,0,0,0); d1.setHours(0,0,0,0);
    if (d1 < d0) return false;
    const dow = d1.getDay();
    return dow !== 0 && dow !== 6;
  }
  return isShiftPatternWorkDay(dateStr, sched.cycleStart, sched.workDays, sched.restDays, false);
}

function daysInMonth(ym) {
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}

function monthOfDate(dateStr) {
  return String(dateStr || '').slice(0, 7);
}

function getScheduleMonthOverride(scheduleId, ym) {
  return S.scheduleMonthOverrides.find(o => o.scheduleId === scheduleId && o.month === ym) || null;
}

function getScheduleView(scheduleId, ym) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return null;
  const ov = getScheduleMonthOverride(scheduleId, ym);
  return {
    ...sched,
    name: ov?.name ?? sched.name,
    shiftTime: ov?.shiftTime ?? sched.shiftTime,
    effPct: ov?.effPct ?? sched.effPct
  };
}

function updScheduleMonthField(scheduleId, field, rawVal, ym) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const month = ym || schedMonth;
  const idx = S.scheduleMonthOverrides.findIndex(o => o.scheduleId === scheduleId && o.month === month);
  const cur = idx >= 0 ? S.scheduleMonthOverrides[idx] : { scheduleId, month };

  if (field === 'name') {
    const name = String(rawVal || '').trim();
    if (name) cur.name = name;
  } else if (field === 'shiftTime') {
    const val = Number(rawVal);
    if (Number.isFinite(val) && val > 0) cur.shiftTime = val;
  } else if (field === 'effPct') {
    const t = String(rawVal ?? '').trim();
    if (t === '') {
      delete cur.effPct;
    } else {
      const val = Number(t);
      if (Number.isFinite(val) && val >= 0) cur.effPct = val;
    }
  }

  if ((cur.name == null || cur.name === sched.name) &&
      (cur.shiftTime == null || cur.shiftTime === sched.shiftTime) &&
      (cur.effPct == null || cur.effPct === sched.effPct)) {
    if (idx >= 0) S.scheduleMonthOverrides.splice(idx, 1);
  } else if (idx >= 0) {
    S.scheduleMonthOverrides[idx] = cur;
  } else {
    S.scheduleMonthOverrides.push(cur);
  }

  const dates = [...new Set(S.microplan
    .filter(m => m.scheduleId === scheduleId && monthOfDate(m.date) === month)
    .map(m => m.date))];
  for (const ds of dates) syncMicroplanFromSchedule(scheduleId, ds);

  save();
  renderSchedules();
  renderMicroplan();
}

function getCellState(sched, dateStr) {
  const ov = S.calOverrides.find(o=>o.scheduleId===sched.id && o.date===dateStr);
  const baseWork = baseWorkForSchedule(sched, dateStr);
  const schedView = getScheduleView(sched.id, monthOfDate(dateStr)) || sched;

  let dayType;
  if (ov && ov.dayType) dayType = ov.dayType;
  else dayType = baseWork ? 'work' : 'rest';

  // Состав работников дня: переопределение дня (workers) → масштаб базового по числу (старое staffCount) → базовый.
  let dayWorkers;
  if (ov && Array.isArray(ov.workers) && ov.workers.length) {
    dayWorkers = ov.workers;
  } else if (ov && ov.staffCount != null) {
    // Старое переопределение только числа (без явного состава дня) — распределяем ЦЕЛЫМИ.
    dayWorkers = scaleWorkersToInt(schedWorkers(sched), ov.staffCount);
  } else {
    dayWorkers = schedWorkers(sched);
  }
  const staffCount = dayWorkers.reduce((a, w) => a + (+w.staffCount || 0), 0);
  const effPct = schedEffWeighted({ workers: dayWorkers });
  let shiftTime = schedView.shiftTime;
  if (dayType === 'preholiday') shiftTime = Math.max(0, schedView.shiftTime - 60);
  if (dayType === 'vacation') shiftTime = 0;
  return {dayType, staffCount, shiftTime, baseWork, workers: dayWorkers, effPct};
}

function cycleCell(scheduleId, dateStr) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const {dayType} = getCellState(sched, dateStr);
  const cycle = ['work', 'preholiday', 'holiday', 'transfer', 'vacation', 'rest'];
  const idx = cycle.indexOf(dayType);
  const next = cycle[(idx + 1 + cycle.length) % cycle.length];
  setCellType(scheduleId, dateStr, next);
}

function setCellType(scheduleId, dateStr, dayType) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const baseWork = baseWorkForSchedule(sched, dateStr);
  const isDefault = (dayType === 'work' && baseWork) || (dayType === 'rest' && !baseWork);

  const idx = S.calOverrides.findIndex(o=>o.scheduleId===scheduleId && o.date===dateStr);
  if (isDefault) {
    if (idx >= 0) {
      delete S.calOverrides[idx].dayType;
      if (S.calOverrides[idx].staffCount == null || S.calOverrides[idx].staffCount === sched.staffCount) {
        S.calOverrides.splice(idx, 1);
      }
    }
  } else {
    if (idx >= 0) S.calOverrides[idx].dayType = dayType;
    else S.calOverrides.push({scheduleId, date: dateStr, dayType, staffCount: sched.staffCount});
  }
  syncMicroplanFromSchedule(scheduleId, dateStr);
  save(); renderSchedules(); renderMicroplan();
}

function saveCalOverride(scheduleId, dateStr, staffCount) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const idx = S.calOverrides.findIndex(o=>o.scheduleId===scheduleId && o.date===dateStr);
  if (idx >= 0) {
    S.calOverrides[idx].staffCount = staffCount;
    if (!S.calOverrides[idx].dayType && staffCount === sched.staffCount) S.calOverrides.splice(idx, 1);
  } else if (staffCount !== sched.staffCount) {
    S.calOverrides.push({scheduleId, date: dateStr, staffCount});
  }
  syncMicroplanFromSchedule(scheduleId, dateStr);
  save(); renderSchedules(); renderMicroplan();
}

function applyScheduleCellToMicroplanRow(sched, dateStr, row) {
  const cs = getCellState(sched, dateStr);
  if (cs.dayType === 'rest' || cs.dayType === 'holiday' || cs.dayType === 'vacation') return 'remove';
  // Переносим ВЕСЬ состав дня бригады в строку микроплана (группы с числ./эфф./абсентеизмом).
  // ЯВКУ (attendance) НЕ затираем при повторной генерации — она вводится вручную в микроплане.
  // Сопоставляем группы по порядку (order): если группа была — сохраняем её явку, иначе = списочной.
  const _prevWorkers = Array.isArray(row.workers) ? row.workers : [];
  row.workers = cs.workers.map((w, i) => {
    const _old = _prevWorkers[i];
    return {
      id: nid(),
      name: w.name || '',
      order: i,
      staffCount: +w.staffCount || 0,
      attendance: (_old && _old.attendance != null) ? (+_old.attendance || 0) : (+w.staffCount || 0),
      shiftTime: (cs.shiftTime > 0 && +w.shiftTime > 0) ? +w.shiftTime : cs.shiftTime,
      effPct: (w.effPct != null && Number.isFinite(+w.effPct)) ? Math.max(0, +w.effPct) : 100,
      absence: w.absence !== false
    };
  });
  row.op = sched.op;
  row.workshop = sched.workshop;
  const opRec = (S.ops || []).find(o => o.name === sched.op && o.workshop === sched.workshop);
  row.stage = opRec?.processType || 'ШЦ';
  recalcPlanRelease(row);
  return 'ok';
}

function syncMicroplanFromSchedule(scheduleId, dateStr) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  // Строк на одну бригаду+дату может быть несколько (копии строк, несколько заказов на смену).
  // Обрабатываем ВСЕ: рабочий день → обновляем параметры, выходной → затираем строку целиком.
  const rows = S.microplan.filter(m => m.scheduleId === scheduleId && m.date === dateStr);
  for (const row of rows) {
    if (applyScheduleCellToMicroplanRow(sched, dateStr, row) === 'remove') {
      const i = S.microplan.indexOf(row);
      if (i >= 0) S.microplan.splice(i, 1);
    }
  }
}

function renderSchedules() {

  const totalDays = daysInMonth(schedMonth);
  const [gy, gm] = schedMonth.split('-').map(Number);

  const dayDOW = [];

  for (let d = 1; d <= totalDays; d++) {
    dayDOW.push(new Date(gy, gm-1, d).getDay());

  const matchSchedOp = s => !opF || s.op === opF;
  const activeBrigadesForHeader = S.schedules.filter(s => inSchedMonth(s) && matchSchedOp(s));
  for (const s of activeBrigadesForHeader) {
    for (let d = 1; d <= totalDays; d++) {
      const dateStr = `${schedMonth}-${String(d).padStart(2,'0')}`;
      const {dayType} = getCellState(s, dateStr);
      if (dayType === 'holiday') colType[d] = 'holiday';
      else if (dayType === 'preholiday' && colType[d] !== 'holiday') colType[d] = 'preholiday';
    }
  }

    const dow = dayDOW[d-1];
    let cls = dow===0 ? 'day-sun' : dow===6 ? 'day-sat' : '';

    else if (colType[d] === 'preholiday') cls = 'col-preholiday';

    brigadeRows = `<tr><td colspan="${totalDays+2}" class="empty">${esc(emptyMsg)}</td></tr>`;
  } else {

      const skipMark = '';
      let cells = '';
      for (let d = 1; d <= totalDays; d++) {

        const {dayType, staffCount} = getCellState(s, dateStr);

        switch (dayType) {
          case 'holiday':
            cells += `<td class="sc-holiday" onclick="cycleCell(${s.id},'${dateStr}')" ${hint}>П</td>`;
            break;
          case 'preholiday':
            cells += `<td class="sc-preholiday" onclick="if(event.target===this)cycleCell(${s.id},'${dateStr}')" ${hint}>
              <input type="number" min="0" data-sc-cell="${s.id}|${dateStr}" value="${staffCount||''}" placeholder="0" readonly style="cursor:pointer;background:#fff" title="Клик — состав работников на этот день" onclick="event.stopPropagation();openDayCompPanel(${s.id},'${dateStr}',this)" onfocus="openDayCompPanel(${s.id},'${dateStr}',this)">
              <span class="sc-badge">пп−1ч</span>
              </td>`;
            break;
          case 'transfer':
            cells += `<td class="sc-transfer" onclick="if(event.target===this)cycleCell(${s.id},'${dateStr}')" ${hint}>
              <input type="number" min="0" data-sc-cell="${s.id}|${dateStr}" value="${staffCount||''}" placeholder="0" readonly style="cursor:pointer;background:#fff" title="Клик — состав работников на этот день" onclick="event.stopPropagation();openDayCompPanel(${s.id},'${dateStr}',this)" onfocus="openDayCompPanel(${s.id},'${dateStr}',this)">
              <span class="sc-badge">↑перен.</span>
              </td>`;
            break;
          case 'vacation':
            cells += `<td class="sc-vacation" onclick="cycleCell(${s.id},'${dateStr}')" ${hint}>О</td>`;
            break;
          case 'rest':
            cells += `<td class="sc-rest" onclick="cycleCell(${s.id},'${dateStr}')" ${hint}>·</td>`;
            break;
          default:
            cells += `<td class="sc-work" onclick="if(event.target===this)cycleCell(${s.id},'${dateStr}')" ${hint}>
              <input type="number" min="0" data-sc-cell="${s.id}|${dateStr}" value="${staffCount||''}" placeholder="0" readonly style="cursor:pointer;background:#fff" title="Клик — состав работников на этот день" onclick="event.stopPropagation();openDayCompPanel(${s.id},'${dateStr}',this)" onfocus="openDayCompPanel(${s.id},'${dateStr}',this)">
              </td>`;
        }
      }
      const nm = nextMonth(schedMonth);
      const hasNextMonth = s.activeMonths && s.activeMonths.includes(nm);
      const actionCell = `<td style="padding:4px 6px;white-space:nowrap;text-align:center;vertical-align:middle">
        <button class="btn btn-primary btn-sm" title="Бригада продолжает работу в ${mlabel(nm)}"
          onclick="brigadeAddMonth(${s.id})" ${hasNextMonth?'disabled':''}>+М</button>
        <button class="btn btn-danger btn-sm" style="margin-top:3px" title="Убрать бригаду из графика за ${mlabel(schedMonth)}"
          onclick="brigadeRemoveMonth(${s.id})">−М</button>
        </td>`;
      brigadeRows += `<tr>
        <td class="brigade-name">
          <input type="text" value="${esc(sView.name)}" title="Название бригады (переопределение на месяц)" onkeydown="if(event.key==='Enter')this.blur()" onblur="updScheduleMonthField(${s.id},'name',this.value,'${schedMonth}')">
          <small>${esc(s.op)} / ${esc(s.workshop)} · ${presetLabel}${skipMark} ·
            Смена <input type="number" value="${sView.shiftTime}" min="1" style="width:64px;display:inline-block" title="Сменное время, мин (на текущий месяц)" onkeydown="if(event.key==='Enter')this.blur()" onblur="updScheduleMonthField(${s.id},'shiftTime',this.value,'${schedMonth}')"> мин ·
            Числ./состав: ${schedWorkersCellHtml(s)} ·
            Эфф. <b id="sched-eff-${s.id}" title="Средневзвешенная из состава (по численности)">${Math.round(schedEffWeighted(s))}%</b> <span style="color:#94a3b8">авто</span>
          </small>
          </td>${cells}${actionCell}
        </tr>`;
    }
  }

  let frvRows = '';
  let totalFrvAll = 0;
  for (const s of activeBrigades) {
    const sView = getScheduleView(s.id, schedMonth) || s;
    let workCount = 0, totalFrv = 0;
    for (let d = 1; d <= totalDays; d++) {
      const dateStr = `${schedMonth}-${String(d).padStart(2,'0')}`;
      const {dayType, staffCount, shiftTime} = getCellState(s, dateStr);
      if (dayType === 'rest' || dayType === 'holiday' || dayType === 'vacation') continue;
      totalFrv += staffCount * shiftTime;

    }
    totalFrvAll += totalFrv;
    frvRows += `<tr>
        <td>${esc(sView.name)}</td>
        <td>${workCount} дн.</td>
        <td>${s.staffCount} чел. <span style="color:#94a3b8;font-size:10px">(номинал)</span></td>
        <td>${sView.shiftTime} мин</td>
        <td><b>${totalFrv.toLocaleString('ru')}</b> чел-мин</td>

  if (activeBrigades.length) {
    frvRows += `<tr style="background:#f8fafc;font-weight:700">
      <td colspan="4">ИТОГО</td>
      <td>${totalFrvAll.toLocaleString('ru')} чел-мин</td>

  }

  let html = `<div class="sec-title">График бригад — ${mlabel(schedMonth)}</div>

  <div class="ctx-bar">
    <label>ОП
      <select onchange="scheduleOp=this.value;renderSchedules()">
        <option value="" ${!opF ? 'selected' : ''}>Все ОП</option>
        ${allOps.map(n => `<option value="${esc(n)}" ${n === opF ? 'selected' : ''}>${esc(n)}</option>`).join('')}
      </select>

    <label>Месяц
      <span style="display:flex;align-items:center;gap:6px">
        <button type="button" class="ctx-bar-btn" onclick="schedMonth=prevMonth(schedMonth);renderSchedules()">◀</button>
        <b style="font-size:13px;white-space:nowrap;color:inherit">${mlabel(schedMonth)}</b>
        <button type="button" class="ctx-bar-btn" onclick="schedMonth=nextMonth(schedMonth);renderSchedules()">▶</button>
      </span>
    </label>
    <button class="ctx-bar-btn" onclick="scheduleOp='';schedMonth='${_curYm()}';renderSchedules()">Сбросить</button>
  </div>

  <div class="add-form" style="margin-bottom:8px;margin-top:10px">
    <label>Бригада<input id="sg-name" class="w160" placeholder="Бригада А"></label>

      <select id="sg-op" class="w120" onchange="sgOpChange()">
        <option value="">— выбрать —</option>
        ${allOps.map(op=>`<option value="${esc(op)}">${esc(op)}</option>`).join('')}

    <label>Тип графика
      <select id="sg-preset" class="w80" onchange="sgPresetChange()">
        <option value="2/2">2/2</option>
        <option value="5/2" selected>5/2</option>
        <option value="5/1">5/1</option>
        <option value="6/1">6/1</option>
        <option value="custom">Свой</option>
      </select>
    </label>
    <label id="sg-w-lbl" style="display:none">Рабочих<input id="sg-w" type="number" class="w80" value="5" min="1"></label>
    <label id="sg-r-lbl" style="display:none">Выходных<input id="sg-r" type="number" class="w80" value="2" min="0"></label>
    <label>Начало цикла<input id="sg-start" type="date" class="w120" value="${schedMonth}-01"></label>
    <label>Смена (мин)<input id="sg-shift" type="number" class="w80" value="480" min="1"></label>
    <label>Спис.числ.<input id="sg-staff" type="number" class="w80" placeholder="0" min="0"></label>
    <label>Эфф.%<input id="sg-eff" type="number" class="w80" value="100" min="0"></label>
    <label title="Абсентеизм по умолчанию для работников этой бригады (наследуется в составе микроплана; можно переопределить по людям)" style="flex-direction:row;align-items:center;gap:4px">Абсентеизм<input id="sg-abs" type="checkbox" checked style="width:16px;height:16px"></label>
    <button class="btn btn-primary" onclick="addSchedule()">+ Добавить</button>

      onclick="copyScheduleShiftsToNextMonth()">Копировать на след. месяц</button>

  <div class="sched-grid">
    <table>
      <thead><tr><th class="brigade-col">Бригада / ОП / Цех</th>${dayHeaders}<th style="min-width:80px;position:sticky;right:0;background:#f8fafc;z-index:2;text-align:center;font-size:10px;color:#94a3b8">+М / −М</th></tr></thead>
      <tbody>${brigadeRows}</tbody>
    </table>

  ${S.schedules.length > 0 ? `
  <div style="margin-top:10px">
    <div class="sec-title" style="margin-bottom:6px">ФРВ за ${mlabel(schedMonth)}</div>
    <div class="table-wrap"><table><thead>
      <tr><th>Бригада</th><th>Раб.дней</th><th>Числ.</th><th>Смена (ном.)</th><th>ФРВ (чел-мин)</th></tr>
    </thead><tbody>${frvRows}</tbody></table></div>
  </div>` : ''}

  <div style="background:white;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;margin-top:10px">
    <div class="sec-title" style="margin-bottom:6px">Сформировать микроплан за ${mlabel(schedMonth)}</div>
    <button class="btn btn-primary" onclick="generateFromSchedules()">Сформировать микроплан</button>
    ${schedResult ? `<div style="margin-top:8px;font-size:12px;color:#15803d">${esc(schedResult)}</div>` : ''}
  </div>
  <div id="day-comp-panel" class="micro-w-panel" style="display:none;position:fixed;z-index:340" onclick="event.stopPropagation()"></div>`;

  el.innerHTML = html;
  bindDayCompOutsideOnce();
  sgPresetChange();
  const sgOpEl = document.getElementById('sg-op');
  if (sgOpEl && scheduleOp) {
    sgOpEl.value = scheduleOp;
    sgOpChange();
  }
  // Восстановить открытую панель состава бригады после перерисовки.
  if (schedWorkersOpenId != null) {
    const _sid = schedWorkersOpenId;
    schedWorkersOpenId = null;
    requestAnimationFrame(() => { const w = document.getElementById('sched-w-wrap-' + _sid); if (w) toggleSchedWorkersPanel(null, _sid); });
  }
}

function prevMonth(ym) {
  const [y,m] = ym.split('-').map(Number);
  return m === 1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`;
}
function nextMonth(ym) {
  const [y,m] = ym.split('-').map(Number);
  return m === 12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
}

function sgOpChange() {
  const op = document.getElementById('sg-op').value;
  const wsSel = document.getElementById('sg-ws');
  const ws = [...new Set(S.ops.filter(o=>o.name===op).map(o=>o.workshop))];
  wsSel.innerHTML = `<option value="">— выбрать —</option>` + ws.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');
  if (ws.length === 1) wsSel.value = ws[0];
  const effSel = document.getElementById('sg-eff');
  if (op && wsSel.value) effSel.value = String(defaultEffPct(op, wsSel.value));
  if (op && wsSel.value) document.getElementById('sg-shift').value = shiftDurationOf(op, wsSel.value);
}

function brigadeAddMonth(scheduleId) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  const nm = nextMonth(schedMonth);
  if (!sched.activeMonths) sched.activeMonths = [schedMonth];
  if (!sched.activeMonths.includes(nm)) sched.activeMonths.push(nm);
  save();
  schedResult = `${sched.name}: добавлен в график за ${mlabel(nm)}.`;
  schedMonth = nm;
  renderSchedules();
}

async function brigadeRemoveMonth(scheduleId) {
  const sched = byId(S.schedules, scheduleId);
  if (!sched) return;
  if (!await _confirm(`Убрать бригаду «${sched.name}» из графика за ${mlabel(schedMonth)}?`)) return;
  if (sched.activeMonths) {
    sched.activeMonths = sched.activeMonths.filter(m => m !== schedMonth);
    if (sched.activeMonths.length === 0) {
      S.schedules = S.schedules.filter(s => s.id !== scheduleId);
      schedResult = `Бригада «${sched.name}» удалена из всех месяцев.`;
    } else {
      schedResult = `${sched.name}: убран из графика за ${mlabel(schedMonth)}.`;
    }
  } else {
    sched.activeMonths = [];
    S.schedules = S.schedules.filter(s => s.id !== scheduleId);
    schedResult = `Бригада «${sched.name}» удалена.`;
  }
  save();
  renderSchedules();
}

function sgPresetChange() {
  const v = document.getElementById('sg-preset').value;
  const custom = v === 'custom';
  document.getElementById('sg-w-lbl').style.display = custom ? '' : 'none';
  document.getElementById('sg-r-lbl').style.display = custom ? '' : 'none';
  if (!custom && SCHED_PRESETS[v]) {
    document.getElementById('sg-w').value = SCHED_PRESETS[v].w;
    document.getElementById('sg-r').value = SCHED_PRESETS[v].r;
  }
}

function addSchedule() {
  const name        = document.getElementById('sg-name').value.trim();
  const op          = document.getElementById('sg-op').value;
  const workshop    = document.getElementById('sg-ws').value;
  const preset      = document.getElementById('sg-preset').value;
  const cycleStart  = document.getElementById('sg-start').value;
  const shiftTime   = +document.getElementById('sg-shift').value;
  const staffCount  = +document.getElementById('sg-staff').value;
  const effPct      = +document.getElementById('sg-eff').value;
  const skipWeekends = false;

  if (!name || !op || !workshop || !cycleStart) {
    _alert('Заполните: бригада, ОП, цех, начало цикла');
    return;
  }

  let workDays, restDays;
  if (preset === 'custom') {
    workDays = +document.getElementById('sg-w').value;
    restDays = +document.getElementById('sg-r').value;
  } else {
    workDays = SCHED_PRESETS[preset].w;
    restDays = SCHED_PRESETS[preset].r;
  }
  if (workDays < 1) { _alert('Рабочих дней должно быть ≥ 1'); return; }

  const graphPreset = (preset === 'custom') ? 'custom' : preset;
  const absence = document.getElementById('sg-abs') ? document.getElementById('sg-abs').checked : true;
  // Стартовый состав — одна группа из введённой численности/эфф (далее можно разбить в «Состав»).
  const workers = [{ id: nid(), name: name || '', staffCount, effPct, absence }];
  S.schedules.push({ id: nid(), name, op, workshop, workDays, restDays, cycleStart, shiftTime, staffCount, effPct, skipWeekends, graphPreset, absence, workers, activeMonths: [schedMonth] });
  // renderSchedules() напрямую, без renderTab — чистим черновик, suppress не нужен.
  clearAddFormDraft(['sg-name','sg-op','sg-ws','sg-preset','sg-start','sg-shift','sg-staff','sg-eff','sg-w','sg-r']);
  save();
  renderSchedules();
}

function updSchedule(id, field, val) {
  const s = byId(S.schedules, id);
  if (!s) return;
  s[field] = val;
  if (['staffCount','shiftTime','effPct','op','workshop'].includes(field)) {
    const dates = [...new Set(S.microplan.filter(m=>m.scheduleId===id).map(m=>m.date))];
    for (const ds of dates) syncMicroplanFromSchedule(id, ds);
  }
  save();
  renderSchedules();
  renderMicroplan();
}

async function deleteSchedule(id) {
  if (!await _confirm('Удалить бригаду из графика?')) return;
  S.schedules = S.schedules.filter(s=>s.id!==id);
  save(); renderSchedules();
}

function generateFromSchedules() {
  if (!S.schedules.length) { _alert('Нет бригад в графике'); return; }
  const totalDays = daysInMonth(schedMonth);
  let added = 0, updated = 0, removed = 0;
  const opF = scheduleOp || '';
  const activeSched = S.schedules.filter(s =>
    (!s.activeMonths || s.activeMonths.includes(schedMonth)) && (!opF || s.op === opF)
  );
  if (!activeSched.length) {
    _alert(opF ? 'Нет бригад выбранного ОП на этот месяц. Сбросьте фильтр ОП или добавьте бригаду.' : 'Нет активных бригад на выбранный месяц.');
    return;
  }

  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${schedMonth}-${String(d).padStart(2,'0')}`;
    for (const sched of activeSched) {
      const {dayType, staffCount, shiftTime, workers: dayWorkers} = getCellState(sched, dateStr);
      const schedView = getScheduleView(sched.id, monthOfDate(dateStr)) || sched;
      if (dayType === 'rest' || dayType === 'holiday' || dayType === 'vacation') {
        // День стал выходным — затираем ВСЕ строки этой бригады на эту дату (не только первую).
        const before = S.microplan.length;
        S.microplan = S.microplan.filter(m => !(m.scheduleId === sched.id && m.date === dateStr));
        removed += before - S.microplan.length;
        continue;
      }
      const existing = S.microplan.find(m => m.scheduleId === sched.id && m.date === dateStr);
      if (existing) {
        if (applyScheduleCellToMicroplanRow(sched, dateStr, existing) === 'remove') {
          S.microplan.splice(S.microplan.indexOf(existing), 1); removed++;
        } else { updated++; }
        continue;
      }
      const opRecNew = (S.ops || []).find(o => o.name === sched.op && o.workshop === sched.workshop);
      S.microplan.push({
        id: nid(), date: dateStr, scheduleId: sched.id,
        contractId: 0, articleItem: '', articleItems: [],
        op: sched.op, workshop: sched.workshop,
        stage: opRecNew?.processType || 'ШЦ',
        releaseOrder: '', launchOrder: '',
        planLaunch: 0, factLaunch: 0,
        planRelease: 0, factRelease: 0,
        workers: (dayWorkers && dayWorkers.length ? dayWorkers : [{staffCount, effPct: schedView.effPct, absence: sched.absence !== false, name: sched.name}]).map((w, i) => ({
          id: nid(),
          name: w.name || '',
          order: i,
          staffCount: +w.staffCount || 0,
          attendance: +w.staffCount || 0,
          shiftTime: (shiftTime > 0 && +w.shiftTime > 0) ? +w.shiftTime : shiftTime,
          effPct: (w.effPct != null && Number.isFinite(+w.effPct)) ? Math.max(0, +w.effPct) : defaultEffPct(sched.op, sched.workshop),
          absence: w.absence !== false   // абсентеизм группы из состава бригады
        }))
      });
      added++;
    }
  }

  save();
  const parts = [`добавлено ${added}`, `обновлено ${updated}`];
  if (removed) parts.push(`удалено ${removed}`);
  schedResult = `${parts.join(', ')} за ${mlabel(schedMonth)}.`;
  renderSchedules();
  renderMicroplan();
}
